<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDORA - نظام إدارة الطلبات المتكامل</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js">
    </script>
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #7a8499;
            --line: #e8ebf2;
            --primary: #5b5ce2;
            --success: #16a56b;
            --warning: #e99a20;
            --danger: #e04f5f;
            --info: #2588d9;
            --shadow: 0 8px 24px rgba(28, 39, 75, 0.08);
            --radius: 14px;
            --transition: 0.25s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ========== LOGIN ========== */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #11152a, #1b2140);
            padding: 20px;
        }
        .login-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-box h2 {
            font-size: 28px;
            margin-bottom: 4px;
            color: #11152a;
        }
        .login-box p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #2a2f45;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            transition: var(--transition);
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.12);
        }
        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 18px;
            transition: var(--transition);
        }
        .login-box .btn-primary:hover {
            background: #4a4bcc;
            transform: translateY(-1px);
        }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .login-role {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
            text-align: center;
        }
        .login-role strong {
            color: var(--primary);
        }

        /* ========== APP LAYOUT ========== */
        #app {
            display: none;
            min-height: 100vh;
        }
        .sidebar {
            width: 270px;
            background: #11152a;
            color: #fff;
            padding: 20px 14px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            transition: var(--transition);
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px 26px;
        }
        .sidebar .brand-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #6b6ce9, #9a8cff);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 19px;
        }
        .sidebar .brand h2 {
            font-size: 18px;
            margin: 0;
        }
        .sidebar .brand small {
            color: #9298b3;
            font-size: 11px;
        }
        .close-sidebar {
            color: #9298b3;
            font-size: 22px;
            padding: 4px 8px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .close-sidebar:hover {
            color: #fff;
        }
        .nav-title {
            font-size: 11px;
            color: #717895;
            margin: 18px 12px 8px;
            letter-spacing: 0.5px;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: #c7cbe0;
            margin: 3px 0;
            font-size: 14px;
            transition: var(--transition);
        }
        .nav a:hover,
        .nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .nav a.active {
            box-shadow: inset -3px 0 0 #8b8cf4;
        }
        .nav .icon {
            width: 24px;
            text-align: center;
            font-size: 16px;
        }
        .badge-nav {
            margin-right: auto;
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .main {
            margin-right: 270px;
            padding: 22px 28px 40px;
            min-height: 100vh;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .page-title h1 {
            font-size: 24px;
            margin: 0 0 3px;
        }
        .page-title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 9px 16px;
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff !important;
        }
        .btn-primary:hover {
            background: #4a4bcc;
            border-color: #4a4bcc;
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #fff !important;
        }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff !important;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            position: relative;
            font-size: 18px;
            display: grid;
            place-items: center;
        }
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            top: 8px;
            left: 8px;
        }
        .mobile-menu {
            display: none;
        }

        /* ========== CARDS ========== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 12px 32px rgba(28, 39, 75, 0.1);
        }
        .stat {
            padding: 18px 20px;
        }
        .stat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #f0f0ff;
            color: var(--primary);
            font-size: 18px;
        }
        .stat h2 {
            font-size: 26px;
            margin: 12px 0 4px;
        }
        .stat .change {
            font-size: 12px;
        }
        .up {
            color: var(--success);
        }
        .down {
            color: var(--danger);
        }

        /* ========== GRID ========== */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        .panel {
            padding: 18px 20px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-head h3 {
            font-size: 16px;
            margin: 0;
        }
        .panel-head .muted {
            color: var(--muted);
            font-size: 12px;
        }
        .chart-wrap {
            height: 260px;
        }

        /* ========== STATUS LIST ========== */
        .status-list {
            display: grid;
            gap: 12px;
        }
        .status-row {
            display: grid;
            grid-template-columns: 85px 1fr 45px;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .bar {
            height: 8px;
            background: #edf0f5;
            border-radius: 99px;
            overflow: hidden;
        }
        .bar span {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: var(--primary);
        }

        /* ========== TABLE ========== */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }
        th {
            color: var(--muted);
            font-weight: 600;
            background: #fafbfc;
        }
        .badge {
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-success {
            background: #e9f8f1;
            color: #0b8b59;
        }
        .badge-warning {
            background: #fff5df;
            color: #b87300;
        }
        .badge-danger {
            background: #ffeaed;
            color: #c83949;
        }
        .badge-info {
            background: #e9f4ff;
            color: #1671b9;
        }
        .badge-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .customer {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ececff;
            color: #5354ca;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            display: none;
        }

        /* ========== FORMS ========== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            outline: none;
            transition: var(--transition);
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 18px;
        }
        .modal-box .close-modal {
            float: left;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .close-modal:hover {
            color: var(--danger);
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #151a2d;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.35s ease;
            z-index: 200;
            font-size: 14px;
            max-width: 380px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ========== USER CARDS ========== */
        .user-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .user-card:hover {
            box-shadow: var(--shadow);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        .user-details h4 {
            margin: 0 0 4px;
        }
        .user-details small {
            color: var(--muted);
        }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-admin {
            background: #e74c3c;
            color: #fff;
        }
        .role-moderator {
            background: #f39c12;
            color: #fff;
        }
        .role-marketer {
            background: #2ecc71;
            color: #fff;
        }
        .role-customer_service {
            background: #3498db;
            color: #fff;
        }
        .user-actions {
            display: flex;
            gap: 8px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 760px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .close-sidebar {
                display: block;
            }
            .main {
                margin-right: 0;
                padding: 16px 14px;
            }
            .mobile-menu {
                display: inline-flex;
            }
            .topbar {
                align-items: flex-start;
            }
            .actions .hide-mobile {
                display: none;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
            .stat h2 {
                font-size: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 20px;
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .page-title h1 {
                font-size: 20px;
            }
            .actions {
                gap: 6px;
            }
            .btn {
                font-size: 12px;
                padding: 7px 12px;
            }
        }

        .text-muted {
            color: var(--muted);
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gap-1 {
            gap: 6px;
        }
        .hidden {
            display: none !important;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .w-full {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ========== TOAST ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== LOGIN ========== -->
    <div id="loginPage">
        <div class="login-box">
            <h2>🔐 MEDORA</h2>
            <p>نظام إدارة الطلبات المتكامل – سجل الدخول</p>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@medora.com" required />
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
                <div class="error" id="loginError">بيانات الدخول غير صحيحة</div>
                <div class="login-role">
                    📌 <strong>مدير:</strong> admin@medora.com / admin123<br>
                    📌 <strong>مشرف:</strong> moderator@medora.com / mod123<br>
                    📌 <strong>مسوق:</strong> marketer@medora.com / market123<br>
                    📌 <strong>خدمة عملاء:</strong> cs@medora.com / cs123
                </div>
            </form>
        </div>
    </div>

    <!-- ========== APP ========== -->
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-inner">
                    <div class="logo">M</div>
                    <div>
                        <h2>MEDORA</h2>
                        <small id="userRoleDisplay">مدير النظام</small>
                    </div>
                </div>
                <span class="close-sidebar" id="closeSidebar">✕</span>
            </div>
            <div class="nav-title">الرئيسية</div>
            <nav class="nav" id="mainNav"></nav>
            <div style="margin-top:30px;border-top:1px solid #292e43;padding-top:16px">
                <a href="#" onclick="logout()" style="color:#9298b3;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;">
                    <span>🚪</span> تسجيل الخروج
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main" id="mainContent">
            <header class="topbar">
                <div class="page-title">
                    <button class="btn mobile-menu" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">لوحة التحكم</h1>
                    <p id="todayDate"></p>
                </div>
                <div class="actions">
                    <button class="btn hide-mobile" onclick="refreshData()">↻ تحديث</button>
                    <button class="btn btn-primary hide-mobile" id="actionBtn" onclick="handleActionBtn()">＋ طلب جديد</button>
                    <button class="icon-btn" onclick="notify()">🔔<span class="dot"></span></button>
                    <button class="icon-btn" onclick="toggleTheme()">☾</button>
                </div>
            </header>
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- ========== MODAL ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <h3 id="modalTitle">عنوان</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ================================================================
        // FIREBASE CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCL92zT2GyJEM1awmJ7ouS6TfaaRZKvofc",
            authDomain: "medora-4d7ae.firebaseapp.com",
            projectId: "medora-4d7ae",
            storageBucket: "medora-4d7ae.firebasestorage.app",
            messagingSenderId: "454112159901",
            appId: "1:454112159901:web:abe06158f462cfbb4a8c74",
            measurementId: "G-KKPM4D930B"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ================================================================
        // GLOBALS
        // ================================================================
        let currentUser = null;
        let currentUserRole = 'marketer';
        let currentUserData = null;
        let allUsers = [];
        let allMarketers = [];
        let allProducts = [];
        let allOrders = [];
        let allSettings = {
            shippingCost: 30,
            regions: { 'بحري': ['الإسكندرية', 'دمياط', 'بورسعيد'], 'قبلي': ['أسيوط', 'سوهاج', 'قنا'],
                'داخلي': ['القاهرة', 'الجيزة', 'القليوبية'] },
            shippingTypes: ['شركة شحن', 'مندوب', 'داخلي - شركة', 'داخلي - مندوب']
        };
        let currentTab = 'dashboard';

        // Unsubscribers
        let unsubOrders = null,
            unsubMarketers = null,
            unsubProducts = null,
            unsubUsers = null,
            unsubSettings = null;

        // ================================================================
        // DOM HELPERS
        // ================================================================
        const $ = (id) => document.getElementById(id);
        const $$ = (sel) => document.querySelectorAll(sel);

        function toast(msg, type = 'info') {
            const t = $('toast');
            t.textContent = msg;
            t.style.background = type === 'danger' ? '#c0392b' : '#151a2d';
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 2800);
        }

        function closeModal() { $('modalOverlay').classList.remove('open'); }

        function openModal(title, html) {
            $('modalTitle').textContent = title;
            $('modalBody').innerHTML = html;
            $('modalOverlay').classList.add('open');
        }

        function toggleSidebar() {
            $('sidebar').classList.toggle('open');
        }

        function closeSidebar() {
            $('sidebar').classList.remove('open');
        }

        let darkMode = false;

        function toggleTheme() {
            darkMode = !darkMode;
            const root = document.documentElement;
            if (darkMode) {
                root.style.setProperty('--bg', '#0d1020');
                root.style.setProperty('--card', '#171b2d');
                root.style.setProperty('--text', '#eef0f7');
                root.style.setProperty('--muted', '#9299b3');
                root.style.setProperty('--line', '#292e43');
                const lb = document.querySelector('.login-box');
                if (lb) lb.style.background = '#171b2d';
            } else {
                root.style.setProperty('--bg', '#f5f7fb');
                root.style.setProperty('--card', '#ffffff');
                root.style.setProperty('--text', '#172033');
                root.style.setProperty('--muted', '#7a8499');
                root.style.setProperty('--line', '#e8ebf2');
                const lb = document.querySelector('.login-box');
                if (lb) lb.style.background = '#ffffff';
            }
        }

        function notify() { toast('🔔 لديك 3 إشعارات جديدة'); }

        function refreshData() {
            toast('🔄 تم تحديث البيانات');
            loadAllData();
        }

        function handleActionBtn() {
            if (currentTab === 'users' && currentUserRole === 'admin') showAddUser();
            else if (currentTab === 'marketers' && (currentUserRole === 'admin' || currentUserRole === 'moderator'))
            showAddMarketer();
            else if (currentTab === 'products' && currentUserRole === 'admin') showAddProduct();
            else if (currentTab === 'settings' && currentUserRole === 'admin') showSettingsEditor();
            else showAddOrder();
        }

        // ================================================================
        // LOGIN / LOGOUT
        // ================================================================
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = $('loginEmail').value.trim();
            const pass = $('loginPassword').value.trim();
            const errEl = $('loginError');
            errEl.style.display = 'none';
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                toast('✅ مرحباً بك');
            } catch (err) {
                errEl.textContent = err.message || 'خطأ في تسجيل الدخول';
                errEl.style.display = 'block';
            }
            return false;
        };

        window.logout = async function() {
            await auth.signOut();
            toast('🚪 تم تسجيل الخروج');
            $('app').style.display = 'none';
            $('loginPage').style.display = 'flex';
            if (unsubOrders) { unsubOrders();
                unsubOrders = null; }
            if (unsubMarketers) { unsubMarketers();
                unsubMarketers = null; }
            if (unsubProducts) { unsubProducts();
                unsubProducts = null; }
            if (unsubUsers) { unsubUsers();
                unsubUsers = null; }
            if (unsubSettings) { unsubSettings();
                unsubSettings = null; }
        };

        // ================================================================
        // AUTH STATE
        // ================================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUserData = userDoc.data();
                        currentUserRole = currentUserData.role || 'marketer';
                    } else {
                        currentUserRole = 'marketer';
                        currentUserData = { email: user.email, role: 'marketer', name: 'مسوق' };
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: 'marketer',
                            name: 'مسوق',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                } catch (e) {
                    console.warn('User role error:', e);
                    currentUserRole = 'marketer';
                    currentUserData = { email: user.email, role: 'marketer', name: 'مسوق' };
                }

                $('loginPage').style.display = 'none';
                $('app').style.display = 'block';
                const roleNames = { admin: 'مدير النظام', moderator: 'مشرف', marketer: 'مسوق',
                customer_service: 'خدمة عملاء' };
                $('userRoleDisplay').textContent = roleNames[currentUserRole] || 'مسوق';
                $('todayDate').textContent = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'full' }).format(new Date());
                initApp();
            } else {
                $('app').style.display = 'none';
                $('loginPage').style.display = 'flex';
                if (unsubOrders) { unsubOrders();
                    unsubOrders = null; }
                if (unsubMarketers) { unsubMarketers();
                    unsubMarketers = null; }
                if (unsubProducts) { unsubProducts();
                    unsubProducts = null; }
                if (unsubUsers) { unsubUsers();
                    unsubUsers = null; }
                if (unsubSettings) { unsubSettings();
                    unsubSettings = null; }
            }
        });

        // ================================================================
        // INIT APP
        // ================================================================
        function initApp() {
            buildNav();
            loadAllData();

            if (unsubOrders) unsubOrders();
            if (unsubMarketers) unsubMarketers();
            if (unsubProducts) unsubProducts();
            if (unsubUsers) unsubUsers();
            if (unsubSettings) unsubSettings();

            unsubOrders = db.collection('orders').onSnapshot(snap => {
                allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentPage();
            }, err => console.warn('Orders error:', err));

            unsubMarketers = db.collection('marketers').onSnapshot(snap => {
                allMarketers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentPage();
            }, err => console.warn('Marketers error:', err));

            unsubProducts = db.collection('products').onSnapshot(snap => {
                allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentPage();
            }, err => console.warn('Products error:', err));

            unsubUsers = db.collection('users').onSnapshot(snap => {
                allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentPage();
            }, err => console.warn('Users error:', err));

            unsubSettings = db.collection('settings').doc('general').onSnapshot(doc => {
                if (doc.exists) allSettings = doc.data();
                renderCurrentPage();
            }, err => console.warn('Settings error:', err));

            // ========== SIDEBAR CLOSE BEHAVIOR ==========
            setupSidebarClose();
        }

        // ================================================================
        // SIDEBAR CLOSE LOGIC
        // ================================================================
        function setupSidebarClose() {
            const sidebar = $('sidebar');
            const closeBtn = $('closeSidebar');
            const mainContent = $('mainContent');
            const mobileMenuBtn = document.querySelector('.mobile-menu');

            // Close button
            if (closeBtn) {
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.remove('open');
                });
            }

            // Close when clicking a nav link (inside sidebar)
            document.querySelectorAll('#mainNav a').forEach(link => {
                link.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                });
            });

            // Close when clicking outside sidebar (on main content) and not on mobile menu button
            document.addEventListener('click', (e) => {
                const isSidebar = sidebar.contains(e.target);
                const isMobileMenu = mobileMenuBtn && mobileMenuBtn.contains(e.target);
                if (!isSidebar && !isMobileMenu && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            });

            // Prevent closing when clicking inside sidebar
            sidebar.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
        function buildNav() {
            const nav = $('mainNav');
            let links = [];
            if (currentUserRole === 'admin') {
                links = [
                    { id: 'dashboard', label: '📊 لوحة التحكم' },
                    { id: 'users', label: '👥 إدارة الحسابات' },
                    { id: 'marketers', label: '👤 المسوقين' },
                    { id: 'products', label: '📦 المنتجات' },
                    { id: 'orders', label: '📋 الطلبات' },
                    { id: 'settings', label: '⚙️ الإعدادات' },
                ];
            } else if (currentUserRole === 'moderator') {
                links = [
                    { id: 'dashboard', label: '📊 لوحة التحكم' },
                    { id: 'orders', label: '📋 طلبات المسوقين' },
                    { id: 'marketers', label: '👤 المسوقين التابعين' },
                ];
            } else if (currentUserRole === 'customer_service') {
                links = [
                    { id: 'dashboard', label: '📊 لوحة التحكم' },
                    { id: 'orders', label: '📋 جميع الطلبات' },
                ];
            } else { // marketer
                links = [
                    { id: 'dashboard', label: '📊 لوحتي' },
                    { id: 'orders', label: '📋 طلباتي' },
                    { id: 'newOrder', label: '➕ إضافة طلب' },
                ];
            }
            nav.innerHTML = links.map(l =>
                `<a href="#" class="${l.id === currentTab ? 'active' : ''}" data-tab="${l.id}">${l.label}</a>`
            ).join('');
            nav.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentTab = a.dataset.tab;
                    nav.querySelectorAll('a').forEach(x => x.classList.remove('active'));
                    a.classList.add('active');
                    renderCurrentPage();
                });
            });

            const titles = {
                dashboard: 'لوحة التحكم',
                users: 'إدارة الحسابات',
                marketers: 'إدارة المسوقين',
                products: 'إدارة المنتجات',
                orders: 'إدارة الطلبات',
                settings: 'إعدادات النظام',
                newOrder: 'إضافة طلب جديد'
            };
            $('pageTitle').textContent = titles[currentTab] || 'لوحة التحكم';

            const actionBtn = $('actionBtn');
            if (currentTab === 'newOrder' || currentTab === 'orders') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ طلب جديد';
            } else if (currentTab === 'users' && currentUserRole === 'admin') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ حساب جديد';
            } else if (currentTab === 'marketers' && (currentUserRole === 'admin' || currentUserRole === 'moderator')) {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ مسوق جديد';
            } else if (currentTab === 'products' && currentUserRole === 'admin') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ منتج جديد';
            } else if (currentTab === 'settings' && currentUserRole === 'admin') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '⚙️ تعديل الإعدادات';
            } else {
                actionBtn.style.display = 'none';
            }
        }

        // ================================================================
        // RENDER
        // ================================================================
        function renderCurrentPage() {
            const content = $('pageContent');
            switch (currentTab) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'users':
                    content.innerHTML = renderUsers();
                    break;
                case 'marketers':
                    content.innerHTML = renderMarketers();
                    break;
                case 'products':
                    content.innerHTML = renderProducts();
                    break;
                case 'orders':
                    content.innerHTML = renderOrders();
                    break;
                case 'settings':
                    content.innerHTML = renderSettings();
                    break;
                case 'newOrder':
                    content.innerHTML = renderNewOrder();
                    break;
                default:
                    content.innerHTML = renderDashboard();
            }
            bindEvents();
        }

        // ================================================================
        // DASHBOARD
        // ================================================================
        function renderDashboard() {
            // Filter orders based on role
            let filteredOrders = [...allOrders];
            if (currentUserRole === 'marketer') {
                filteredOrders = filteredOrders.filter(o => o.marketerId === currentUser.uid);
            } else if (currentUserRole === 'moderator') {
                const myMarketers = allMarketers.filter(m => m.moderatorId === currentUser.uid).map(m => m.id);
                filteredOrders = filteredOrders.filter(o => myMarketers.includes(o.marketerId));
            }
            // customer_service sees all

            const totalOrders = filteredOrders.length;
            const totalSales = filteredOrders.reduce((s, o) => s + (o.total || 0), 0);
            const totalProfit = filteredOrders.reduce((s, o) => s + (o.profit || 0), 0);
            const delivered = filteredOrders.filter(o => o.status === 'تم التسليم').length;

            // Status distribution
            const statusCounts = {};
            filteredOrders.forEach(o => {
                const s = o.status || 'جديد';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });
            const statusColors = {
                'جديد': 'var(--primary)',
                'قيد التجهيز': 'var(--success)',
                'قيد الشحن': 'var(--warning)',
                'تم التسليم': 'var(--info)',
                'ملغي': 'var(--danger)',
                'مرتجع': '#9b59b6'
            };
            let statusRows = Object.entries(statusCounts).map(([label, count]) => {
                const pct = totalOrders ? Math.round((count / totalOrders) * 100) : 0;
                const color = statusColors[label] || 'var(--primary)';
                return `<div class="status-row"><span>${label}</span><div class="bar"><span style="width:${pct}%;background:${color}"></span></div><b>${count}</b></div>`;
            }).join('');

            // Top marketers
            const marketerStats = {};
            filteredOrders.forEach(o => {
                const m = o.marketerId || 'unknown';
                if (!marketerStats[m]) marketerStats[m] = { count: 0, sales: 0, profit: 0 };
                marketerStats[m].count++;
                marketerStats[m].sales += (o.total || 0);
                marketerStats[m].profit += (o.profit || 0);
            });
            let topMarketers = Object.entries(marketerStats)
                .sort((a, b) => b[1].profit - a[1].profit)
                .slice(0, 5)
                .map(([id, st]) => {
                    const m = allMarketers.find(x => x.id === id);
                    return `<tr><td>${m?.name||'غير معروف'}</td><td>${st.count}</td><td>${st.sales.toLocaleString()} ج</td><td>${st.profit.toLocaleString()} ج</td></tr>`;
                }).join('');

            return `
            <div class="cards">
              <div class="card stat"><div class="stat-head"><span>إجمالي الطلبات</span><span class="stat-icon">📋</span></div><h2>${totalOrders}</h2><span class="change up">▲ ${totalOrders?12:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>إجمالي المبيعات</span><span class="stat-icon">💰</span></div><h2>${totalSales.toLocaleString()} ج</h2><span class="change up">▲ ${totalSales?8:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>إجمالي الأرباح</span><span class="stat-icon">📈</span></div><h2>${totalProfit.toLocaleString()} ج</h2><span class="change up">▲ ${totalProfit?10:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>تم التسليم</span><span class="stat-icon">✅</span></div><h2>${delivered}</h2><span class="change up">▲ ${totalOrders?Math.round((delivered/totalOrders)*100):0}%</span></div>
            </div>

            <div class="grid-2">
              <div class="card panel">
                <div class="panel-head"><div><h3>📈 المبيعات والطلبات</h3><span class="muted">آخر 7 أيام</span></div></div>
                <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
              </div>
              <div class="card panel">
                <div class="panel-head"><div><h3>📊 حالات الطلبات</h3><span class="muted">التوزيع الحالي</span></div></div>
                <div class="status-list">${statusRows || '<div class="text-muted">لا توجد طلبات</div>'}</div>
              </div>
            </div>

            <div class="card panel">
              <div class="panel-head"><div><h3>🏆 أفضل المسوقين</h3><span class="muted">حسب الأرباح</span></div></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>المسوق</th><th>عدد الطلبات</th><th>إجمالي المبيعات</th><th>الأرباح</th></tr></thead>
                  <tbody>${topMarketers || '<tr><td colspan="4" class="text-muted">لا توجد بيانات</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        // ================================================================
        // USERS
        // ================================================================
        function renderUsers() {
            if (currentUserRole !== 'admin') return '<div class="card panel"><div class="text-muted">غير مصرح لك.</div></div>';
            const roleNames = { admin: 'مدير', moderator: 'مشرف', marketer: 'مسوق', customer_service: 'خدمة عملاء' };
            const roleColors = { admin: 'role-admin', moderator: 'role-moderator', marketer: 'role-marketer',
                customer_service: 'role-customer_service' };
            let html = allUsers.map(u => {
                const isCurrent = u.id === currentUser.uid;
                return `
                <div class="user-card">
                    <div class="user-info">
                        <div class="user-avatar">${u.name?.[0]||'👤'}</div>
                        <div class="user-details">
                            <h4>${u.name||'غير معروف'} ${isCurrent ? '👑' : ''}</h4>
                            <small>${u.email||'—'}</small>
                            <div style="margin-top:4px">
                                <span class="role-badge ${roleColors[u.role] || 'role-marketer'}">${roleNames[u.role]||'مسوق'}</span>
                                ${u.phone ? `<span class="text-muted" style="margin-right:8px">📱 ${u.phone}</span>` : ''}
                                ${u.region ? `<span class="text-muted" style="margin-right:8px">📍 ${u.region}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn btn-sm btn-primary" onclick="editUser('${u.id}')">✎</button>
                        ${!isCurrent ? `<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">✕</button>` : ''}
                    </div>
                </div>
                `;
            }).join('');
            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>👥 إدارة الحسابات</h3><span class="muted">مدير، مشرف، مسوق، خدمة عملاء</span></div>
                <button class="btn btn-primary btn-sm" onclick="showAddUser()">＋ حساب جديد</button>
              </div>
              ${html || '<div class="text-muted" style="padding:20px;text-align:center">لا يوجد مستخدمين</div>'}
            </div>
          `;
        }

        // ================================================================
        // ADD / EDIT USER
        // ================================================================
        window.showAddUser = function() {
            const regionOpts = Object.keys(allSettings.regions || {}).map(r =>
                `<option value="${r}">${r}</option>`).join('');
            openModal('إنشاء حساب جديد', `
            <form id="userForm" onsubmit="return saveUser(event)">
              <div class="form-group"><label>الاسم *</label><input type="text" id="uName" required placeholder="الاسم الكامل" /></div>
              <div class="form-group"><label>البريد الإلكتروني *</label><input type="email" id="uEmail" required placeholder="example@medora.com" /></div>
              <div class="form-group"><label>كلمة المرور *</label><input type="password" id="uPassword" required placeholder="كلمة مرور قوية" minlength="6" /></div>
              <div class="form-row">
                <div class="form-group"><label>رقم الهاتف</label><input type="text" id="uPhone" placeholder="رقم الهاتف" /></div>
                <div class="form-group"><label>المحافظة</label><select id="uRegion">${regionOpts}</select></div>
              </div>
              <div class="form-group"><label>الدور *</label>
                <select id="uRole" required>
                  <option value="admin">مدير</option>
                  <option value="moderator">مشرف</option>
                  <option value="marketer" selected>مسوق</option>
                  <option value="customer_service">خدمة عملاء</option>
                </select>
              </div>
              <div class="form-group" id="profitRateGroup" style="display:none">
                <label>نسبة الربح (%)</label>
                <input type="number" id="uProfitRate" value="10" min="0" max="100" />
              </div>
              <div class="form-group" id="moderatorGroup" style="display:none">
                <label>المشرف المسؤول</label>
                <select id="uModerator"><option value="">لا يوجد</option>
                  ${allUsers.filter(u=>u.role==='moderator').map(m=>`<option value="${m.id}">${m.name||m.email}</option>`).join('')}
                </select>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 حفظ</button>
                <button type="button" class="btn" onclick="closeModal()">إلغاء</button>
              </div>
            </form>
          `);
            const roleSelect = $('uRole');
            if (roleSelect) {
                roleSelect.onchange = function() {
                    const isMarketer = this.value === 'marketer';
                    const isModerator = this.value === 'moderator';
                    $('profitRateGroup').style.display = isMarketer ? 'block' : 'none';
                    $('moderatorGroup').style.display = (isMarketer || isModerator) ? 'block' : 'none';
                };
                roleSelect.onchange();
            }
        };

        window.saveUser = async function(e) {
            e.preventDefault();
            const name = $('uName').value.trim();
            const email = $('uEmail').value.trim();
            const password = $('uPassword').value;
            const phone = $('uPhone').value.trim() || '';
            const region = $('uRegion').value || '';
            const role = $('uRole').value;
            const profitRate = parseFloat($('uProfitRate')?.value) || 10;
            const moderatorId = $('uModerator')?.value || '';

            if (!name || !email || !password) { toast('❌ الاسم والبريد وكلمة المرور مطلوبة', 'danger'); return false; }
            if (password.length < 6) { toast('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger'); return false; }

            try {
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCred.user.uid;
                const userData = { name, email, role, phone, region,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp() };
                await db.collection('users').doc(uid).set(userData);

                if (role === 'marketer') {
                    await db.collection('marketers').doc(uid).set({
                        userId: uid,
                        name,
                        email,
                        phone,
                        region,
                        profitRate,
                        totalProfit: 0,
                        moderatorId: moderatorId || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                toast(`✅ تم إنشاء حساب ${role === 'admin' ? 'مدير' : role === 'moderator' ? 'مشرف' : role === 'customer_service' ? 'خدمة عملاء' : 'مسوق'} بنجاح`);
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
            return false;
        };

        window.editUser = function(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) { toast('❌ المستخدم غير موجود', 'danger'); return; }
            const regionOpts = Object.keys(allSettings.regions || {}).map(r =>

        window.updateUser = async function(id, e) {
            e.preventDefault();
            const name = $('uName').value.trim();
            const phone = $('uPhone').value.trim() || '';
            const region = $('uRegion').value || '';
            const profitRate = parseFloat($('uProfitRate')?.value);
            const moderatorId = $('uModerator')?.value || '';

            if (!name) { toast('❌ الاسم مطلوب', 'danger'); return false; }
            try {
                await db.collection('users').doc(id).update({ name, phone, region,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                const user = allUsers.find(u => u.id === id);
                if (user?.role === 'marketer') {
                    await db.collection('marketers').doc(id).update({
                        name,
                        phone,
                        region,
                        profitRate: profitRate || 10,
                        moderatorId,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                toast('✅ تم التحديث');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
            return false;
        };

        window.deleteUser = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
            try {
                await db.collection('users').doc(id).delete();
                const marketer = allMarketers.find(m => m.id === id);
                if (marketer) await db.collection('marketers').doc(id).delete();
                const orders = allOrders.filter(o => o.marketerId === id);
                for (const o of orders) await db.collection('orders').doc(o.id).delete();
                toast('✅ تم الحذف');
                renderCurrentPage();

        // ================================================================
        // SUBMIT ORDER
        // ================================================================
        window.submitOrder = async function(e) {
            e.preventDefault();
            const customer = $('orderCustomer')?.value.trim();
            const phone = $('orderPhone')?.value.trim() || '';
            const productId = $('orderProduct')?.value;
            const qty = parseInt($('orderQty')?.value) || 1;
            const total = parseFloat($('orderTotal')?.value) || 0;
            const region = $('orderRegion')?.value;
            const shipping = $('orderShipping')?.value;
            const shippingCost = parseFloat($('orderShippingCost')?.value) || 0;
            const status = $('orderStatus')?.value || 'جديد';
            const marketerId = $('orderMarketer')?.value || currentUser.uid;
            const notes = $('orderNotes')?.value || '';

            if (!customer || !productId || !region || !shipping) {
                toast('❌ يرجى ملء جميع الحقول المطلوبة', 'danger');
                return false;
            }

            const product = allProducts.find(p => p.id === productId);
            if (!product) { toast('❌ المنتج غير موجود', 'danger'); return false; }

            const sellPrice = product.sellPrice || 0;
            const costPrice = product.costPrice || 0;
            const marketer = allMarketers.find(m => m.id === marketerId);
            const marketerRate = marketer?.profitRate || 10;

            // Profit = (sell - cost) * qty * (marketerRate / 100)
            const profit = (sellPrice - costPrice) * qty * (marketerRate / 100);

            const orderData = {
                customerName: customer,
                customerPhone: phone,
                products: [{ productId, qty, price: sellPrice, cost: costPrice }],
                total: total + shippingCost,
                region: region,
                shippingType: shipping,
                shippingCost: shippingCost,
                status: status,
                marketerId: marketerId,
                notes: notes,
                profit: profit,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('orders').add(orderData);
                // Update marketer total profit
                await db.collection('marketers').doc(marketerId).update({
                    totalProfit: firebase.firestore.FieldValue.increment(profit)
                });
                toast('✅ تم إضافة الطلب بنجاح');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ خطأ: ' + err.message, 'danger'); }
            return false;
        };

        window.updateOrderProduct = function() {
            const sel = $('orderProduct');
            const qty = parseInt($('orderQty')?.value) || 1;
            const opt = sel?.options[sel.selectedIndex];
            if (opt && opt.value) {
                const price = parseFloat(opt.dataset.sell) || 0;
                const total = price * qty;
                if ($('orderTotal')) $('orderTotal').value = total.toFixed(2);
            }
        };

        // ================================================================
        // VIEW ORDER
        // ================================================================
        window.viewOrder = function(id) {
            const o = allOrders.find(x => x.id === id);
            if (!o) { toast('❌ الطلب غير موجود', 'danger'); return; }
            const m = allMarketers.find(x => x.id === o.marketerId);
            const items = o.products?.map(it => {
                const p = allProducts.find(pr => pr.id === it.productId);
                return `${p?.name||'منتج'} × ${it.qty||1} = ${((it.price||0)*(it.qty||1)).toLocaleString()} ج`;
            }).join('<br>') || '—';

            openModal(`تفاصيل الطلب #${id.slice(0,8)}`, `
            <div style="display:grid;gap:8px;font-size:14px">
              <div><strong>العميل:</strong> ${o.customerName||'—'}</div>
              <div><strong>الهاتف:</strong> ${o.customerPhone||'—'}</div>
              <div><strong>المنتجات:</strong><br>${items}</div>
              <div><strong>الإجمالي:</strong> ${(o.total||0).toLocaleString()} ج</div>
              <div><strong>المحافظة:</strong> ${o.region||'—'}</div>
              <div><strong>نوع الشحن:</strong> ${o.shippingType||'—'}</div>
              <div><strong>سعر الشحن:</strong> ${(o.shippingCost||0).toLocaleString()} ج</div>
              <div><strong>الحالة:</strong> <span class="badge ${getBadgeClass(o.status)}">${o.status||'جديد'}</span></div>
              <div><strong>الربح:</strong> ${(o.profit||0).toLocaleString()} ج</div>
              <div><strong>المسوق:</strong> ${m?.name||'غير معروف'}</div>
              <div><strong>ملاحظات:</strong> ${o.notes||'لا توجد'}</div>
              <hr style="border-color:var(--line)" />
              <div class="flex gap-1">
                <select id="orderStatusEdit" class="btn btn-sm">
                  ${['جديد','قيد التجهيز','قيد الشحن','تم التسليم','ملغي','مرتجع'].map(s => `<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
                </select>
                <button class="btn btn-primary btn-sm" onclick="updateOrderStatus('${id}')">تحديث الحالة</button>
                ${currentUserRole==='admin'||currentUserRole==='moderator'?`<button class="btn btn-danger btn-sm" onclick="deleteOrder('${id}')">حذف</button>`:''}
              </div>
            </div>
          `);
        };

        window.updateOrderStatus = async function(id) {
            const status = $('orderStatusEdit')?.value;
            if (!status) return;
            try {
                await db.collection('orders').doc(id).update({
                    status,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                toast('✅ تم تحديث الحالة');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
        };

        window.deleteOrder = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
            try {
                const o = allOrders.find(x => x.id === id);
                if (o) {
                    // Decrease marketer profit
                    await db.collection('marketers').doc(o.marketerId).update({
                        totalProfit: firebase.firestore.FieldValue.increment(-(o.profit || 0))
                    });
                }
                await db.collection('orders').doc(id).delete();
                toast('✅ تم الحذف');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
        };

        // ================================================================
        // SETTINGS
        // ================================================================
        function renderSettings() {
            if (currentUserRole !== 'admin') return '<div class="card panel"><div class="text-muted">غير مصرح لك.</div></div>';
            const regions = allSettings.regions || {};
            const regionHtml = Object.entries(regions).map(([cat, cities]) =>
                `<div class="flex" style="margin-bottom:6px"><strong>${cat}:</strong> <span style="margin:0 8px">${cities.join('، ')}</span>
              <button class="btn btn-sm" onclick="editRegion('${cat}')">✎</button>
              <button class="btn btn-sm btn-danger" onclick="deleteRegion('${cat}')">✕</button></div>`
            ).join('');

            const shipTypes = allSettings.shippingTypes || [];
            const shipHtml = shipTypes.map(s =>
                `<span class="badge badge-info" style="margin:4px">${s}</span>`
            ).join('');

            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>⚙️ إعدادات النظام</h3><span class="muted">المحافظات، سعر الشحن، أنواع الشحن</span></div></div>
              <div class="form-group">
                <label>سعر الشحن الأساسي (ج)</label>
                <input type="number" id="shippingCost" value="${allSettings.shippingCost||30}" style="width:200px" />
                <button class="btn btn-primary btn-sm" onclick="updateShippingCost()">تحديث</button>
              </div>
              <hr style="margin:18px 0;border-color:var(--line)" />
              <div class="panel-head"><div><h4>🏙️ تصنيف المحافظات</h4></div>
                <button class="btn btn-primary btn-sm" onclick="showAddRegion()">＋ إضافة تصنيف</button>
              </div>
              ${regionHtml || '<div class="text-muted">لا توجد تصنيفات</div>'}
              <hr style="margin:18px 0;border-color:var(--line)" />
              <div class="panel-head"><div><h4>🚚 أنواع الشحن</h4></div>
                <button class="btn btn-primary btn-sm" onclick="showAddShippingType()">＋ إضافة نوع</button>
              </div>
              <div class="flex" style="flex-wrap:wrap">${shipHtml || '<div class="text-muted">لا توجد أنواع</div>'}</div>
            </div>
          `;
        }

        window.updateShippingCost = async function() {
            const val = parseFloat($('shippingCost')?.value);
            if (isNaN(val) || val < 0) { toast('❌ قيمة غير صحيحة', 'danger'); return; }
            try {
                await db.collection('settings').doc('general').set({ shippingCost: val }, { merge: true });
                toast('✅ تم تحديث سعر الشحن');
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
        };

        window.showAddRegion = function() {
            openModal('إضافة تصنيف محافظة جديد', `
            <form id="regionForm" onsubmit="return saveRegion(event)">
              <div class="form-group"><label>اسم التصنيف *</label><input type="text" id="rName" required placeholder="مثال: بحري" /></div>
              <div class="form-group"><label>المدن (مفصولة بفاصلة) *</label><textarea id="rCities" rows="3" placeholder="الإسكندرية، دمياط، بورسعيد" required></textarea></div>
              <div class="form-actions"><button type="submit" class="btn btn-primary">💾 حفظ</button></div>
            </form>
          `);
        };

        window.saveRegion = async function(e) {
            e.preventDefault();
            const name = $('rName')?.value.trim();
            const cities = $('rCities')?.value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
            if (!name || !cities.length) { toast('❌ الاسم والمدن مطلوبان', 'danger'); return false; }
            try {
                const regions = { ...allSettings.regions, [name]: cities };
                await db.collection('settings').doc('general').set({ regions }, { merge: true });
                toast('✅ تم إضافة التصنيف');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
            return false;
        };

        window.editRegion = function(cat) {
            const cities = allSettings.regions?.[cat] || [];
            openModal(`تعديل تصنيف ${cat}`, `
            <form id="regionForm" onsubmit="return updateRegion('${cat}', event)">
              <div class="form-group"><label>اسم التصنيف *</label><input type="text" id="rName" value="${cat}" required /></div>
              <div class="form-group"><label>المدن (مفصولة بفاصلة) *</label><textarea id="rCities" rows="3" required>${cities.join('، ')}</textarea></div>
              <div class="form-actions"><button type="submit" class="btn btn-primary">💾 تحديث</button></div>
            </form>
          `);
        };

        window.updateRegion = async function(oldCat, e) {
            e.preventDefault();
            const name = $('rName')?.value.trim();
            const cities = $('rCities')?.value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
            if (!name || !cities.length) { toast('❌ الاسم والمدن مطلوبان', 'danger'); return false; }
            try {
                const regions = { ...allSettings.regions };
                delete regions[oldCat];
                regions[name] = cities;
                await db.collection('settings').doc('general').set({ regions }, { merge: true });
                toast('✅ تم التحديث');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
            return false;
        };

        window.deleteRegion = async function(cat) {
            if (!confirm(`هل أنت متأكد من حذف تصنيف "${cat}"؟`)) return;
            try {
                const regions = { ...allSettings.regions };
                delete regions[cat];
                await db.collection('settings').doc('general').set({ regions }, { merge: true });
                toast('✅ تم الحذف');
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
        };

        window.showAddShippingType = function() {
            openModal('إضافة نوع شحن جديد', `
            <form id="shipForm" onsubmit="return saveShippingType(event)">
              <div class="form-group"><label>نوع الشحن *</label><input type="text" id="sName" required placeholder="مثال: شحن سريع" /></div>
              <div class="form-actions"><button type="submit" class="btn btn-primary">💾 حفظ</button></div>
            </form>
          `);
        };

        window.saveShippingType = async function(e) {
            e.preventDefault();
            const name = $('sName')?.value.trim();
            if (!name) { toast('❌ الاسم مطلوب', 'danger'); return false; }
            try {
                const types = [...(allSettings.shippingTypes || []), name];
                await db.collection('settings').doc('general').set({ shippingTypes: types }, { merge: true });
                toast('✅ تم إضافة نوع الشحن');
                closeModal();
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
            return false;
        };

        // ================================================================
        // FILTER ORDERS (client-side)
        // ================================================================
        window.filterOrders = function() {
            const region = $('filterRegion')?.value || '';
            const shipping = $('filterShipping')?.value || '';
            const status = $('filterStatus')?.value || '';
            const rows = document.querySelectorAll('#pageContent table tbody tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length < 10) return;
                const regionCell = cells[4]?.textContent || '';
                const shippingCell = cells[5]?.textContent || '';
                const statusCell = cells[6]?.textContent || '';
                let show = true;
                if (region && regionCell !== region) show = false;
                if (shipping && shippingCell !== shipping) show = false;
                if (status && statusCell !== status) show = false;
                row.style.display = show ? '' : 'none';
            });
        };

        // ================================================================
        // LOAD DATA
        // ================================================================
        async function loadAllData() {
            try {
                const settingsDoc = await db.collection('settings').doc('general').get();
                if (settingsDoc.exists) allSettings = settingsDoc.data();
                const mSnap = await db.collection('marketers').get();
                allMarketers = mSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const pSnap = await db.collection('products').get();
                allProducts = pSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const oSnap = await db.collection('orders').get();
                allOrders = oSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                const uSnap = await db.collection('users').get();
                allUsers = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCurrentPage();
            } catch (err) { console.warn('Load data error:', err); }
        }

        // ================================================================
        // BIND EVENTS
        // ================================================================
        function bindEvents() {
            // Chart
            const chartCanvas = document.getElementById('dashChart');
            if (chartCanvas && currentTab === 'dashboard') {
                if (window._dashChart) { window._dashChart.destroy(); }
                const ctx = chartCanvas.getContext('2d');
                window._dashChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
                        datasets: [{
                            label: 'المبيعات',
                            data: [32000, 41000, 36000, 52000, 47000, 61000, 56500],
                            borderColor: '#5b5ce2',
                            backgroundColor: 'rgba(91,92,226,0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true
                        }, {
                            label: 'الطلبات',
                            data: [120, 145, 132, 178, 165, 205, 192],
                            borderColor: '#16a56b',
                            backgroundColor: 'rgba(22,165,107,0.05)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, font: { family: 'Tahoma' } } }
                        },
                        scales: {
                            y: { grid: { color: '#edf0f5' }, ticks: { font: { family: 'Tahoma' } } },
                            x: { grid: { display: false }, ticks: { font: { family: 'Tahoma' } } }
                        }
                    }
                });
            }

            // Filters
            ['filterRegion', 'filterShipping', 'filterStatus'].forEach(id => {
                const el = $(id);
                if (el) el.onchange = window.filterOrders;
            });

            // Order form
            const orderForm = $('orderForm');
            if (orderForm) orderForm.onsubmit = window.submitOrder;
            const prodSel = $('orderProduct');
            if (prodSel) {
                prodSel.onchange = window.updateOrderProduct;
                const qty = $('orderQty');
                if (qty) qty.onchange = window.updateOrderProduct;
                window.updateOrderProduct();
            }
        }

        // ================================================================
        // GLOBALS EXPOSED
        // ================================================================
        window.toggleSidebar = toggleSidebar;
        window.toggleTheme = toggleTheme;
        window.notify = notify;
        window.refreshData = refreshData;
        window.handleActionBtn = handleActionBtn;
        window.closeModal = closeModal;
        window.toast = toast;
        window.calcProductProfit = calcProductProfit;
        window.updateOrderProduct = updateOrderProduct;
        window.submitOrder = submitOrder;
        window.updateOrderStatus = updateOrderStatus;
        window.deleteOrder = deleteOrder;
        window.viewOrder = viewOrder;
        window.filterOrders = filterOrders;
        window.showAddUser = showAddUser;
        window.saveUser = saveUser;
        window.editUser = editUser;
        window.updateUser = updateUser;
        window.deleteUser = deleteUser;
        window.showAddMarketer = showAddMarketer;
        window.showAddProduct = showAddProduct;
        window.saveProduct = saveProduct;
        window.editProduct = editProduct;
        window.updateProduct = updateProduct;
        window.deleteProduct = deleteProduct;
        window.showAddOrder = showAddOrder;
        window.updateShippingCost = updateShippingCost;
        window.showAddRegion = showAddRegion;
        window.saveRegion = saveRegion;
        window.editRegion = editRegion;
        window.updateRegion = updateRegion;
        window.deleteRegion = deleteRegion;
        window.showAddShippingType = showAddShippingType;
        window.saveShippingType = saveShippingType;

        console.log('🚀 MEDORA Professional ready with Firebase');
    </script>
</body>
</html>
