<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDORA - نظام إدارة الطلبات</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #7a8499;
            --line: #e8ebf2;
            --primary: #5b5ce2;
            --success: #16a56b;
            --warning: #e99a20;
            --danger: #e04f5f;
            --info: #2588d9;
            --shadow: 0 8px 24px rgba(28, 39, 75, 0.08);
            --radius: 14px;
            --transition: 0.25s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ---------- Login ---------- */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #11152a, #1b2140);
            padding: 20px;
        }
        .login-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 44px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-box h2 {
            font-size: 26px;
            margin-bottom: 6px;
            color: #11152a;
        }
        .login-box p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #2a2f45;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            transition: var(--transition);
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.12);
        }
        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 18px;
            transition: var(--transition);
        }
        .login-box .btn-primary:hover {
            background: #4a4bcc;
            transform: translateY(-1px);
        }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .login-role {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
            text-align: center;
        }
        .login-role strong {
            color: var(--primary);
        }

        /* ---------- App Layout ---------- */
        #app {
            display: none;
            min-height: 100vh;
        }
        .sidebar {
            width: 255px;
            background: #11152a;
            color: #fff;
            padding: 20px 14px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            transition: var(--transition);
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 10px 26px;
        }
        .sidebar .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #6b6ce9, #9a8cff);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 19px;
        }
        .sidebar .brand h2 {
            font-size: 18px;
            margin: 0;
        }
        .sidebar .brand small {
            color: #9298b3;
            font-size: 11px;
        }
        .nav-title {
            font-size: 11px;
            color: #717895;
            margin: 18px 12px 8px;
            letter-spacing: 0.5px;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: #c7cbe0;
            margin: 3px 0;
            font-size: 14px;
            transition: var(--transition);
        }
        .nav a:hover,
        .nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .nav a.active {
            box-shadow: inset -3px 0 0 #8b8cf4;
        }
        .nav .icon {
            width: 24px;
            text-align: center;
            font-size: 16px;
        }
        .badge-nav {
            margin-right: auto;
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .main {
            margin-right: 255px;
            padding: 22px 28px 40px;
            min-height: 100vh;
        }

        /* ---------- Top Bar ---------- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .page-title h1 {
            font-size: 24px;
            margin: 0 0 3px;
        }
        .page-title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 9px 16px;
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff !important;
        }
        .btn-primary:hover {
            background: #4a4bcc;
            border-color: #4a4bcc;
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #fff !important;
        }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff !important;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            position: relative;
            font-size: 18px;
            display: grid;
            place-items: center;
        }
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            top: 8px;
            left: 8px;
        }
        .mobile-menu {
            display: none;
        }

        /* ---------- Cards ---------- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 12px 32px rgba(28, 39, 75, 0.1);
        }
        .stat {
            padding: 18px 20px;
        }
        .stat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #f0f0ff;
            color: var(--primary);
            font-size: 18px;
        }
        .stat h2 {
            font-size: 26px;
            margin: 12px 0 4px;
        }
        .stat .change {
            font-size: 12px;
        }
        .up {
            color: var(--success);
        }
        .down {
            color: var(--danger);
        }

        /* ---------- Grid ---------- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        .panel {
            padding: 18px 20px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-head h3 {
            font-size: 16px;
            margin: 0;
        }
        .panel-head .muted {
            color: var(--muted);
            font-size: 12px;
        }
        .chart-wrap {
            height: 260px;
        }

        /* ---------- Status List ---------- */
        .status-list {
            display: grid;
            gap: 12px;
        }
        .status-row {
            display: grid;
            grid-template-columns: 85px 1fr 45px;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .bar {
            height: 8px;
            background: #edf0f5;
            border-radius: 99px;
            overflow: hidden;
        }
        .bar span {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: var(--primary);
        }

        /* ---------- Table ---------- */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }
        th {
            color: var(--muted);
            font-weight: 600;
            background: #fafbfc;
        }
        .badge {
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-success {
            background: #e9f8f1;
            color: #0b8b59;
        }
        .badge-warning {
            background: #fff5df;
            color: #b87300;
        }
        .badge-danger {
            background: #ffeaed;
            color: #c83949;
        }
        .badge-info {
            background: #e9f4ff;
            color: #1671b9;
        }
        .badge-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .customer {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ececff;
            color: #5354ca;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            display: none;
        }

        /* ---------- Forms ---------- */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            outline: none;
            transition: var(--transition);
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ---------- Modals ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 18px;
        }
        .modal-box .close-modal {
            float: left;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .close-modal:hover {
            color: var(--danger);
        }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #151a2d;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.35s ease;
            z-index: 200;
            font-size: 14px;
            max-width: 380px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 1000px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 760px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-right: 0;
                padding: 16px 14px;
            }
            .mobile-menu {
                display: inline-flex;
            }
            .topbar {
                align-items: flex-start;
            }
            .actions .hide-mobile {
                display: none;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
            .stat h2 {
                font-size: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 20px;
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .page-title h1 {
                font-size: 20px;
            }
            .actions {
                gap: 6px;
            }
            .btn {
                font-size: 12px;
                padding: 7px 12px;
            }
        }

        .text-muted {
            color: var(--muted);
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gap-1 {
            gap: 6px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ============ TOAST ============ -->
    <div class="toast" id="toast"></div>

    <!-- ============ LOGIN PAGE ============ -->
    <div id="loginPage">
        <div class="login-box">
            <h2>🔐 MEDORA</h2>
            <p>نظام إدارة الطلبات – سجل الدخول</p>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@medora.com" required />
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
                <button type="submit" class="btn-primary">تسجيل الدخول</button>
                <div class="error" id="loginError">بيانات الدخول غير صحيحة</div>
                <div class="login-role">
                    📌 <strong>مدير:</strong> admin@medora.com / admin123<br>
                    📌 <strong>مشرف:</strong> moderator@medora.com / mod123<br>
                    📌 <strong>مسوق:</strong> marketer@medora.com / market123
                </div>
            </form>
        </div>
    </div>

    <!-- ============ APP ============ -->
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">M</div>
                <div>
                    <h2>MEDORA</h2>
                    <small id="userRoleDisplay">مدير النظام</small>
                </div>
            </div>
            <div class="nav-title">الرئيسية</div>
            <nav class="nav" id="mainNav"></nav>
            <div style="margin-top:30px;border-top:1px solid #292e43;padding-top:16px">
                <a href="#" onclick="logout()" style="color:#9298b3;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;">
                    <span>🚪</span> تسجيل الخروج
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <div class="page-title">
                    <button class="btn mobile-menu" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">لوحة التحكم</h1>
                    <p id="todayDate"></p>
                </div>
                <div class="actions">
                    <button class="btn hide-mobile" onclick="refreshData()">↻ تحديث</button>
                    <button class="btn btn-primary hide-mobile" id="actionBtn" onclick="handleActionBtn()">＋ طلب جديد</button>
                    <button class="icon-btn" onclick="notify()">🔔<span class="dot"></span></button>
                    <button class="icon-btn" onclick="toggleTheme()">☾</button>
                </div>
            </header>
            <div id="pageContent"></div>
        </main>
    </div>

    <!-- ============ MODAL ============ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <h3 id="modalTitle">عنوان</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCL92zT2GyJEM1awmJ7ouS6TfaaRZKvofc",
            authDomain: "medora-4d7ae.firebaseapp.com",
            projectId: "medora-4d7ae",
            storageBucket: "medora-4d7ae.firebasestorage.app",
            messagingSenderId: "454112159901",
            appId: "1:454112159901:web:abe06158f462cfbb4a8c74",
            measurementId: "G-KKPM4D930B"
        };

        // ============================================================
        // INIT FIREBASE
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // GLOBALS
        // ============================================================
        let currentUser = null;
        let currentUserRole = 'marketer';
        let allMarketers = [];
        let allProducts = [];
        let allOrders = [];
        let allSettings = { shippingCost: 30, regions: { 'بحري': ['الإسكندرية', 'دمياط', 'بورسعيد'], 'قبلي': ['أسيوط', 'سوهاج',
                    'قنا'
                ], 'داخلي': ['القاهرة', 'الجيزة', 'القليوبية'] } };
        let unsubscribeOrders = null;
        let unsubscribeMarketers = null;
        let unsubscribeProducts = null;
        let currentTab = 'dashboard';

        // ============================================================
        // DOM HELPERS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const $$ = (sel) => document.querySelectorAll(sel);

        function toast(msg, type = 'info') {
            const t = $('toast');
            t.textContent = msg;
            t.style.background = type === 'danger' ? '#c0392b' : '#151a2d';
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 2800);
        }

        function closeModal() {
            $('modalOverlay').classList.remove('open');
        }

        function openModal(title, html) {
            $('modalTitle').textContent = title;
            $('modalBody').innerHTML = html;
            $('modalOverlay').classList.add('open');
        }

        function toggleSidebar() {
            $('sidebar').classList.toggle('open');
        }

        function toggleTheme() {
            const dark = document.body.dataset.dark === '1';
            document.body.dataset.dark = dark ? '0' : '1';
            if (!dark) {
                document.documentElement.style.setProperty('--bg', '#0d1020');
                document.documentElement.style.setProperty('--card', '#171b2d');
                document.documentElement.style.setProperty('--text', '#eef0f7');
                document.documentElement.style.setProperty('--muted', '#9299b3');
                document.documentElement.style.setProperty('--line', '#292e43');
                const lb = document.querySelector('.login-box');
                if (lb) lb.style.background = '#171b2d';
            } else {
                location.reload();
            }
        }

        function notify() { toast('🔔 لديك 3 إشعارات جديدة'); }

        function refreshData() {
            toast('🔄 تم تحديث البيانات');
            loadAllData();
        }

        function handleActionBtn() {
            if (currentTab === 'marketers' && currentUserRole === 'admin') {
                showAddMarketer();
            } else if (currentTab === 'products' && currentUserRole === 'admin') {
                showAddProduct();
            } else {
                showAddOrder();
            }
        }

        // ============================================================
        // LOGIN / LOGOUT
        // ============================================================
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = $('loginEmail').value.trim();
            const pass = $('loginPassword').value.trim();
            const errEl = $('loginError');
            errEl.style.display = 'none';
            try {
                await auth.signInWithEmailAndPassword(email, pass);
                toast('✅ مرحباً بك');
            } catch (err) {
                errEl.textContent = err.message || 'خطأ في تسجيل الدخول';
                errEl.style.display = 'block';
            }
            return false;
        };

        window.logout = async function() {
            await auth.signOut();
            toast('🚪 تم تسجيل الخروج');
            $('app').style.display = 'none';
            $('loginPage').style.display = 'flex';
            if (unsubscribeOrders) { unsubscribeOrders();
                unsubscribeOrders = null; }
            if (unsubscribeMarketers) { unsubscribeMarketers();
                unsubscribeMarketers = null; }
            if (unsubscribeProducts) { unsubscribeProducts();
                unsubscribeProducts = null; }
        };

        // ============================================================
        // AUTH STATE
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUserRole = userDoc.data().role || 'marketer';
                    } else {
                        currentUserRole = 'marketer';
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: 'marketer',
                            name: user.displayName || 'مسوق',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                } catch (e) {
                    console.warn('User role error:', e);
                    currentUserRole = 'marketer';
                }

                $('loginPage').style.display = 'none';
                $('app').style.display = 'block';
                const roleNames = { admin: 'مدير النظام', moderator: 'مشرف', marketer: 'مسوق' };
                $('userRoleDisplay').textContent = roleNames[currentUserRole] || 'مسوق';
                $('todayDate').textContent = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'full' }).format(new Date());
                initApp();
            } else {
                $('app').style.display = 'none';
                $('loginPage').style.display = 'flex';
                if (unsubscribeOrders) { unsubscribeOrders();
                    unsubscribeOrders = null; }
                if (unsubscribeMarketers) { unsubscribeMarketers();
                    unsubscribeMarketers = null; }
                if (unsubscribeProducts) { unsubscribeProducts();
                    unsubscribeProducts = null; }
            }
        });

        // ============================================================
        // INIT APP
        // ============================================================
        function initApp() {
            buildNav();
            loadAllData();

            if (unsubscribeOrders) unsubscribeOrders();
            if (unsubscribeMarketers) unsubscribeMarketers();
            if (unsubscribeProducts) unsubscribeProducts();

            unsubscribeOrders = db.collection('orders')
                .onSnapshot((snap) => {
                    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderCurrentPage();
                }, (err) => console.warn('Orders error:', err));

            unsubscribeMarketers = db.collection('marketers')
                .onSnapshot((snap) => {
                    allMarketers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderCurrentPage();
                }, (err) => console.warn('Marketers error:', err));

            unsubscribeProducts = db.collection('products')
                .onSnapshot((snap) => {
                    allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderCurrentPage();
                }, (err) => console.warn('Products error:', err));
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function buildNav() {
            const nav = $('mainNav');
            let links = [];
            if (currentUserRole === 'admin') {
                links = [
                    { id: 'dashboard', label: '📊 لوحة التحكم' },
                    { id: 'marketers', label: '👥 المسوقين' },
                    { id: 'products', label: '📦 المنتجات' },
                    { id: 'orders', label: '📋 الطلبات' },
                    { id: 'settings', label: '⚙️ الإعدادات' },
                ];
            } else if (currentUserRole === 'moderator') {
                links = [
                    { id: 'dashboard', label: '📊 لوحة التحكم' },
                    { id: 'orders', label: '📋 الطلبات' },
                    { id: 'marketers', label: '👥 المسوقين' },
                ];
            } else {
                links = [
                    { id: 'dashboard', label: '📊 لوحتي' },
                    { id: 'orders', label: '📋 طلباتي' },
                    { id: 'newOrder', label: '➕ إضافة طلب' },
                ];
            }
            nav.innerHTML = links.map(l =>
                `<a href="#" class="${l.id === currentTab ? 'active' : ''}" data-tab="${l.id}">${l.label}</a>`
            ).join('');
            nav.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentTab = a.dataset.tab;
                    nav.querySelectorAll('a').forEach(x => x.classList.remove('active'));
                    a.classList.add('active');
                    renderCurrentPage();
                });
            });

            const titles = {
                dashboard: 'لوحة التحكم',
                marketers: 'إدارة المسوقين',
                products: 'إدارة المنتجات',
                orders: 'إدارة الطلبات',
                settings: 'إعدادات النظام',
                newOrder: 'إضافة طلب جديد'
            };
            $('pageTitle').textContent = titles[currentTab] || 'لوحة التحكم';

            const actionBtn = $('actionBtn');
            if (currentTab === 'newOrder' || currentTab === 'orders') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ طلب جديد';
            } else if (currentTab === 'marketers' && currentUserRole === 'admin') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ مسوق جديد';
            } else if (currentTab === 'products' && currentUserRole === 'admin') {
                actionBtn.style.display = 'inline-flex';
                actionBtn.textContent = '＋ منتج جديد';
            } else {
                actionBtn.style.display = 'none';
            }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderCurrentPage() {
            const content = $('pageContent');
            switch (currentTab) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'marketers':
                    content.innerHTML = renderMarketers();
                    break;
                case 'products':
                    content.innerHTML = renderProducts();
                    break;
                case 'orders':
                    content.innerHTML = renderOrders();
                    break;
                case 'settings':
                    content.innerHTML = renderSettings();
                    break;
                case 'newOrder':
                    content.innerHTML = renderNewOrder();
                    break;
                default:
                    content.innerHTML = renderDashboard();
            }
            bindEvents();
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function renderDashboard() {
            const totalOrders = allOrders.length;
            const totalSales = allOrders.reduce((s, o) => s + (o.total || 0), 0);
            const delivered = allOrders.filter(o => o.status === 'تم التسليم').length;
            const canceled = allOrders.filter(o => o.status === 'ملغي').length;

            const marketerStats = {};
            allOrders.forEach(o => {
                const m = o.marketerId || 'unknown';
                if (!marketerStats[m]) marketerStats[m] = { count: 0, sales: 0, profit: 0 };
                marketerStats[m].count++;
                marketerStats[m].sales += (o.total || 0);
                marketerStats[m].profit += (o.profit || 0);
            });

            const statusCounts = {};
            allOrders.forEach(o => {
                const s = o.status || 'جديد';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });
            const statusColors = {
                'جديد': 'var(--primary)',
                'قيد التجهيز': 'var(--success)',
                'قيد الشحن': 'var(--warning)',
                'تم التسليم': 'var(--info)',
                'ملغي': 'var(--danger)',
                'مرتجع': '#9b59b6'
            };

            let statusRows = Object.entries(statusCounts).map(([label, count]) => {
                const pct = totalOrders ? Math.round((count / totalOrders) * 100) : 0;
                const color = statusColors[label] || 'var(--primary)';
                return `<div class="status-row"><span>${label}</span><div class="bar"><span style="width:${pct}%;background:${color}"></span></div><b>${count}</b></div>`;
            }).join('');

            return `
            <div class="cards">
              <div class="card stat"><div class="stat-head"><span>إجمالي الطلبات</span><span class="stat-icon">📋</span></div><h2>${totalOrders}</h2><span class="change up">▲ ${totalOrders?12:0}% <span class="muted">مقارنة بالسابق</span></span></div>
              <div class="card stat"><div class="stat-head"><span>إجمالي المبيعات</span><span class="stat-icon">💰</span></div><h2>${totalSales.toLocaleString()} ج</h2><span class="change up">▲ ${totalSales?8:0}% <span class="muted">مقارنة بالسابق</span></span></div>
              <div class="card stat"><div class="stat-head"><span>تم التسليم</span><span class="stat-icon">✅</span></div><h2>${delivered}</h2><span class="change up">▲ ${delivered?6:0}% <span class="muted">معدل النجاح</span></span></div>
              <div class="card stat"><div class="stat-head"><span>ملغي</span><span class="stat-icon">❌</span></div><h2>${canceled}</h2><span class="change down">▼ ${canceled?2:0}% <span class="muted">عن السابق</span></span></div>
            </div>

            <div class="grid-2">
              <div class="card panel">
                <div class="panel-head"><div><h3>📈 المبيعات والطلبات</h3><span class="muted">آخر 7 أيام</span></div></div>
                <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
              </div>
              <div class="card panel">
                <div class="panel-head"><div><h3>📊 حالات الطلبات</h3><span class="muted">التوزيع الحالي</span></div></div>
                <div class="status-list">${statusRows || '<div class="text-muted">لا توجد طلبات</div>'}</div>
              </div>
            </div>

            <div class="card panel">
              <div class="panel-head"><div><h3>🏆 أداء المسوقين</h3><span class="muted">حسب عدد الطلبات</span></div></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>المسوق</th><th>عدد الطلبات</th><th>إجمالي المبيعات</th><th>الأرباح</th></tr></thead>
                  <tbody>
                    ${Object.entries(marketerStats).map(([id, st]) => {
                      const m = allMarketers.find(x=>x.id===id);
                      return `<tr><td>${m?.name||'غير معروف'}</td><td>${st.count}</td><td>${st.sales.toLocaleString()} ج</td><td>${st.profit.toLocaleString()} ج</td></tr>`;
                    }).join('') || '<tr><td colspan="4" class="text-muted">لا توجد بيانات</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        }

        // ============================================================
        // MARKETERS
        // ============================================================
        function renderMarketers() {
            if (currentUserRole !== 'admin' && currentUserRole !== 'moderator') {
                return '<div class="card panel"><div class="text-muted">غير مصرح لك بعرض هذه الصفحة.</div></div>';
            }
            let rows = allMarketers.map(m => `
            <tr>
              <td><div class="customer"><span class="avatar">${m.name?.[0]||'م'}</span>${m.name||'غير معروف'}</div></td>
              <td>${m.email||'—'}</td>
              <td>${m.phone||'—'}</td>
              <td>${m.region||'—'}</td>
              <td>${m.profitRate || 0}%</td>
              <td>${(m.totalProfit||0).toLocaleString()} ج</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="editMarketer('${m.id}')">✎</button>
                ${currentUserRole==='admin'?`<button class="btn btn-sm btn-danger" onclick="deleteMarketer('${m.id}')">✕</button>`:''}
              </td>
            </tr>
          `).join('');

            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>👥 قائمة المسوقين</h3><span class="muted">إدارة حسابات المسوقين ونسب الأرباح</span></div>
                ${currentUserRole==='admin'?`<button class="btn btn-primary btn-sm" onclick="showAddMarketer()">＋ إضافة</button>`:''}
              </div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>المحافظة</th><th>نسبة الربح</th><th>إجمالي الأرباح</th><th>إجراء</th></tr></thead>
                  <tbody>${rows || '<tr><td colspan="7" class="text-muted">لا يوجد مسوقين</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        // ============================================================
        // PRODUCTS
        // ============================================================
        function renderProducts() {
            if (currentUserRole !== 'admin') {
                return '<div class="card panel"><div class="text-muted">غير مصرح لك بعرض هذه الصفحة.</div></div>';
            }
            let rows = allProducts.map(p => `
            <tr>
              <td>${p.name||'—'}</td>
              <td>${p.sku||'—'}</td>
              <td>${(p.sellPrice||0).toLocaleString()} ج</td>
              <td>${(p.costPrice||0).toLocaleString()} ج</td>
              <td>${(p.profit||0).toLocaleString()} ج</td>
              <td>${p.profitRate||0}%</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="editProduct('${p.id}')">✎</button>
                <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">✕</button>
              </td>
            </tr>
          `).join('');

            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>📦 قائمة المنتجات</h3><span class="muted">إدارة المنتجات والتسعير</span></div>
                <button class="btn btn-primary btn-sm" onclick="showAddProduct()">＋ إضافة</button>
              </div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>المنتج</th><th>SKU</th><th>سعر البيع</th><th>سعر التكلفة</th><th>الربح</th><th>نسبة الربح</th><th>إجراء</th></tr></thead>
                  <tbody>${rows || '<tr><td colspan="7" class="text-muted">لا توجد منتجات</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        // ============================================================
        // ORDERS
        // ============================================================
        function renderOrders() {
            let filtered = [...allOrders];
            if (currentUserRole === 'marketer') {
                filtered = filtered.filter(o => o.marketerId === currentUser.uid);
            }
            filtered.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            let rows = filtered.map(o => {
                const m = allMarketers.find(x => x.id === o.marketerId);
                return `
              <tr>
                <td>#${o.id.slice(0,8)}</td>
                <td><div class="customer"><span class="avatar">${o.customerName?.[0]||'ع'}</span>${o.customerName||'عميل'}</div></td>
                <td>${o.items?.length||0} منتج</td>
                <td>${(o.total||0).toLocaleString()} ج</td>
                <td>${o.region||'—'}</td>
                <td>${o.shippingType||'—'}</td>
                <td><span class="badge ${getBadgeClass(o.status)}">${o.status||'جديد'}</span></td>
                <td>${(o.profit||0).toLocaleString()} ج</td>
                <td><button class="btn btn-sm btn-primary" onclick="viewOrder('${o.id}')">عرض</button></td>
              </tr>
            `;
            }).join('');

            const regionOptions = Object.keys(allSettings.regions || {}).map(r =>
                `<option value="${r}">${r}</option>`).join('');
            const shippingOptions = ['شركة شحن', 'مندوب', 'داخلي - شركة', 'داخلي - مندوب'].map(s =>
                `<option value="${s}">${s}</option>`).join('');

            return `
            <div class="card panel">
              <div class="panel-head">
                <div><h3>📋 قائمة الطلبات</h3><span class="muted">إدارة جميع الطلبات</span></div>
                <div class="flex gap-1">
                  <select class="btn btn-sm" id="filterRegion" onchange="filterOrders()"><option value="">كل المحافظات</option>${regionOptions}</select>
                  <select class="btn btn-sm" id="filterShipping" onchange="filterOrders()"><option value="">كل أنواع الشحن</option>${shippingOptions}</select>
                  <select class="btn btn-sm" id="filterStatus" onchange="filterOrders()"><option value="">كل الحالات</option>
                    <option value="جديد">جديد</option><option value="قيد التجهيز">قيد التجهيز</option>
                    <option value="قيد الشحن">قيد الشحن</option><option value="تم التسليم">تم التسليم</option>
                    <option value="ملغي">ملغي</option><option value="مرتجع">مرتجع</option>
                  </select>
                  <button class="btn btn-primary btn-sm" onclick="showAddOrder()">＋ طلب جديد</button>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>رقم الطلب</th><th>العميل</th><th>المنتجات</th><th>الإجمالي</th><th>المحافظة</th><th>نوع الشحن</th><th>الحالة</th><th>الربح</th><th>إجراء</th></tr></thead>
                  <tbody>${rows || '<tr><td colspan="9" class="text-muted">لا توجد طلبات</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        function getBadgeClass(status) {
            const map = {
                'جديد': 'badge-info',
                'قيد التجهيز': 'badge-warning',
                'قيد الشحن': 'badge-info',
                'تم التسليم': 'badge-success',
                'ملغي': 'badge-danger',
                'مرتجع': 'badge-secondary'
            };
            return map[status] || 'badge-secondary';
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function renderSettings() {
            if (currentUserRole !== 'admin') {
                return '<div class="card panel"><div class="text-muted">غير مصرح لك بعرض هذه الصفحة.</div></div>';
            }
            const regions = allSettings.regions || {};
            const regionHtml = Object.entries(regions).map(([cat, cities]) =>
                `<div class="flex" style="margin-bottom:6px"><strong>${cat}:</strong> <span style="margin:0 8px">${cities.join('، ')}</span>
              <button class="btn btn-sm" onclick="editRegion('${cat}')">✎</button>
              <button class="btn btn-sm btn-danger" onclick="deleteRegion('${cat}')">✕</button></div>`
            ).join('');

            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>⚙️ إعدادات النظام</h3><span class="muted">المحافظات، سعر الشحن، والإعدادات العامة</span></div></div>
              <div class="form-group">
                <label>سعر الشحن الأساسي (ج)</label>
                <input type="number" id="shippingCost" value="${allSettings.shippingCost||30}" style="width:200px" />
                <button class="btn btn-primary btn-sm" onclick="updateShippingCost()">تحديث</button>
              </div>
              <hr style="margin:18px 0;border-color:var(--line)" />
              <div class="panel-head"><div><h4>🏙️ تصنيف المحافظات</h4></div>
                <button class="btn btn-primary btn-sm" onclick="showAddRegion()">＋ إضافة تصنيف</button>
              </div>
              ${regionHtml || '<div class="text-muted">لا توجد تصنيفات</div>'}
              <hr style="margin:18px 0;border-color:var(--line)" />
              <div class="panel-head"><div><h4>🚚 أنواع الشحن</h4></div></div>
              <div class="flex gap-1">
                <span class="badge badge-info">شركة شحن</span>
                <span class="badge badge-success">مندوب</span>
                <span class="badge badge-warning">داخلي - شركة</span>
                <span class="badge badge-secondary">داخلي - مندوب</span>
              </div>
              <div class="text-muted" style="margin-top:8px;font-size:13px">يمكن تعديل أنواع الشحن من Firestore.</div>
            </div>
          `;
        }

        // ============================================================
        // NEW ORDER FORM
        // ============================================================
        function renderNewOrder() {
            return `
            <div class="card panel">
              <div class="panel-head"><div><h3>➕ إضافة طلب جديد</h3><span class="muted">أدخل بيانات الطلب</span></div></div>
              ${getOrderFormHTML()}
            </div>
          `;
        }

        function getOrderFormHTML() {
            const productOpts = allProducts.map(p =>
                `<option value="${p.id}" data-price="${p.sellPrice||0}" data-cost="${p.costPrice||0}" data-profit="${p.profit||0}">${p.name} (${p.sellPrice||0} ج)</option>`
            ).join('');

            const regionOpts = Object.keys(allSettings.regions || {}).map(r =>
                `<option value="${r}">${r}</option>`).join('');

            const shippingOpts = ['شركة شحن', 'مندوب', 'داخلي - شركة', 'داخلي - مندوب'].map(s =>
                `<option value="${s}">${s}</option>`).join('');

            const marketerOpts = allMarketers.map(m =>
                `<option value="${m.id}">${m.name||m.email}</option>`).join('');

            return `
            <form id="orderForm" onsubmit="return submitOrder(event)">
              <div class="form-row">
                <div class="form-group">
                  <label>اسم العميل *</label>
                  <input type="text" id="orderCustomer" required placeholder="أدخل اسم العميل" />
                </div>
                <div class="form-group">
                  <label>رقم العميل (اختياري)</label>
                  <input type="text" id="orderPhone" placeholder="رقم الهاتف" />
                </div>
              </div>
              <div class="form-group">
                <label>المنتج *</label>
                <select id="orderProduct" onchange="updateOrderProduct()">
                  <option value="">اختر منتج</option>
                  ${productOpts}
                </select>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>الكمية</label>
                  <input type="number" id="orderQty" value="1" min="1" onchange="updateOrderProduct()" />
                </div>
                <div class="form-group">
                  <label>السعر الإجمالي (ج)</label>
                  <input type="number" id="orderTotal" step="0.01" readonly />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>المحافظة *</label>
                  <select id="orderRegion" required>${regionOpts || '<option value="">لا توجد محافظات</option>'}</select>
                </div>
                <div class="form-group">
                  <label>نوع الشحن *</label>
                  <select id="orderShipping" required>${shippingOpts}</select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>الحالة</label>
                  <select id="orderStatus">
                    <option value="جديد">جديد</option>
                    <option value="قيد التجهيز">قيد التجهيز</option>
                    <option value="قيد الشحن">قيد الشحن</option>
                    <option value="تم التسليم">تم التسليم</option>
                    <option value="ملغي">ملغي</option>
                    <option value="مرتجع">مرتجع</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>المسوق المسؤول</label>

                const regionCell = cells[4]?.textContent || '';
                const shippingCell = cells[5]?.textContent || '';
                const statusCell = cells[6]?.textContent || '';
                let show = true;
                if (region && regionCell !== region) show = false;

                if (status && statusCell !== status) show = false;
                row.style.display = show ? '' : 'none';
            });

                            borderColor: '#16a56b',
                            backgroundColor: 'rgba(22,165,107,0.05)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, font: { family: 'Tahoma' } } }
                        },
                        scales: {
                            y: { grid: { color: '#edf0f5' }, ticks: { font: { family: 'Tahoma' } } },
                            x: { grid: { display: false }, ticks: { font: { family: 'Tahoma' } } }
                        }
                    }
                });
            }

            const filterRegion = $('filterRegion');
            const filterShipping = $('filterShipping');
            const filterStatus = $('filterStatus');
            if (filterRegion) filterRegion.onchange = window.filterOrders;
            if (filterShipping) filterShipping.onchange = window.filterOrders;
            if (filterStatus) filterStatus.onchange = window.filterOrders;

            const orderForm = $('orderForm');
            if (orderForm) {
                orderForm.onsubmit = window.submitOrder;
            }
            const prodSel = $('orderProduct');
            if (prodSel) {
                prodSel.onchange = window.updateOrderProduct;
                const qty = $('orderQty');
                if (qty) qty.onchange = window.updateOrderProduct;
                window.updateOrderProduct();
            }
        }

        // ============================================================
        // GLOBAL FUNCTIONS
        // ============================================================
        window.toggleSidebar = toggleSidebar;
        window.toggleTheme = toggleTheme;
        window.notify = notify;
        window.refreshData = refreshData;
        window.handleActionBtn = handleActionBtn;
        window.closeModal = closeModal;
        window.toast = toast;

        console.log('🚀 MEDORA system ready with Firebase');
    </script>
</body>
</html>
