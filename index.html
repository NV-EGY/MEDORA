<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDORA - نظام إدارة الصفحات</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #7a8499;
            --line: #e8ebf2;
            --primary: #5b5ce2;
            --success: #16a56b;
            --warning: #e99a20;
            --danger: #e04f5f;
            --info: #2588d9;
            --shadow: 0 8px 24px rgba(28, 39, 75, 0.08);
            --radius: 14px;
            --transition: 0.25s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ========== LOGIN ========== */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #11152a, #1b2140);
            padding: 20px;
        }
        .login-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-box h2 {
            font-size: 28px;
            margin-bottom: 4px;
            color: #11152a;
        }
        .login-box p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #2a2f45;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            transition: var(--transition);
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.12);
        }
        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 18px;
            transition: var(--transition);
        }
        .login-box .btn-primary:hover {
            background: #4a4bcc;
            transform: translateY(-1px);
        }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .login-role {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
            text-align: center;
        }
        .login-role strong {
            color: var(--primary);
        }

        /* ========== APP LAYOUT ========== */
        #app {
            display: none;
            min-height: 100vh;
        }
        .sidebar {
            width: 270px;
            background: #11152a;
            color: #fff;
            padding: 20px 14px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            transition: var(--transition);
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px 26px;
        }
        .sidebar .brand-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #6b6ce9, #9a8cff);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 19px;
        }
        .sidebar .brand h2 {
            font-size: 18px;
            margin: 0;
        }
        .sidebar .brand small {
            color: #9298b3;
            font-size: 11px;
        }
        .close-sidebar {
            color: #9298b3;
            font-size: 22px;
            padding: 4px 8px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .close-sidebar:hover {
            color: #fff;
        }
        .nav-title {
            font-size: 11px;
            color: #717895;
            margin: 18px 12px 8px;
            letter-spacing: 0.5px;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: #c7cbe0;
            margin: 3px 0;
            font-size: 14px;
            transition: var(--transition);
        }
        .nav a:hover,
        .nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .nav a.active {
            box-shadow: inset -3px 0 0 #8b8cf4;
        }
        .nav .icon {
            width: 24px;
            text-align: center;
            font-size: 16px;
        }
        .badge-nav {
            margin-right: auto;
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .main {
            margin-right: 270px;
            padding: 22px 28px 40px;
            min-height: 100vh;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .page-title h1 {
            font-size: 24px;
            margin: 0 0 3px;
        }
        .page-title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 9px 16px;
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff !important;
        }
        .btn-primary:hover {
            background: #4a4bcc;
            border-color: #4a4bcc;
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #fff !important;
        }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff !important;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            position: relative;
            font-size: 18px;
            display: grid;
            place-items: center;
        }
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            top: 8px;
            left: 8px;
        }
        .mobile-menu {
            display: none;
        }

        /* ========== CARDS ========== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 12px 32px rgba(28, 39, 75, 0.1);
        }
        .stat {
            padding: 18px 20px;
        }
        .stat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #f0f0ff;
            color: var(--primary);
            font-size: 18px;
        }
        .stat h2 {
            font-size: 26px;
            margin: 12px 0 4px;
        }
        .stat .change {
            font-size: 12px;
        }
        .up {
            color: var(--success);
        }
        .down {
            color: var(--danger);
        }

        /* ========== GRID ========== */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        .panel {
            padding: 18px 20px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-head h3 {
            font-size: 16px;
            margin: 0;
        }
        .panel-head .muted {
            color: var(--muted);
            font-size: 12px;
        }
        .chart-wrap {
            height: 260px;
        }

        /* ========== STATUS LIST ========== */
        .status-list {
            display: grid;
            gap: 12px;
        }
        .status-row {
            display: grid;
            grid-template-columns: 85px 1fr 45px;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .bar {
            height: 8px;
            background: #edf0f5;
            border-radius: 99px;
            overflow: hidden;
        }
        .bar span {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: var(--primary);
        }

        /* ========== TABLE ========== */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }
        th {
            color: var(--muted);
            font-weight: 600;
            background: #fafbfc;
        }
        .badge {
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-success {
            background: #e9f8f1;
            color: #0b8b59;
        }
        .badge-warning {
            background: #fff5df;
            color: #b87300;
        }
        .badge-danger {
            background: #ffeaed;
            color: #c83949;
        }
        .badge-info {
            background: #e9f4ff;
            color: #1671b9;
        }
        .badge-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .customer {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ececff;
            color: #5354ca;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ========== FORMS ========== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            outline: none;
            transition: var(--transition);
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 18px;
        }
        .modal-box .close-modal {
            float: left;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .close-modal:hover {
            color: var(--danger);
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #151a2d;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.35s ease;
            z-index: 200;
            font-size: 14px;
            max-width: 380px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ========== USER CARDS ========== */
        .user-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .user-card:hover {
            box-shadow: var(--shadow);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        .user-details h4 {
            margin: 0 0 4px;
        }
        .user-details small {
            color: var(--muted);
        }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-admin {
            background: #e74c3c;
            color: #fff;
        }
        .role-moderator {
            background: #f39c12;
            color: #fff;
        }
        .role-marketer {
            background: #2ecc71;
            color: #fff;
        }
        .role-customer_service {
            background: #3498db;
            color: #fff;
        }
        .user-actions {
            display: flex;
            gap: 8px;
        }
        .page-tag {
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-right: 8px;
        }

        /* ========== PAGE CARDS ========== */
        .page-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .page-card:hover {
            box-shadow: var(--shadow);
        }
        .page-info h4 {
            margin: 0 0 4px;
        }
        .page-info small {
            color: var(--muted);
        }
        .page-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
        }
        .page-stats span {
            color: var(--muted);
        }
        .page-stats strong {
            color: var(--text);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 760px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .close-sidebar {
                display: block;
            }
            .main {
                margin-right: 0;
                padding: 16px 14px;
            }
            .mobile-menu {
                display: inline-flex;
            }
            .topbar {
                align-items: flex-start;
            }
            .actions .hide-mobile {
                display: none;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
            .stat h2 {
                font-size: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 20px;
            }
            .page-stats {
                flex-direction: column;
                gap: 4px;
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .page-title h1 {
                font-size: 20px;
            }
            .actions {
                gap: 6px;
            }
            .btn {
                font-size: 12px;
                padding: 7px 12px;
            }
        }

        .text-muted {
            color: var(--muted);
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gap-1 {
            gap: 6px;
        }
        .hidden {
            display: none !important;
        }

        /* ========== STAGE / SHIPPING SECTIONS ========== */
        .stage-section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .stage-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .stage-head h4 {
            margin: 0;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stage-count {
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .stage-check-all {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }
        .ship-check, .stage-check {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ========== SALES CARDS ========== */
        .sales-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .sales-card .sales-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sales-head h3 {
            margin: 0;
            font-size: 16px;
        }
        .sales-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }
        .sales-mini {
            background: var(--bg);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--line);
        }
        .sales-mini span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }
        .sales-mini b {
            font-size: 19px;
        }
        .sales-mini.gain b { color: var(--success); }
        .sales-mini.loss b { color: var(--danger); }
        .sales-mini.net b { color: var(--primary); }
        .mt-2 {
            margin-top: 12px;
        }
        .w-full {
            width: 100%;
        }
        /* ========== ACCORDION / GOV SETTINGS ========== */
.gov-accordion {
    transition: 0.2s;
}
.gov-accordion:hover .gov-accordion-head {
    background: #f0f2f7;
}
.gov-accordion-head {
    border-radius: 8px;
    padding: 8px 12px;
}
.gov-accordion-head:hover {
    background: #f0f2f7;
}

/* ========== PAGE MEMBERS TOGGLE ========== */
.page-members {
    animation: fadeSlide 0.3s ease;
}
@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========== BULK ACTIONS ========== */
#bulkActionsWrap {
    animation: fadeSlide 0.25s ease;
}
/* تمييز الصف المحدد */
.shipping-table-body tr.selected-row,
#ordersTableBody tr.selected-row {
    background-color: #e0e7ff !important;
    transition: background-color 0.2s ease;
}
/* sticky header for orders table */
#ordersTableWrap {
    position: relative;
    max-height: 80vh;
    overflow-y: auto;
}
#ordersTableWrap .sticky-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding: 8px 12px;
    border-bottom: 2px solid var(--line);

// ================================================================
// IMPORT HELPERS: تطبيع النصوص العربية + التحقق من رقم الهاتف المصري + مطابقة المحافظات
// ================================================================
function normalizeArabic(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .trim()
        .replace(/[أإآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[ًٌٍَُِّْ]/g, '')
        .replace(/\s+/g, ' ')
        .toLowerCase();
}

function arabicToEnglishDigits(str) {
    if (!str) return str;
    const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
    const englishDigits = '0123456789';
    let result = '';
    for (let i = 0; i < str.length; i++) {
        const char = str[i];
        const index = arabicDigits.indexOf(char);
        result += (index !== -1) ? englishDigits[index] : char;
    }
    return result;
}

function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        }
    }
    return d[m][n];
}

// يحاول مطابقة نص محافظة مكتوب بأي صيغة إلى اسم محافظة رسمي من GOVERNORATE_CITIES
function matchGovernorate(raw) {
    if (!raw) return { match: null, confidence: 0 };
    const norm = normalizeArabic(raw);
    const names = Object.keys(GOVERNORATE_CITIES);
    // تطابق تام بعد التطبيع
    for (const g of names) {
        if (normalizeArabic(g) === norm) return { match: g, confidence: 1 };
    }
    // تطابق احتوائي (مثال: "المنصوره الدقهليه" تحتوي على "الدقهلية")
    for (const g of names) {
        const ng = normalizeArabic(g);
        if (norm.includes(ng) || ng.includes(norm)) return { match: g, confidence: 0.85 };
    }
    // أقرب تطابق بالمسافة النصية (Levenshtein)
    let best = null, bestDist = Infinity;
    for (const g of names) {
        const dist = levenshtein(normalizeArabic(g), norm);
        if (dist < bestDist) { bestDist = dist; best = g; }
    }
    const maxLen = Math.max(normalizeArabic(best || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    if (confidence >= 0.55) return { match: best, confidence };
    return { match: null, confidence };
}

// يحاول مطابقة نص مدينة إلى مدينة رسمية ضمن محافظة معينة
function matchCity(raw, governorate) {
    if (!raw || !governorate || !GOVERNORATE_CITIES[governorate]) return { match: null, confidence: 0 };
    const norm = normalizeArabic(raw);
    const cities = GOVERNORATE_CITIES[governorate];
    for (const c of cities) {
        if (normalizeArabic(c) === norm) return { match: c, confidence: 1 };
    }
    let best = null, bestDist = Infinity;
    for (const c of cities) {
        const dist = levenshtein(normalizeArabic(c), norm);
        if (dist < bestDist) { bestDist = dist; best = c; }
    }
    const maxLen = Math.max(normalizeArabic(best || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    if (confidence >= 0.5) return { match: best, confidence };
    return { match: null, confidence: 0 };
}

// تطبيع وتحقق رقم الهاتف المصري: 01[0125] + 8 أرقام = 11 رقم
function normalizeEgyptianPhone(raw) {
    if (!raw) return '';
    let s = String(raw).trim();
    s = arabicToEnglishDigits(s);  // تحويل الأرقام العربية إلى إنجليزية
    s = s.replace(/[^\d+]/g, '');
    s = s.replace(/^\+?20/, '0').replace(/^0020/, '0');
    if (!s.startsWith('0') && s.length === 10) s = '0' + s;
    return s;
}
function isValidEgyptianPhone(raw) {
    const s = normalizeEgyptianPhone(raw);
    return /^01[0125][0-9]{8}$/.test(s);
}

async function generateOrderCode(pageId, marketerId, currentDate = new Date()) {
    const page = allPages.find(p => p.id === pageId);
    let pagePrefix = 'PAG';
    if (page) {
        if (page.codePrefix && typeof page.codePrefix === 'string' && page.codePrefix.trim().length >= 3) {
            pagePrefix = page.codePrefix.trim().slice(0, 3).toUpperCase();
        } else if (page.name && typeof page.name === 'string') {
            const englishLetters = page.name.match(/[a-zA-Z]/g);
            if (englishLetters && englishLetters.length >= 3) {
                pagePrefix = englishLetters.slice(0, 3).join('').toUpperCase();
            }
        }
    }

    // التاريخ بالتنسيق YYMMDD
    const y = currentDate.getFullYear().toString().slice(-2);
    const m = String(currentDate.getMonth() + 1).padStart(2, '0');
    const d = String(currentDate.getDate()).padStart(2, '0');
    const dateStr = y + m + d;

    // مفتاح اليوم المحلي
    const todayKey = getLocalDateKey(currentDate);

    // 1. الرقم العالمي اليومي: عدد جميع الطلبات (أي صفحة) في هذا اليوم
    const allTodayOrders = allOrders.filter(o => getLocalDateKey(o.createdAt) === todayKey).length;

    // 2. الرقم اليومي للصفحة: عدد طلبات هذه الصفحة فقط في هذا اليوم
    const pageTodayOrders = allOrders.filter(o => o.pageId === pageId && getLocalDateKey(o.createdAt) === todayKey).length;

    // الرقم العالمي (4 خانات) والرقم اليومي للصفحة (3 خانات)
    const globalSeq = String(allTodayOrders + 1).padStart(4, '0');
    const pageSeq = String(pageTodayOrders + 1).padStart(3, '0');

    // الكود النهائي
    return `${pagePrefix}-${dateStr}${globalSeq}${pageSeq}`;
}

        function toast(msg, type = 'info') {
    const t = $('toast');
    t.textContent = msg;
    // تعيين لون الخلفية حسب النوع
    const colors = {
        success: '#16a56b',
        danger: '#e04f5f',
        warning: '#e99a20',
        info: '#151a2d'
    };
    t.style.background = colors[type] || '#151a2d';
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove('show'), 3000);
}

        // ================================================================
        // INIT APP
        // ================================================================
     async function initApp() {
    buildNav();
    startListeners();
    loadAllData().then(() => {
        permanentDeleteExpiredOrders();  // ← ضيف السطر ده
    });

    function startListeners() {
        // إلغاء المستمعين السابقين إن وجدوا
        if (unsubOrders) unsubOrders();
        if (unsubMarketers) unsubMarketers();
        if (unsubProducts) unsubProducts();
        if (unsubUsers) unsubUsers();
        if (unsubSettings) unsubSettings();
        if (unsubPages) unsubPages();

        unsubPages = db.collection('pages').onSnapshot(snap => {
            allPages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (currentUserPageId) {
                const page = allPages.find(p => p.id === currentUserPageId);
                document.getElementById('userPageDisplay').textContent = '📄 ' + (page?.name || 'صفحة غير معروفة');
            }
            if (currentUserRole === 'customer_service' && currentTab === 'dashboard') {
                currentTab = 'orders';
            }
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Pages listener error:', err);
        });

        unsubOrders = db.collection('orders').onSnapshot(snap => {
            allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Orders listener error:', err);
        });

        // باقي المستمعين بنفس الطريقة...
        unsubMarketers = db.collection('marketers').onSnapshot(snap => {
            allMarketers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Marketers error:', err);
        });

        unsubProducts = db.collection('products').onSnapshot(snap => {
            allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Products error:', err);
        });

        unsubUsers = db.collection('users').onSnapshot(snap => {
            allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Users error:', err);
        });

        unsubSettings = db.collection('settings').doc('general').onSnapshot(doc => {
            if (doc.exists) allSettings = doc.data();
            if (isDataLoaded && !_suppressRender) renderCurrentPage();
        }, err => {
            console.warn('Settings error:', err);
        });
    }

    setupSidebarClose();
}

        function setupSidebarClose() {
            const sidebar = $('sidebar');
            const closeBtn = $('closeSidebar');
            const mobileMenuBtn = document.querySelector('.mobile-menu');

            if (closeBtn) {
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.remove('open');
                });
            }

            document.querySelectorAll('#mainNav a').forEach(link => {
                link.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                });
            });

            document.addEventListener('click', (e) => {
                const isSidebar = sidebar.contains(e.target);
                const isMobileMenu = mobileMenuBtn && mobileMenuBtn.contains(e.target);
                if (!isSidebar && !isMobileMenu && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            });

            sidebar.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        function getFilteredOrders(includeDeleted = false) {
    let orders;
    if (currentUserRole === 'admin' || currentUserRole === 'moderator') {
        orders = [...allOrders];
    } else if (currentUserPageId) {
        orders = allOrders.filter(o => o.pageId === currentUserPageId);
    } else {
        orders = [];
    }
    if (!includeDeleted) {
        orders = orders.filter(o => o.isDeleted !== true);
    }
    return orders;
}

        function getFilteredMarketers() {
            let filtered = [...allMarketers];
            if (currentUserRole === 'admin' || currentUserRole === 'moderator') {
                return filtered;
            }
            if (currentUserPageId) {
                filtered = filtered.filter(m => m.pageId === currentUserPageId);
            } else {
                filtered = [];
            }
            return filtered;
        }

      function renderCurrentPage() {
    if (_suppressRender) return;
    const content = $('pageContent');
    
    // إذا لم تكن البيانات محملة بعد، عرض رسالة تحميل
    if (!isDataLoaded) {
        content.innerHTML = `
            <div class="card panel" style="text-align:center;padding:40px;">
                <h3>⏳ جاري تحميل البيانات...</h3>
                <p class="text-muted">يرجى الانتظار قليلاً</p>
            </div>
        `;
        return;
    }
    
    // لخدمة العملاء: إذا كان التاب 'dashboard' ننتقل إلى 'orders'
    if (currentUserRole === 'customer_service' && currentTab === 'dashboard') {
        currentTab = 'orders';
        document.querySelectorAll('#mainNav a').forEach(a => {
            a.classList.remove('active');
            if (a.dataset.tab === 'orders') a.classList.add('active');
        });
        $('pageTitle').textContent = 'طلبات';
    }
    
    switch (currentTab) {
        case 'dashboard':
            content.innerHTML = renderDashboard();
            break;
        case 'pages':
            content.innerHTML = renderPages();
            break;
        case 'users':
            content.innerHTML = renderUsers();
            break;
        case 'marketers':
            content.innerHTML = renderMarketers();
            break;
        case 'products':
            content.innerHTML = renderProducts();
            break;
        case 'orders':
            content.innerHTML = renderOrders();
            break;
        case 'orderlog':
            content.innerHTML = renderOrderLog();
            break;
        case 'shipping':
            content.innerHTML = renderShipping();
            break;
        case 'sales':
            content.innerHTML = renderSales();
            break;
        case 'settings':
            content.innerHTML = renderSettings();
            break;
        case 'newOrder':
            content.innerHTML = renderNewOrder();
            break;
        case 'csUsers':
            content.innerHTML = renderCSUsers();
            break;
        default:
            content.innerHTML = renderDashboard();
    }
    bindEvents();
}

        // ================================================================
        // DASHBOARD
        // ================================================================
        function renderDashboard() {
    const filteredOrders = getFilteredOrders();

    const totalOrders = filteredOrders.length;
    const totalSales = filteredOrders.reduce((s, o) => s + (o.total || 0), 0);
    const totalProfit = filteredOrders.reduce((s, o) => s + (o.profit || 0), 0);
    const delivered = filteredOrders.filter(o => o.status === 'تم التسليم').length;

    let pageName = 'جميع الصفحات';
    if (currentUserPageId) {
        const page = allPages.find(p => p.id === currentUserPageId);
        pageName = page?.name || 'صفحتي';
    }
    if (currentUserRole === 'admin') pageName = 'جميع الصفحات (مدير)';
    if (currentUserRole === 'moderator') pageName = 'جميع الصفحات (مشرف)';
    if (currentUserRole === 'customer_service') pageName = 'صفحتي (خدمة عملاء)';

    const isCS = currentUserRole === 'customer_service';

    const statusCounts = {};
    filteredOrders.forEach(o => {
        const s = o.status || 'جديد';
        statusCounts[s] = (statusCounts[s] || 0) + 1;
    });
    const statusColors = {
        'جديد': 'var(--primary)',
        'قيد التجهيز': 'var(--success)',
        'قيد الشحن': 'var(--warning)',
        'تم التسليم': 'var(--info)',
        'ملغي': 'var(--danger)',
        'مرتجع': '#9b59b6'
    };
    let statusRows = Object.entries(statusCounts).map(([label, count]) => {
        const pct = totalOrders ? Math.round((count / totalOrders) * 100) : 0;
        const color = statusColors[label] || 'var(--primary)';
        return `<div class="status-row"><span>${label}</span><div class="bar"><span style="width:${pct}%;background:${color}"></span></div><b>${count}</b></div>`;
    }).join('');

    const marketerStats = {};
    filteredOrders.forEach(o => {
        const m = o.marketerId || 'unknown';
        if (!marketerStats[m]) marketerStats[m] = { count: 0, sales: 0, profit: 0 };
        marketerStats[m].count++;
        marketerStats[m].sales += (o.total || 0);
        marketerStats[m].profit += (o.profit || 0);
    });
    let topMarketers = Object.entries(marketerStats)
        .sort((a, b) => b[1].profit - a[1].profit)
        .slice(0, 5)
        .map(([id, st]) => {
            const m = allMarketers.find(x => x.id === id);
            return `<tr><td>${m?.name||'غير معروف'}</td><td>${st.count}</td><td>${st.sales.toLocaleString()} ج</td><td>${st.profit.toLocaleString()} ج</td></tr>`;
        }).join('');

    // إخفاء بطاقة الأرباح لخدمة العملاء
    const profitCard = isCS ? '' : `
        <div class="card stat"><div class="stat-head"><span>إجمالي الأرباح</span><span class="stat-icon">📈</span></div><h2>${totalProfit.toLocaleString()} ج</h2><span class="change up">▲ ${totalProfit?10:0}%</span></div>
    `;

    return `
        <div style="margin-bottom:12px;font-size:14px;color:var(--muted);">
            📄 عرض بيانات: <strong style="color:var(--text)">${pageName}</strong>
            ${currentUserPageId ? '' : ' (للمدير/المشرف عرض جميع الصفحات)'}
        </div>
        <div class="cards">
            <div class="card stat"><div class="stat-head"><span>إجمالي الطلبات</span><span class="stat-icon">📋</span></div><h2>${totalOrders}</h2><span class="change up">▲ ${totalOrders?12:0}%</span></div>

        window.savePage = async function(e) {
    e.preventDefault();
    const name = $('pageName').value.trim();
    const codePrefix = $('pageCodePrefix').value.trim().toUpperCase();
    if (!name) { toast('❌ اسم الصفحة مطلوب', 'danger'); return false; }
    if (!codePrefix || codePrefix.length !== 3 || !/^[A-Z]{3}$/.test(codePrefix)) {
        toast('❌ يجب إدخال 3 أحرف إنجليزية كاختصار', 'danger');
        return false;
    }
    try {
        await db.collection('pages').add({
            name: name,
            codePrefix: codePrefix,
            createdBy: currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('✅ تم إنشاء الصفحة');
        closeModal();
        renderCurrentPage();
    } catch (err) {
        toast('❌ خطأ: ' + err.message, 'danger');
        console.error('Save page error:', err);
    }
    return false;
};

        window.deletePage = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الصفحة؟ سيتم حذف جميع البيانات المرتبطة بها.')) return;
            try {
                const pageOrders = allOrders.filter(o => o.pageId === id);
                for (const o of pageOrders) {
                    await db.collection('orders').doc(o.id).delete();
                }
                const pageMarketers = allMarketers.filter(m => m.pageId === id);
                for (const m of pageMarketers) {
                    await db.collection('marketers').doc(m.id).delete();
                }
                const pageUsers = allUsers.filter(u => u.pageId === id);
                for (const u of pageUsers) {
                    await db.collection('users').doc(u.id).update({ pageId: null });
                }
                await db.collection('pages').doc(id).delete();
                toast('✅ تم حذف الصفحة وجميع بياناتها');
                renderCurrentPage();
            } catch (err) { toast('❌ ' + err.message, 'danger'); }
        };

window.saveUser = async function(e) {
    e.preventDefault();
    const name = $('uName').value.trim();
    const email = $('uEmail').value.trim();
    const password = $('uPassword').value;
    const role = $('uRole').value;
    const pageId = $('uPageId')?.value || '';
    const canEditOrders = document.getElementById('uCanEditOrders')?.checked || false;
    const canSeeAllOrders = document.getElementById('uCanSeeAllOrders')?.checked || false;

    if (!name || !email || !password) { toast('❌ الاسم والبريد وكلمة المرور مطلوبة', 'danger'); return false; }
    if (password.length < 6) { toast('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger'); return false; }

    if ((role === 'marketer' || role === 'customer_service') && !pageId) {
        toast('❌ يرجى اختيار الصفحة التابع لها هذا المستخدم', 'danger');
        return false;
    }

    const currentUserEmail = currentUser?.email;
    const tempEmail = sessionStorage.getItem('tempEmail');
    const tempPassword = sessionStorage.getItem('tempPassword');
    const shouldReauth = currentUserEmail && tempEmail && tempPassword && currentUserEmail === tempEmail;

    try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        const userData = {
            name,
            email,
            role,
            pageId: (role === 'marketer' || role === 'customer_service') ? pageId : null,
            canEditOrders: (role === 'customer_service') ? canEditOrders : false,
            canSeeAllOrders: (role === 'customer_service') ? canSeeAllOrders : false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('users').doc(uid).set(userData);

        if (role === 'marketer') {
            await db.collection('marketers').doc(uid).set({
                userId: uid,
                name,
                email,
                pageId: pageId,
                totalProfit: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        if (shouldReauth && tempEmail && tempPassword) {
            await auth.signOut();
            await auth.signInWithEmailAndPassword(tempEmail, tempPassword);
            toast(`✅ تم إنشاء حساب ${roleNames[role]||'مسوق'} بنجاح، وأنت الآن مسجل بحسابك الأساسي`);
        } else {
            const roleNames = { admin: 'مدير', moderator: 'مشرف', marketer: 'مسوق', customer_service: 'خدمة عملاء' };
            toast(`✅ تم إنشاء حساب ${roleNames[role]||'مسوق'} بنجاح`);
        }

        closeModal();
        renderCurrentPage();
    } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
            toast('❌ هذا البريد الإلكتروني مستخدم بالفعل. يرجى استخدام بريد آخر.', 'danger');
        } else {
            toast('❌ ' + err.message, 'danger');
        }
        console.error('Save user error:', err);
    }
    return false;
};

        window.calcProductProfit = function() {
            const sell = parseFloat($('pSell')?.value) || 0;
            const cost = parseFloat($('pCost')?.value) || 0;
            const profit = sell - cost;
            const rate = sell ? (profit / sell) * 100 : 0;
            if ($('pProfit')) $('pProfit').value = profit.toFixed(2);
            if ($('pProfitRate')) $('pProfitRate').value = rate.toFixed(1);
        };

function renderCustomerServiceOrders() {
    const isCS = currentUserRole === 'customer_service';

    // عرض طلبات الصفحة حسب صلاحية المستخدم
    let myOrders = [];
   if (currentUserPageId && currentUser) {
    const canSeeAll = currentUserData && currentUserData.canSeeAllOrders === true;
    if (canSeeAll) {
        myOrders = allOrders.filter(o => o.pageId === currentUserPageId && !o.isDeleted);
    } else {
        myOrders = allOrders.filter(o => o.pageId === currentUserPageId && o.createdBy === currentUser.uid && !o.isDeleted);
    }
}

    const groups = {};
    const todayKey = getLocalDateKey(new Date());
    myOrders.forEach(o => {
        const key = getLocalDateKey(o.createdAt);
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
    });

    const sortedDays = Object.keys(groups).sort((a, b) => b.localeCompare(a));
    const MY_STORAGE_KEY = 'medora_cs_orders_days_state';
    let myStoredState = {};
    try {
        const raw = sessionStorage.getItem(MY_STORAGE_KEY);
        if (raw) myStoredState = JSON.parse(raw);
    } catch (e) {}
    const myDayStates = {};
    sortedDays.forEach(day => {
        myDayStates[day] = myStoredState.hasOwnProperty(day) ? myStoredState[day] : (day === todayKey);
    });
    sessionStorage.setItem(MY_STORAGE_KEY, JSON.stringify(myDayStates));

    function renderDayGroup(day, orders) {
        const isOpen = myDayStates[day];
        const dayLabel = new Date(day + 'T00:00:00').toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const count = orders.length;

        const rows = orders.map(o => {
            const page = allPages.find(p => p.id === o.pageId);
            let canEdit = false;
            if (currentUserRole === 'admin' || currentUserRole === 'moderator') {
                canEdit = true;
            } else if (currentUserRole === 'marketer' && o.marketerId === currentUser.uid) {
                canEdit = true;
            } else if (currentUserRole === 'customer_service' && o.pageId === currentUserPageId && currentUserData?.canEditOrders) {
                canEdit = true;
            }
            const canDelete = canEdit;
            const stage = getOrderStage(o);
            const isPrinted = o.isPrinted || false;
            const creatorName = o.createdByName || 'غير معروف';
            const editedBadge = o.edited ? '<span class="badge badge-warning" style="font-size:10px;">✏️ تم التعديل</span>' : '';
            
            // ===== حساب المستحق المحصل =====
            const collectedDue = getOrderCollectedDue(o);
            const dueDisplay = collectedDue !== null ? collectedDue.toLocaleString() + ' ج' : '—';

            return `
            <tr data-order-id="${o.id}" data-day="${day}" data-stage="${stage}" 
    data-page-id="${o.pageId || ''}" 
    data-status="${o.status || 'جديد'}" 
    data-governorate="${o.governorate || ''}" 
    style="cursor:pointer;">
                <td><strong>${o.orderCode || '#'+o.id.slice(0,8)}</strong> ${editedBadge}</td>
                <td>${o.customerName||'—'}</td>
                <td>${o.customerPhone||'—'}</td>
                <td>${o.address||'—'}</td>

                    <span style="font-size: 15px; font-weight: 700;">📅 ${dayLabel}</span>

                    <table>
                        <thead>

    const daysHtml = sortedDays.map(day => renderDayGroup(day, groups[day])).join('');

    // نموذج إضافة طلب جديد (يوضع في الأعلى)
    const isImportMode = importQueue && importQueue.length > 0;
    const newOrderContent = isImportMode

window.toggleAllCSOrdersDays = function() {
    const container = document.getElementById('csOrdersDaysContainer');
    if (!container) return;

    const STORAGE_KEY = 'medora_cs_orders_days_state';
    let storedState = {};
    try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (raw) storedState = JSON.parse(raw);
    } catch (e) {}

    const daySections = container.querySelectorAll('.day-section');
    if (!daySections.length) {
        toast('⚠️ لا توجد أيام', 'info');
        return;
    }

    // بناء الحالة الحالية للأيام إذا كانت فارغة
    if (Object.keys(storedState).length === 0) {
        daySections.forEach(el => {
            const day = el.dataset.day;
            if (day) {
                const body = document.getElementById('csOrdersDayBody_' + day);
                if (body) {
                    storedState[day] = body.style.display !== 'none';
                }
            }
        });
    }

    const allOpen = Object.values(storedState).every(v => v === true);
    const newState = !allOpen;

    Object.keys(storedState).forEach(day => {
        storedState[day] = newState;
        const body = document.getElementById('csOrdersDayBody_' + day);
        const arrow = document.getElementById('csOrdersArrow_' + day);
        if (body) {
            body.style.display = newState ? 'block' : 'none';
        }
        if (arrow) {
            arrow.textContent = newState ? '▾' : '▸';
        }
    });

    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(storedState));
};

// فلترة طلبات خدمة العملاء
window.filterCSOrders = function() {
    const searchVal = document.getElementById('csOrdersSearch')?.value?.trim()?.toLowerCase() || '';
    const statusVal = document.getElementById('csOrdersStatusFilter')?.value || '';
    const govVal = document.getElementById('csOrdersGovFilter')?.value || '';

    // حفظ قيم الفلاتر في sessionStorage
    sessionStorage.setItem('cs_orders_search_value', searchVal);
    sessionStorage.setItem('cs_orders_filter_status', statusVal);
    sessionStorage.setItem('cs_orders_filter_governorate', govVal);

    // الحصول على جميع أيام طلبات خدمة العملاء من الحاوية المخصصة
    const container = document.getElementById('csOrdersDaysContainer');
    if (!container) return;
    const daySections = container.querySelectorAll('.day-section');
    daySections.forEach(section => {
        const rows = section.querySelectorAll('tbody tr');
        let visibleCount = 0;
        rows.forEach(row => {
            const text = row.textContent?.toLowerCase() || '';
            const rowStatus = row.dataset.status || '';
            const rowGov = row.dataset.governorate || '';

            let show = true;
            if (searchVal && !text.includes(searchVal)) show = false;
            if (statusVal && rowStatus !== statusVal) show = false;
            if (govVal && rowGov !== govVal) show = false;

            row.style.display = show ? '' : 'none';
            if (show) visibleCount++;
        });

        const day = section.dataset.day;
        if (day) {
            const countBadge = document.getElementById('csDayCount_' + day);
            if (countBadge) {
                countBadge.textContent = visibleCount === 0 ? 'لا توجد طلبات' : visibleCount + ' طلب';
                countBadge.style.background = visibleCount === 0 ? 'var(--muted)' : '';
            }
        }
    });
};

window.printFilteredOrders = async function() {
    const orders = getSelectedOrders();
    if (!orders.length) {
        toast('❌ يرجى تحديد طلب واحد على الأقل للطباعة', 'danger');
        return;
    }

    // ===== التحقق من الطلبات المطبوعة مسبقاً =====
    const alreadyPrinted = orders.filter(o => o.isPrinted === true);
    if (alreadyPrinted.length > 0) {
        // بناء رسالة تفصيلية
        const names = alreadyPrinted.map(o => {
            const customer = o.customerName || 'غير معروف';
            const code = o.orderCode || o.id.slice(0,8);
            return `👤 ${customer} (كود: ${code})`;
        }).join('\n');

        const msg = `⚠️ الطلبات التالية تم طباعتها سابقاً:\n\n${names}\n\nهل أنت متأكد من إعادة طباعتها؟`;
        if (!confirm(msg)) {
            return;
        }
    } else {
        // رسالة تأكيد عادية للطلبات غير المطبوعة
        if (!confirm(`⚠️ هل أنت متأكد من طباعة ${orders.length} طلب؟ سيتم تمييزها كمطبوعة.`)) {
            return;
        }
    }

    try {
        // تحديث الطلبات في Firestore (تحديث علامة مطبوعة وتوقيت جديد)
        const batch = db.batch();
        orders.forEach(o => {
            const ref = db.collection('orders').doc(o.id);
            batch.update(ref, {
                isPrinted: true,
                printedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await batch.commit();

        toast(`✅ تم تمييز ${orders.length} طلب كمطبوعة`);

        // طباعة الفواتير
        printInvoicesWithOrders(orders, 'الطلبات_المحددة');

        // إعادة تحميل الصفحة لتحديث التمييز
        renderCurrentPage();
    } catch (err) {
        toast('❌ ' + err.message, 'danger');
    }
};

// ================================================================
// تصدير الطلبات المحددة إلى مرحلة الشحن (مع تحويل الحالة)
// ================================================================
window.exportShippingOrders = async function() {
    // 1. تحديد الطلبات المستهدفة: المحددة أولاً، ثم الظاهرة (المفلترة)
    const selected = getSelectedOrders();
    const visibleIds = [...document.querySelectorAll('#ordersTableBody tr:not([style*="display: none"]) .order-check')].map(cb => cb.dataset.id);
    const visibleOrders = allOrders.filter(o => visibleIds.includes(o.id));
    
    const ordersToExport = selected.length > 0 ? selected : visibleOrders;
    
    if (!ordersToExport.length) {
        toast('❌ لا توجد طلبات للتصدير', 'danger');
        return;
    }

    // 2. تحديد اسم الملف بناءً على المراحل الفريدة للطلبات المصدرة
    const stages = ordersToExport.map(o => getOrderStage(o));
    const uniqueStages = [...new Set(stages)];
    const stageNameMap = {
        'بحري': 'شحن بحري',
        'قبلي': 'شحن قبلي',
        'داخلي شحن': 'شحن داخلي'
    };
    let fileName = 'شحن كل المحافظات';
    if (uniqueStages.length === 1 && uniqueStages[0] !== 'غير مصنف') {
        const stage = uniqueStages[0];
        fileName = stageNameMap[stage] || stage;
    }

    // 3. التحقق من الطلبات غير الجديدة (تحذير قبل التحويل)
    const invalidOrders = ordersToExport.filter(o => o.status !== 'جديد');
    if (invalidOrders.length > 0) {
        const invalidCodes = invalidOrders.map(o => o.orderCode || '#'+o.id.slice(0,6)).join('، ');
        if (!confirm(`الطلبات التالية ليست بحالة "جديد": ${invalidCodes}\n\nهل تريد تحويلها إلى "جاري الشحن" مع باقي الطلبات؟`)) {
            return;
        }
    }
    
    if (!confirm(`تحويل ${ordersToExport.length} طلب إلى "جاري الشحن" وتصديرها كـ "${fileName}"؟`)) return;
    
    try {
        const batch = db.batch();
        ordersToExport.forEach(o => {
            batch.update(db.collection('orders').doc(o.id), {
                status: 'جاري الشحن',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await batch.commit();
        
        ordersToExport.forEach(o => o.status = 'جاري الشحن');
        toast(`✅ تم تحويل ${ordersToExport.length} طلب إلى جاري الشحن`);
        
        exportOrdersToExcel(ordersToExport, fileName);
        renderCurrentPage();
    } catch (err) {
        toast('❌ ' + err.message, 'danger');
    }
};

window.toggleAllOrderDays = function() {
    const STORAGE_KEY = 'medora_order_days_state';
    let storedState = {};
    try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (raw) storedState = JSON.parse(raw);
    } catch (e) {}

    // الحصول على جميع عناصر الأيام في الجدول الرئيسي
    const daySections = document.querySelectorAll('#ordersTableWrap .day-section');
    if (!daySections.length) {
        toast('⚠️ لا توجد أيام', 'info');
        return;
    }

    // إذا كانت storedState فارغة، نبنيها من الحالة الحالية
    if (Object.keys(storedState).length === 0) {
        daySections.forEach(el => {
            const day = el.dataset.day;
            if (day) {
                const body = document.getElementById('dayBody_' + day);
                if (body) {
                    storedState[day] = body.style.display !== 'none';
                }
            }
        });
    }

    // تحديد الحالة الجديدة: عكس حالة اليوم الأول
    const dayKeys = Object.keys(storedState);
    if (!dayKeys.length) {
        // إذا لم توجد أيام، نفتح الكل افتراضياً
        daySections.forEach(el => {
            const day = el.dataset.day;
            if (day) {
                storedState[day] = true;
            }
        });
    }

    const allOpen = Object.values(storedState).every(v => v === true);
    const newState = !allOpen; // إذا كان الكل مفتوحاً نغلق، وإلا نفتح

    // تطبيق الحالة الجديدة على كل يوم وتحديث الـ DOM و sessionStorage
    Object.keys(storedState).forEach(day => {
        storedState[day] = newState;
        const body = document.getElementById('dayBody_' + day);
        const arrow = document.getElementById('arrow_' + day);
        if (body) {
            body.style.display = newState ? 'block' : 'none';
        }
        if (arrow) {
            arrow.textContent = newState ? '▾' : '▸';
        }
    });

    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(storedState));
};

async function deleteSelectedOrders() {
    const orders = getSelectedOrders();
    if (!orders.length) {
        toast('❌ يرجى تحديد طلبات أولاً', 'danger');
        return;
    }
    if (!confirm(`هل أنت متأكد من حذف ${orders.length} طلب نهائياً؟ لا يمكن التراجع.`)) return;

    try {
        const batch = db.batch();
        const marketerUpdates = {};
        orders.forEach(o => {
            batch.delete(db.collection('orders').doc(o.id));
            if (o.marketerId) {
                if (!marketerUpdates[o.marketerId]) marketerUpdates[o.marketerId] = 0;
                marketerUpdates[o.marketerId] -= (o.profit || 0);
            }
        });
        for (const [marketerId, diff] of Object.entries(marketerUpdates)) {
            const ref = db.collection('marketers').doc(marketerId);
            batch.set(ref, {
                totalProfit: firebase.firestore.FieldValue.increment(diff)
            }, { merge: true });
        }
        await batch.commit();
        toast(`✅ تم حذف ${orders.length} طلب بنجاح`);
        renderCurrentPage();
    } catch (err) {
        toast('❌ ' + err.message, 'danger');
    }
}

window.retryUnresolvedShipping = function(index) {
    // الحصول على القائمة من sessionStorage
    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}

    if (!items[index]) {
        toast('❌ العنصر غير موجود', 'danger');
        return;
    }

    const item = items[index];
    // لا نحذف العنصر من القائمة الآن، بل نضيفه إلى قائمة المراجعة مع علامة fromUnresolved
    const trackingCode = String(item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || '').trim();
    
    // التأكد من عدم وجود الطلب بالفعل في قائمة المراجعة
    const alreadyInQueue = shippingImportQueue.some(row => (String(row['رقم الشحنة'] || row['رقم الشحنه'] || '').trim() === trackingCode));
    if (!alreadyInQueue) {
        // إضافة الصف إلى قائمة المراجعة مع علامة المصدر
        const rowCopy = { ...item.row, fromUnresolved: true, unresolvedIndex: index };
        shippingImportQueue.push(rowCopy);
        toast('🔄 تم إضافة الطلب للمراجعة مرة أخرى');
    } else {
        toast('⚠️ هذا الطلب موجود بالفعل في قائمة المراجعة', 'warning');
        // مع ذلك، نستمر في المحاولة
    }

    // بدء المراجعة إذا لم تكن قيد التشغيل
    if (!isShippingReviewRunning) {
        isShippingReviewRunning = true;
        reviewNextShippingRow(shippingImportQueue.length - 1);
    } else {
        // إذا كانت قيد التشغيل، نضبط المؤشر لمراجعة العنصر الجديد
        // نوقف المراجعة الحالية ونبدأ من جديد
        isShippingReviewRunning = false;
        setTimeout(() => {
            isShippingReviewRunning = true;
            reviewNextShippingRow(shippingImportQueue.length - 1);
        }, 100);
    }

    renderCurrentPage(); // تحديث الواجهة (لا يزال العنصر موجوداً)
};

function renderUnresolvedOrders() {
    // استرجاع العناصر غير المفهومة من sessionStorage (المصدر الوحيد)
    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}
    
    // نضيف أيضاً أي عناصر في الذاكرة (للتزامن) – لكن الأفضل الاعتماد على sessionStorage فقط
    // ندمج مع unresolvedShippingItems لتجنب فقدان البيانات أثناء الجلسة
    if (unresolvedShippingItems.length > 0) {
        // دمج مع تجنب التكرار (باستخدام معرف فريد)
        const existingIds = new Set(items.map(item => item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || ''));

        try { sessionStorage.setItem('shipping_unresolved_items', JSON.stringify(items)); } catch(e) {}

window.removeUnresolvedItem = async function(index) {
    if (!confirm('حذف هذا العنصر من قائمة غير المفهوم؟ سيتم نقل الطلب إلى سلة المحذوفات.')) return;

    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}

    if (!items[index]) {
        toast('❌ العنصر غير موجود', 'danger');
        return;
    }

    const item = items[index];
    const trackingCode = String(item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || '').trim();

    // البحث عن الطلب في allOrders
    const order = allOrders.find(o => o.orderCode === trackingCode);
    if (order) {
        try {
            // استخدام batch لتحديث الطلب
            await db.collection('orders').doc(order.id).update({
                isDeleted: true,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
                deletedBy: currentUser.uid,
                originalStatus: order.status || 'جديد',
                status: 'محذوف',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            // تحديث الكائن المحلي
            Object.assign(order, {
                isDeleted: true,
                deletedAt: new Date(),
                deletedBy: currentUser.uid,
                originalStatus: order.status || 'جديد',
                status: 'محذوف'
            });
            toast('✅ تم نقل الطلب إلى سلة المحذوفات');
        } catch (err) {
            toast('❌ فشل نقل الطلب إلى المحذوفات: ' + err.message, 'danger');
            return;
        }
    } else {
        toast('⚠️ لم يتم العثور على الطلب في النظام، سيتم حذفه من قائمة غير المفهوم فقط', 'warning');
    }

    // حذف العنصر من القائمة
    items.splice(index, 1);
    try { sessionStorage.setItem('shipping_unresolved_items', JSON.stringify(items)); } catch(e) {}
    unresolvedShippingItems = items;
    renderCurrentPage();
};

window.clearAllUnresolved = async function() {
    if (!confirm('مسح جميع العناصر غير المفهومة؟ سيتم نقل الطلبات الموجودة إلى سلة المحذوفات.')) return;

    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}

    if (!items.length) {
        toast('⚠️ لا توجد عناصر', 'warning');
        return;
    }

    // استخدام batch واحد لتحديث جميع الطلبات دفعة واحدة
    const batch = db.batch();
    let movedCount = 0;
    const orderRefs = [];

    for (const item of items) {
        const trackingCode = String(item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || '').trim();
        const order = allOrders.find(o => o.orderCode === trackingCode);
        if (order) {
            const ref = db.collection('orders').doc(order.id);
            batch.update(ref, {
                isDeleted: true,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
                deletedBy: currentUser.uid,
                originalStatus: order.status || 'جديد',
                status: 'محذوف',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            // تحديث الكائن المحلي (للتحديث الفوري)
            Object.assign(order, {
                isDeleted: true,
                deletedAt: new Date(),
                deletedBy: currentUser.uid,
                originalStatus: order.status || 'جديد',
                status: 'محذوف'
            });
            orderRefs.push(ref);
            movedCount++;
        }
    }

    if (orderRefs.length > 0) {
        try {
            await batch.commit();
            toast(`✅ تم نقل ${movedCount} طلب إلى المحذوفات`);
        } catch (err) {
            toast('❌ فشل تحديث الطلبات: ' + err.message, 'danger');
            return;
        }
    }

    // مسح القائمة بغض النظر عن النتيجة
    try { sessionStorage.removeItem('shipping_unresolved_items'); } catch(e) {}
    unresolvedShippingItems = [];
    renderCurrentPage();
};

window.parsePastedOrders = function() {
    const raw = document.getElementById('pasteOrdersInput')?.value;
    if (!raw || !raw.trim()) { toast('❌ يرجى إدخال النص', 'danger'); return; }

    const blocks = raw.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
    if (!blocks.length) { toast('❌ لم يتم العثور على طلبات', 'danger'); return; }

    // دوال مساعدة
    const extractValue = (line, keywords) => {
        for (const kw of keywords) {
            const regex = new RegExp(`${kw}\\s*[:：]\\s*(.*)`, 'i');
            const match = line.match(regex);
            if (match) return match[1].trim();
        }
        return null;
    };
    const extractPhone = (line) => {
        let cleaned = line.replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660));
        let nums = cleaned.match(/(?:\+?20|0)?1[0125][0-9]{8}/);
        if (nums) return nums[0];
        nums = cleaned.match(/\b01[0125][0-9]{8}\b/);
        return nums ? nums[0] : null;
    };
    const parseProducts = (productStr) => {
        if (!productStr) return [];
        const items = productStr.split(/[-;،]/).map(s => s.trim()).filter(Boolean);
        return items.map(item => {
            const match = item.match(/^(.*?)\s*[\(（]\s*(?:سعر\s*)?([\d.]+)\s*[\)）]/);
            if (match) {
                return { productName: match[1].trim(), sellPrice: parseFloat(match[2]) || 0 };
            }
            return { productName: item, sellPrice: 0 };
        });
    };

    // تحليل كل كتلة
    const parsedOrders = blocks.map(block => {
        const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !/^\[.*\]/.test(l));
        if (!lines.length) return null;

        let order = {
            customerName: '', phone: '', governorate: '', city: '', address: '',
            products: [], weightSize: '', totalPrice: 0, shippingCost: null, notes: ''
        };

        for (const line of lines) {
            let val;
            if ((val = extractValue(line, ['اسم العميل', 'العميل', 'الاسم'])) !== null) {
                order.customerName = val;
            } else if ((val = extractValue(line, ['رقم التليفون', 'رقم الهاتف', 'التليفون', 'الهاتف', 'الموبايل'])) !== null) {
                order.phone = val;
            } else if ((val = extractValue(line, ['المحافظة', 'محافظة'])) !== null) {
                order.governorate = val;
            } else if ((val = extractValue(line, ['المدينة', 'مدينة'])) !== null) {
                order.city = val;
            } else if ((val = extractValue(line, ['العنوان', 'عنوان'])) !== null) {
                order.address = (order.address ? order.address + ' ' : '') + val;
            } else if ((val = extractValue(line, ['المنتج', 'منتج'])) !== null) {
                order.products = parseProducts(val);
            } else if ((val = extractValue(line, ['الوزن', 'المقاس', 'الوزن/المقاس'])) !== null) {
                order.weightSize = val;
            } else if ((val = extractValue(line, ['السعر', 'الإجمالي'])) !== null) {
    val = arabicToEnglishDigits(val);
    order.totalPrice = parseFloat(val) || 0;
} else if ((val = extractValue(line, ['الشحن', 'سعر الشحن'])) !== null) {
    val = arabicToEnglishDigits(val);
    const shippingVal = parseFloat(val);
    if (!isNaN(shippingVal)) {
        order.shippingCost = shippingVal;
    }
            } else if ((val = extractValue(line, ['ملاحظات', 'ملحوظات'])) !== null) {
                order.notes = (order.notes ? order.notes + ' ' : '') + val;
            } else {
                const phone = extractPhone(line);
                if (phone && !order.phone) {
                    order.phone = phone;
                } else if (!order.customerName && line.length < 30) {
                    order.customerName = line;
                } else if (line.includes('ك') && line.includes('سم')) {
                    if (!order.weightSize) order.weightSize = line;
                } else if (line.includes('ج') || line.includes('جنيه')) {
                    const price = parseFloat(line.replace(/[^0-9.]/g, ''));
                    if (price && !order.totalPrice) order.totalPrice = price;
                } else {
                    if (!order.address) order.address = line;
                    else order.notes = (order.notes ? order.notes + ' ' : '') + line;
                }
            }
        }

        if (!order.customerName && lines.length > 0) {
            const firstLine = lines[0];
            if (!firstLine.includes(':')) {
                order.customerName = firstLine;
            }
        }

        return order;
    }).filter(o => o && (o.customerName || o.phone));

    if (!parsedOrders.length) { toast('❌ لم يتم العثور على طلبات صالحة', 'danger'); return; }

    // بناء قائمة الاستيراد مع مطابقة المحافظات والمدن والمنتجات
    const pageId = currentUserPageId;
    const queue = parsedOrders.map(o => {
        const govResult = matchGovernorate(o.governorate);
        const govMatch = govResult.match || '';
        const cityResult = govMatch ? matchCity(o.city, govMatch) : { match: null, confidence: 0 };
        const cityMatch = cityResult.match || '';

        let products = o.products || [];
        let weightItems = [];
        if (o.weightSize) {
            weightItems = o.weightSize.split(/[-;،]/).map(w => w.trim()).filter(w => w.length > 0);
        }

        let weightedProducts = [];
        if (products.length === 0 && o.totalPrice > 0) {
            products = [{ productName: 'منتج', sellPrice: o.totalPrice }];
        }
        if (products.length > 0) {
            if (weightItems.length > 0) {
                const prodCount = products.length;
                const weightCount = weightItems.length;
                if (prodCount === weightCount) {
                    weightedProducts = products.map((p, idx) => ({ ...p, weightSize: weightItems[idx] || '' }));
                } else if (prodCount < weightCount) {
                    const firstWeights = weightItems.slice(0, prodCount - 1);
                    const lastWeights = weightItems.slice(prodCount - 1).join(' - ');
                    weightedProducts = products.map((p, idx) => {
                        if (idx < prodCount - 1) {
                            return { ...p, weightSize: firstWeights[idx] || '' };
                        } else {
                            return { ...p, weightSize: lastWeights };
                        }
                    });
                } else {
                    weightedProducts = products.map((p, idx) => ({
                        ...p,
                        weightSize: weightItems[idx] || weightItems[weightItems.length - 1] || ''
                    }));
                }
            } else {
                weightedProducts = products.map(p => ({ ...p, weightSize: '' }));
            }
        }

        // ===== إضافة مطابقة المنتج مع قاعدة البيانات =====
        const matchedProducts = weightedProducts.map(p => {
            const matched = matchProduct(p.productName, pageId);
            return {
                ...p,
                productId: matched.match ? matched.match.id : '',
                productName: matched.match ? matched.match.name : p.productName  // الاسم الصحيح من قاعدة البيانات
            };
        });

        if (matchedProducts.length && o.totalPrice > 0) {
            const totalSell = matchedProducts.reduce((sum, p) => sum + (p.sellPrice || 0), 0);
            if (totalSell === 0) {
                const perProduct = o.totalPrice / matchedProducts.length;
                matchedProducts.forEach(p => p.sellPrice = perProduct);
            }
        }

        return {
            customerName: o.customerName || '',
            phoneRaw: o.phone || '',
            phone: normalizeEgyptianPhone(o.phone || ''),
            phoneValid: isValidEgyptianPhone(o.phone || ''),
            governorate: govMatch,
            govConfidence: govResult.confidence,
            city: cityMatch,
            cityConfidence: cityResult.confidence,
            address: o.address || '',
            products: matchedProducts.map(p => ({
                productId: p.productId,
                productName: p.productName,
                sellPrice: p.sellPrice || 0,
                qty: 1,
                weightSize: p.weightSize || ''
            })),
            statusType: 'شراء',
           shippingCost: (o.shippingCost !== null && !isNaN(o.shippingCost)) ? o.shippingCost : null,
            notes: o.notes || ''
        };
    }).filter(o => o && (o.customerName || o.phoneRaw));

    if (!queue.length) { toast('❌ لم يتم العثور على طلبات صالحة بعد التنظيف', 'danger'); return; }

    importQueue = queue;
    importResults = {};
    closeModal();
    renderCurrentPage();
    toast(`✅ تم استيراد ${queue.length} طلب، راجعهم وأكّد أو تخطّ`);
};

function findDuplicateOrders(data) {
    const allOrdersList = allOrders;
    const phone = normalizeEgyptianPhone(data.phone);
    const phone2 = data.phone2 ? normalizeEgyptianPhone(data.phone2) : '';
    const name = data.customer?.trim() || '';
    const governorate = data.governorate || '';
    const city = data.city || '';

    // المكررات حسب الهاتف (أساسي أو إضافي)
    const duplicatesByPhone = allOrdersList.filter(o => {
        const oPhone = normalizeEgyptianPhone(o.customerPhone || '');
        const oPhone2 = normalizeEgyptianPhone(o.customerPhone2 || '');
        return (oPhone && (oPhone === phone || oPhone === phone2)) ||
               (oPhone2 && (oPhone2 === phone || oPhone2 === phone2));
    });

    // المكررات حسب (الاسم + المحافظة + المدينة)
    const duplicatesByNameLoc = allOrdersList.filter(o => {
        const oName = (o.customerName || '').trim();
        const oGov = (o.governorate || '').trim();
        const oCity = (o.city || '').trim();
        return name && governorate && city && oName && oGov && oCity && oName === name && oGov === governorate && oCity === city;
    });

    // دمج المكررات مع تجنب التكرار
    const dupMap = {};
    duplicatesByPhone.forEach(o => dupMap[o.id] = o);
    duplicatesByNameLoc.forEach(o => dupMap[o.id] = o);
    const duplicates = Object.values(dupMap);

    if (duplicates.length === 0) {
        return { found: false, count: 0, orders: [], message: '' };
    }

    // بناء رسالة مفصلة مع تاريخ الإنشاء
    const details = duplicates.map(o => {
        const page = allPages.find(p => p.id === o.pageId);
        const code = o.orderCode || '#' + o.id.slice(0,8);
        const status = o.status || 'غير معروفة';
        const pageName = page?.name || 'غير معروفة';
        const createdDate = o.createdAt?.toDate ? 
            o.createdAt.toDate().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : 
            (o.createdAt ? new Date(o.createdAt).toLocaleDateString('ar-EG') : 'غير معروف');
        return `كود: ${code}، الحالة: ${status}، الصفحة: ${pageName}، التاريخ: ${createdDate}`;
    }).join(' | ');
    const count = duplicates.length;
    const msg = `⚠️ يوجد ${count} طلب مكرر:\n${details}\n\nهل تريد المتابعة وإضافة الطلب رغم التكرار؟`;

    return { found: true, count, orders: duplicates, message: msg };
}
