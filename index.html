<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDORA - نظام إدارة الصفحات</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ========== RESET & VARIABLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #7a8499;
            --line: #e8ebf2;
            --primary: #5b5ce2;
            --success: #16a56b;
            --warning: #e99a20;
            --danger: #e04f5f;
            --info: #2588d9;
            --shadow: 0 8px 24px rgba(28, 39, 75, 0.08);
            --radius: 14px;
            --transition: 0.25s ease;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ========== LOGIN ========== */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #11152a, #1b2140);
            padding: 20px;
        }
        .login-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 44px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-box h2 {
            font-size: 28px;
            margin-bottom: 4px;
            color: #11152a;
        }
        .login-box p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #2a2f45;
        }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            transition: var(--transition);
            outline: none;
            font-size: 14px;
        }
        .login-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.12);
        }
        .login-box .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 18px;
            transition: var(--transition);
        }
        .login-box .btn-primary:hover {
            background: #4a4bcc;
            transform: translateY(-1px);
        }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .login-role {
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
            text-align: center;
        }
        .login-role strong {
            color: var(--primary);
        }

        /* ========== APP LAYOUT ========== */
        #app {
            display: none;
            min-height: 100vh;
        }
        .sidebar {
            width: 270px;
            background: #11152a;
            color: #fff;
            padding: 20px 14px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            transition: var(--transition);
            overflow-y: auto;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px 26px;
        }
        .sidebar .brand-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #6b6ce9, #9a8cff);
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 19px;
        }
        .sidebar .brand h2 {
            font-size: 18px;
            margin: 0;
        }
        .sidebar .brand small {
            color: #9298b3;
            font-size: 11px;
        }
        .close-sidebar {
            color: #9298b3;
            font-size: 22px;
            padding: 4px 8px;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }
        .close-sidebar:hover {
            color: #fff;
        }
        .nav-title {
            font-size: 11px;
            color: #717895;
            margin: 18px 12px 8px;
            letter-spacing: 0.5px;
        }
        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            color: #c7cbe0;
            margin: 3px 0;
            font-size: 14px;
            transition: var(--transition);
        }
        .nav a:hover,
        .nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .nav a.active {
            box-shadow: inset -3px 0 0 #8b8cf4;
        }
        .nav .icon {
            width: 24px;
            text-align: center;
            font-size: 16px;
        }
        .badge-nav {
            margin-right: auto;
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        .main {
            margin-right: 270px;
            padding: 22px 28px 40px;
            min-height: 100vh;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .page-title h1 {
            font-size: 24px;
            margin: 0 0 3px;
        }
        .page-title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: var(--card);
            border: 1px solid var(--line);
            padding: 9px 16px;
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff !important;
        }
        .btn-primary:hover {
            background: #4a4bcc;
            border-color: #4a4bcc;
        }
        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #fff !important;
        }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff !important;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--line);
            position: relative;
            font-size: 18px;
            display: grid;
            place-items: center;
        }
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--danger);
            border-radius: 50%;
            top: 8px;
            left: 8px;
        }
        .mobile-menu {
            display: none;
        }

        /* ========== CARDS ========== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 12px 32px rgba(28, 39, 75, 0.1);
        }
        .stat {
            padding: 18px 20px;
        }
        .stat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #f0f0ff;
            color: var(--primary);
            font-size: 18px;
        }
        .stat h2 {
            font-size: 26px;
            margin: 12px 0 4px;
        }
        .stat .change {
            font-size: 12px;
        }
        .up {
            color: var(--success);
        }
        .down {
            color: var(--danger);
        }

        /* ========== GRID ========== */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        .panel {
            padding: 18px 20px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-head h3 {
            font-size: 16px;
            margin: 0;
        }
        .panel-head .muted {
            color: var(--muted);
            font-size: 12px;
        }
        .chart-wrap {
            height: 260px;
        }

        /* ========== STATUS LIST ========== */
        .status-list {
            display: grid;
            gap: 12px;
        }
        .status-row {
            display: grid;
            grid-template-columns: 85px 1fr 45px;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .bar {
            height: 8px;
            background: #edf0f5;
            border-radius: 99px;
            overflow: hidden;
        }
        .bar span {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: var(--primary);
        }

        /* ========== TABLE ========== */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }
        th {
            color: var(--muted);
            font-weight: 600;
            background: #fafbfc;
        }
        .badge {
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-success {
            background: #e9f8f1;
            color: #0b8b59;
        }
        .badge-warning {
            background: #fff5df;
            color: #b87300;
        }
        .badge-danger {
            background: #ffeaed;
            color: #c83949;
        }
        .badge-info {
            background: #e9f4ff;
            color: #1671b9;
        }
        .badge-secondary {
            background: #f0f0f0;
            color: #555;
        }
        .customer {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ececff;
            color: #5354ca;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ========== FORMS ========== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fafbfc;
            outline: none;
            transition: var(--transition);
            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 620px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 18px;
        }
        .modal-box .close-modal {
            float: left;
            font-size: 22px;
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .close-modal:hover {
            color: var(--danger);
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #151a2d;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: 0.35s ease;
            z-index: 200;
            font-size: 14px;
            max-width: 380px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ========== USER CARDS ========== */
        .user-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .user-card:hover {
            box-shadow: var(--shadow);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
        }
        .user-details h4 {
            margin: 0 0 4px;
        }
        .user-details small {
            color: var(--muted);
        }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-admin {
            background: #e74c3c;
            color: #fff;
        }
        .role-moderator {
            background: #f39c12;
            color: #fff;
        }
        .role-marketer {
            background: #2ecc71;
            color: #fff;
        }
        .role-customer_service {
            background: #3498db;
            color: #fff;
        }
        .user-actions {
            display: flex;
            gap: 8px;
        }
        .page-tag {
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-right: 8px;
        }

        /* ========== PAGE CARDS ========== */
        .page-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .page-card:hover {
            box-shadow: var(--shadow);
        }
        .page-info h4 {
            margin: 0 0 4px;
        }
        .page-info small {
            color: var(--muted);
        }
        .page-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
        }
        .page-stats span {
            color: var(--muted);
        }
        .page-stats strong {
            color: var(--text);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 760px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .close-sidebar {
                display: block;
            }
            .main {
                margin-right: 0;
                padding: 16px 14px;
            }
            .mobile-menu {
                display: inline-flex;
            }
            .topbar {
                align-items: flex-start;
            }
            .actions .hide-mobile {
                display: none;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
            .stat h2 {
                font-size: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 20px;
            }
            .page-stats {
                flex-direction: column;
                gap: 4px;
            }
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .page-title h1 {
                font-size: 20px;
            }
            .actions {
                gap: 6px;
            }
            .btn {
                font-size: 12px;
                padding: 7px 12px;
            }
        }

        .text-muted {
            color: var(--muted);
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gap-1 {
            gap: 6px;
        }
        .hidden {
            display: none !important;
        }

        /* ========== STAGE / SHIPPING SECTIONS ========== */
        .stage-section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .stage-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 18px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .stage-head h4 {
            margin: 0;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stage-count {
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .stage-check-all {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }
        .ship-check, .stage-check {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ========== SALES CARDS ========== */
        .sales-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .sales-card .sales-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sales-head h3 {
            margin: 0;
            font-size: 16px;
        }
        .sales-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }
        .sales-mini {
            background: var(--bg);
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--line);
        }
        .sales-mini span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }
        .sales-mini b {
            font-size: 19px;
        }
        .sales-mini.gain b { color: var(--success); }
        .sales-mini.loss b { color: var(--danger); }
        .sales-mini.net b { color: var(--primary); }
        .mt-2 {
            margin-top: 12px;
        }
        .w-full {
            width: 100%;
        }
        /* ========== ACCORDION / GOV SETTINGS ========== */
.gov-accordion {
    transition: 0.2s;
}
.gov-accordion:hover .gov-accordion-head {
    background: #f0f2f7;
}
.gov-accordion-head {
    border-radius: 8px;
    padding: 8px 12px;
}
.gov-accordion-head:hover {
    background: #f0f2f7;
}

/* ========== PAGE MEMBERS TOGGLE ========== */
.page-members {
    animation: fadeSlide 0.3s ease;
}
@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ========== BULK ACTIONS ========== */
#bulkActionsWrap {
    animation: fadeSlide 0.25s ease;
}
/* تمييز الصف المحدد */
.shipping-table-body tr.selected-row,
#ordersTableBody tr.selected-row {
    background-color: #e0e7ff !important;
    transition: background-color 0.2s ease;
}
    </style>
</head>
<body>

    <!-- ========== TOAST ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== LOGIN ========== -->
    <div id="loginPage">

// ================================================================
// IMPORT HELPERS: تطبيع النصوص العربية + التحقق من رقم الهاتف المصري + مطابقة المحافظات
// ================================================================
function normalizeArabic(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .trim()
        .replace(/[أإآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[ًٌٍَُِّْ]/g, '')
        .replace(/\s+/g, ' ')
        .toLowerCase();
}

function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        }
    }
    return d[m][n];
}

// يحاول مطابقة نص محافظة مكتوب بأي صيغة إلى اسم محافظة رسمي من GOVERNORATE_CITIES
function matchGovernorate(raw) {
    if (!raw) return { match: null, confidence: 0 };
    const norm = normalizeArabic(raw);
    const names = Object.keys(GOVERNORATE_CITIES);
    // تطابق تام بعد التطبيع
    for (const g of names) {
        if (normalizeArabic(g) === norm) return { match: g, confidence: 1 };
    }
    // تطابق احتوائي (مثال: "المنصوره الدقهليه" تحتوي على "الدقهلية")
    for (const g of names) {
        const ng = normalizeArabic(g);
        if (norm.includes(ng) || ng.includes(norm)) return { match: g, confidence: 0.85 };
    }
    // أقرب تطابق بالمسافة النصية (Levenshtein)
    let best = null, bestDist = Infinity;
    for (const g of names) {
        const dist = levenshtein(normalizeArabic(g), norm);
        if (dist < bestDist) { bestDist = dist; best = g; }
    }
    const maxLen = Math.max(normalizeArabic(best || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    if (confidence >= 0.55) return { match: best, confidence };
    return { match: null, confidence };
}

// يحاول مطابقة نص مدينة إلى مدينة رسمية ضمن محافظة معينة
function matchCity(raw, governorate) {
    if (!raw || !governorate || !GOVERNORATE_CITIES[governorate]) return { match: null, confidence: 0 };
    const norm = normalizeArabic(raw);
    const cities = GOVERNORATE_CITIES[governorate];
    for (const c of cities) {
        if (normalizeArabic(c) === norm) return { match: c, confidence: 1 };
    }
    let best = null, bestDist = Infinity;
    for (const c of cities) {
        const dist = levenshtein(normalizeArabic(c), norm);
        if (dist < bestDist) { bestDist = dist; best = c; }
    }
    const maxLen = Math.max(normalizeArabic(best || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    if (confidence >= 0.5) return { match: best, confidence };
    return { match: null, confidence: 0 };
}

// تطبيع وتحقق رقم الهاتف المصري: 01[0125] + 8 أرقام = 11 رقم
function normalizeEgyptianPhone(raw) {
    if (!raw) return '';
    let s = String(raw).trim();
    s = s.replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660)); // أرقام عربية -> إنجليزية
    s = s.replace(/[^\d+]/g, '');
    s = s.replace(/^\+?20/, '0').replace(/^0020/, '0');
    if (!s.startsWith('0') && s.length === 10) s = '0' + s;
    return s;
}
function isValidEgyptianPhone(raw) {
    const s = normalizeEgyptianPhone(raw);
    return /^01[0125][0-9]{8}$/.test(s);
}

// دالة إنشاء كود طلب فريد
async function generateOrderCode(pageId, marketerId, currentDate = new Date()) {
    // الحصول على اسم الصفحة واسم المستخدم (اختصار)
    const page = allPages.find(p => p.id === pageId);
    const marketer = allMarketers.find(m => m.id === marketerId);
    const pagePrefix = page ? page.name.substring(0, 3).toUpperCase() : 'PAG';
    const userPrefix = marketer ? marketer.name.substring(0, 3).toUpperCase() : 'USR';

    // التاريخ: YYMMDD
    const y = currentDate.getFullYear().toString().slice(-2);
    const m = String(currentDate.getMonth() + 1).padStart(2, '0');
    const d = String(currentDate.getDate()).padStart(2, '0');
    const dateStr = y + m + d;

    // حساب عدد الطلبات الإجمالي لهذه الصفحة (منذ البداية)
    const totalOrdersForPage = allOrders.filter(o => o.pageId === pageId).length;
    const seq = String(totalOrdersForPage + 1).padStart(4, '0');

    // حساب عدد الطلبات اليومية لهذه الصفحة
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayOrders = allOrders.filter(o => {
        const oDate = o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
        return o.pageId === pageId && oDate >= today;
    }).length;
    const daily = String(todayOrders + 1).padStart(3, '0');

    // الكود النهائي: [بادئة الصفحة]-[بادئة المستخدم]-[التاريخ]-[التسلسل]-[اليومي]
    return `${pagePrefix}-${userPrefix}-${dateStr}-${seq}-${daily}`;
}

                        currentUserData = userDoc.data();
                        currentUserRole = currentUserData.role || 'marketer';
                        currentUserPageId = currentUserData.pageId || null;
                    } else {
                        currentUserRole = 'marketer';
                        currentUserPageId = null;
                        currentUserData = { email: user.email, role: 'marketer', name: 'مسوق', pageId: null };
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: 'marketer',
                            name: 'مسوق',
                            pageId: null,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                } catch (e) {
                    console.warn('User role error:', e);
                    currentUserRole = 'marketer';
                    currentUserPageId = null;
                    currentUserData = { email: user.email, role: 'marketer', name: 'مسوق', pageId: null };
                }

                $('loginPage').style.display = 'none';
                $('app').style.display = 'block';
                const roleNames = { admin: 'مدير النظام', moderator: 'مشرف', marketer: 'مسوق',
                    customer_service: 'خدمة عملاء' };
                $('userRoleDisplay').textContent = roleNames[currentUserRole] || 'مسوق';

                if (currentUserPageId) {
                    const page = allPages.find(p => p.id === currentUserPageId);
                    $('userPageDisplay').textContent = '📄 ' + (page?.name || 'صفحة غير معروفة');
                } else {
                    $('userPageDisplay').textContent = currentUserRole === 'admin' ? '🔑 تحكم كامل' : '📄 غير مخصص لصفحة';
                }

                $('todayDate').textContent = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'full' }).format(new Date());
                initApp();
            } else {
                $('app').style.display = 'none';
                $('loginPage').style.display = 'flex';
                if (unsubOrders) { unsubOrders();
                    unsubOrders = null; }
                if (unsubMarketers) { unsubMarketers();
                    unsubMarketers = null; }
                if (unsubProducts) { unsubProducts();
                    unsubProducts = null; }
                if (unsubUsers) { unsubUsers();
                    unsubUsers = null; }
                if (unsubSettings) { unsubSettings();
                    unsubSettings = null; }
                if (unsubPages) { unsubPages();
                    unsubPages = null; }
                isDataLoaded = false;
            }
        });

        // ================================================================
        // INIT APP
        // ================================================================
        function initApp() {
            buildNav();
            loadAllData();

            if (unsubOrders) unsubOrders();
            if (unsubMarketers) unsubMarketers();
            if (unsubProducts) unsubProducts();
            if (unsubUsers) unsubUsers();
            if (unsubSettings) unsubSettings();
            if (unsubPages) unsubPages();

            unsubPages = db.collection('pages').onSnapshot(snap => {
                allPages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (currentUserPageId) {
                    const page = allPages.find(p => p.id === currentUserPageId);
                    $('userPageDisplay').textContent = '📄 ' + (page?.name || 'صفحة غير معروفة');
                }
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Pages error:', err);
            });

            unsubOrders = db.collection('orders').onSnapshot(snap => {
                allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Orders error:', err);
            });

            unsubMarketers = db.collection('marketers').onSnapshot(snap => {
                allMarketers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Marketers error:', err);
            });

            unsubProducts = db.collection('products').onSnapshot(snap => {
                allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Products error:', err);
            });

            unsubUsers = db.collection('users').onSnapshot(snap => {
                allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Users error:', err);
            });

            unsubSettings = db.collection('settings').doc('general').onSnapshot(doc => {
                if (doc.exists) allSettings = doc.data();
                if (isDataLoaded) renderCurrentPage();
            }, err => {
                console.warn('Settings error:', err);
            });

            setupSidebarClose();
        }

        // ================================================================
        // SIDEBAR CLOSE LOGIC
        // ================================================================
        function setupSidebarClose() {
            const sidebar = $('sidebar');
            const closeBtn = $('closeSidebar');
            const mobileMenuBtn = document.querySelector('.mobile-menu');

            if (closeBtn) {
                closeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    sidebar.classList.remove('open');
                });
            }

            document.querySelectorAll('#mainNav a').forEach(link => {
                link.addEventListener('click', () => {
                    sidebar.classList.remove('open');
                });
            });

            document.addEventListener('click', (e) => {
                const isSidebar = sidebar.contains(e.target);
                const isMobileMenu = mobileMenuBtn && mobileMenuBtn.contains(e.target);
                if (!isSidebar && !isMobileMenu && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            });

            sidebar.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        // ================================================================
        // FILTER DATA BY PAGE
        // ================================================================
        function getFilteredOrders() {
    if (currentUserRole === 'admin' || currentUserRole === 'moderator') {
        return [...allOrders];
    }
    if (currentUserPageId) {
        return allOrders.filter(o => o.pageId === currentUserPageId);
    }
    return [];
}

        function getFilteredMarketers() {
            let filtered = [...allMarketers];
            if (currentUserRole === 'admin' || currentUserRole === 'moderator') {
                return filtered;
            }
            if (currentUserPageId) {
                filtered = filtered.filter(m => m.pageId === currentUserPageId);
            } else {
                filtered = [];
            }
            return filtered;
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
      function buildNav() {
    const nav = $('mainNav');
    let links = [];

    if (currentUserRole === 'admin') {
        links = [
            { id: 'dashboard', label: '📊 لوحة التحكم' },
            { id: 'orders', label: '📋 إدارة الطلبات' },
            { id: 'shipping', label: '🚚 إدارة الشحن' },
            { id: 'products', label: '📦 منتجات الصفحات' },
            { id: 'sales', label: '💰 إدارة المبيعات' },
            { id: 'pages', label: '📄 إدارة الصفحات (فريق العمل)' },
            { id: 'settings', label: '🏙️ إدارة المحافظات' },
            { id: 'orderlog', label: '📜 سجل الطلبات' }
        ];
    } else if (currentUserRole === 'moderator') {
        links = [
            { id: 'dashboard', label: '📊 لوحة التحكم' },
            { id: 'orders', label: '📋 إدارة الطلبات' },
            { id: 'sales', label: '💰 إدارة المبيعات' },
            { id: 'orderlog', label: '📜 سجل الطلبات' }
        ];
    } else if (currentUserRole === 'customer_service') {
        links = [
            { id: 'dashboard', label: '📊 لوحة التحكم' },
            { id: 'orders', label: '📋 إدارة الطلبات' }
        ];
    } else { // marketer
        links = [
            { id: 'dashboard', label: '📊 لوحتي' },
            { id: 'orders', label: '📋 إدارة الطلبات' },
            { id: 'products', label: '📦 منتجاتي' },
            { id: 'sales', label: '💰 مبيعات صفحتي' },
            { id: 'csUsers', label: '🛎️ خدمة العملاء' },
            { id: 'orderlog', label: '📜 سجل طلباتي' }
        ];
    }
    nav.innerHTML = links.map(l =>
        `<a href="#" class="${l.id === currentTab ? 'active' : ''}" data-tab="${l.id}">${l.label}</a>`
    ).join('');
    nav.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            currentTab = a.dataset.tab;
            nav.querySelectorAll('a').forEach(x => x.classList.remove('active'));
            a.classList.add('active');
            renderCurrentPage();

    const titles = {
        dashboard: 'لوحة التحكم',

        users: 'إدارة الحسابات',
        marketers: 'إدارة المسوقين',
        products: 'إدارة المنتجات',
        orders: 'إدارة الطلبات',
        shipping: 'إدارة الشحن والتجهيز',
        sales: 'إدارة المبيعات',
        settings: 'إدارة المحافظات',
        newOrder: 'إضافة طلب جديد',
        csUsers: 'خدمة العملاء',
        orderlog: '📜 سجل الطلبات'
    };
    $('pageTitle').textContent = titles[currentTab] || 'لوحة التحكم';

    const actionBtn = $('actionBtn');
    if (currentTab === 'newOrder') {
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = '＋ طلب جديد';
    } else if (currentTab === 'pages' && currentUserRole === 'admin') {
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = '＋ صفحة جديدة';
    } else if (currentTab === 'users' && currentUserRole === 'admin') {
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = '＋ حساب جديد';
    } else if (currentTab === 'products' && currentUserRole === 'admin') {
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = '＋ منتج جديد';
    } else if (currentTab === 'csUsers' && currentUserRole === 'marketer') {
        actionBtn.style.display = 'inline-flex';
        actionBtn.textContent = '＋ إضافة خدمة عملاء';
    } else {
        actionBtn.style.display = 'none';
    }
}

        // ================================================================
        // RENDER
        // ================================================================
        function renderCurrentPage() {
            if (!isDataLoaded) return;
            const content = $('pageContent');
            switch (currentTab) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'pages':
                    content.innerHTML = renderPages();
                    break;
                case 'users':
                    content.innerHTML = renderUsers();
                    break;
                case 'marketers':
                    content.innerHTML = renderMarketers();
                    break;
                case 'products':
                    content.innerHTML = renderProducts();
                    break;
                case 'orders':
                    content.innerHTML = renderOrders();
                    break;
                case 'orderlog':
                   content.innerHTML = renderOrderLog();
                    break;
                case 'shipping':
                    content.innerHTML = renderShipping();
                    break;
                case 'sales':
                    content.innerHTML = renderSales();
                    break;
                case 'settings':
                    content.innerHTML = renderSettings();
                    break;
                case 'newOrder':
                    content.innerHTML = renderNewOrder();
                    break;
                default:
                    content.innerHTML = renderDashboard();
                case 'csUsers':
                    content.innerHTML = renderCSUsers();
                    break;
            }
            bindEvents();
        }

        // ================================================================
        // DASHBOARD
        // ================================================================
        function renderDashboard() {
            const filteredOrders = getFilteredOrders();

            const totalOrders = filteredOrders.length;
            const totalSales = filteredOrders.reduce((s, o) => s + (o.total || 0), 0);
            const totalProfit = filteredOrders.reduce((s, o) => s + (o.profit || 0), 0);
            const delivered = filteredOrders.filter(o => o.status === 'تم التسليم').length;

            let pageName = 'جميع الصفحات';
            if (currentUserPageId) {
                const page = allPages.find(p => p.id === currentUserPageId);
                pageName = page?.name || 'صفحتي';
            }
            if (currentUserRole === 'admin') pageName = 'جميع الصفحات (مدير)';
            if (currentUserRole === 'moderator') pageName = 'جميع الصفحات (مشرف)';

            const statusCounts = {};
            filteredOrders.forEach(o => {
                const s = o.status || 'جديد';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });
            const statusColors = {
                'جديد': 'var(--primary)',
                'قيد التجهيز': 'var(--success)',
                'قيد الشحن': 'var(--warning)',
                'تم التسليم': 'var(--info)',
                'ملغي': 'var(--danger)',
                'مرتجع': '#9b59b6'
            };
            let statusRows = Object.entries(statusCounts).map(([label, count]) => {
                const pct = totalOrders ? Math.round((count / totalOrders) * 100) : 0;
                const color = statusColors[label] || 'var(--primary)';
                return `<div class="status-row"><span>${label}</span><div class="bar"><span style="width:${pct}%;background:${color}"></span></div><b>${count}</b></div>`;
            }).join('');

            const marketerStats = {};
            filteredOrders.forEach(o => {
                const m = o.marketerId || 'unknown';
                if (!marketerStats[m]) marketerStats[m] = { count: 0, sales: 0, profit: 0 };
                marketerStats[m].count++;
                marketerStats[m].sales += (o.total || 0);
                marketerStats[m].profit += (o.profit || 0);
            });
            let topMarketers = Object.entries(marketerStats)
                .sort((a, b) => b[1].profit - a[1].profit)
                .slice(0, 5)
                .map(([id, st]) => {
                    const m = allMarketers.find(x => x.id === id);
                    return `<tr><td>${m?.name||'غير معروف'}</td><td>${st.count}</td><td>${st.sales.toLocaleString()} ج</td><td>${st.profit.toLocaleString()} ج</td></tr>`;
                }).join('');

            return `
            <div style="margin-bottom:12px;font-size:14px;color:var(--muted);">
              📄 عرض بيانات: <strong style="color:var(--text)">${pageName}</strong>
              ${currentUserPageId ? '' : ' (للمدير/المشرف عرض جميع الصفحات)'}
            </div>
            <div class="cards">
              <div class="card stat"><div class="stat-head"><span>إجمالي الطلبات</span><span class="stat-icon">📋</span></div><h2>${totalOrders}</h2><span class="change up">▲ ${totalOrders?12:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>إجمالي المبيعات</span><span class="stat-icon">💰</span></div><h2>${totalSales.toLocaleString()} ج</h2><span class="change up">▲ ${totalSales?8:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>إجمالي الأرباح</span><span class="stat-icon">📈</span></div><h2>${totalProfit.toLocaleString()} ج</h2><span class="change up">▲ ${totalProfit?10:0}%</span></div>
              <div class="card stat"><div class="stat-head"><span>تم التسليم</span><span class="stat-icon">✅</span></div><h2>${delivered}</h2><span class="change up">▲ ${totalOrders?Math.round((delivered/totalOrders)*100):0}%</span></div>
            </div>

            <div class="grid-2">
              <div class="card panel">
                <div class="panel-head"><div><h3>📈 المبيعات والطلبات</h3><span class="muted">آخر 7 أيام</span></div></div>
                <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
              </div>
              <div class="card panel">
                <div class="panel-head"><div><h3>📊 حالات الطلبات</h3><span class="muted">التوزيع الحالي</span></div></div>
                <div class="status-list">${statusRows || '<div class="text-muted">لا توجد طلبات</div>'}</div>
              </div>
            </div>

            <div class="card panel">
              <div class="panel-head"><div><h3>🏆 أفضل المسوقين</h3><span class="muted">حسب الأرباح</span></div></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>المسوق</th><th>عدد الطلبات</th><th>إجمالي المبيعات</th><th>الأرباح</th></tr></thead>
                  <tbody>${topMarketers || '<tr><td colspan="4" class="text-muted">لا توجد بيانات</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
        }

        // ================================================================
        // PAGES MANAGEMENT
        // ================================================================
       function renderPages() {
    if (currentUserRole !== 'admin') return '<div class="card panel"><div class="text-muted">غير مصرح لك. هذه الصفحة للمدير فقط.</div></div>';

    let html = allPages.map(p => {
        const marketers = allMarketers.filter(m => m.pageId === p.id);
        const csUsers = allUsers.filter(u => u.pageId === p.id && u.role === 'customer_service');
        const adminUsers = allUsers.filter(u => u.role === 'admin' && u.pageId === p.id);
        const orders = allOrders.filter(o => o.pageId === p.id);
        const totalProfit = orders.reduce((s, o) => s + (o.profit || 0), 0);
        const isMyPage = p.id === currentUserPageId;

        // دالة مساعدة لإنشاء بطاقة عضو مع زر حذف
        const memberCard = (user, roleLabel, bgColor) => `
            <div class="member-item" style="display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px;border-radius:8px;border-right:3px solid ${bgColor};">
                <span style="font-weight:600;">${user.name||user.email}</span>
                <span style="font-size:11px;color:var(--muted);">${roleLabel}</span>
                <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();removeUserFromPage('${user.id}','${p.id}')" style="margin-right:auto;">✕</button>
            </div>
        `;

        const membersList = `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
                ${adminUsers.map(u => memberCard(u, 'مدير', 'var(--danger)')).join('')}
                ${marketers.map(m => memberCard(m, 'مسوق', 'var(--success)')).join('')}
                ${csUsers.map(u => memberCard(u, 'خدمة عملاء', 'var(--info)')).join('')}
                ${(adminUsers.length+marketers.length+csUsers.length) === 0 ? '<span class="text-muted" style="font-size:12px;">لا يوجد أعضاء في هذه الصفحة</span>' : ''}
            </div>
        `;

        const addButtons = `
            <div class="flex gap-1" style="flex-wrap:wrap;margin-top:6px;">
                <button class="btn btn-sm btn-success" onclick="event.stopPropagation();showAddPageMember('${p.id}','marketer')">＋ 👤 مسوق</button>
                <button class="btn btn-sm" style="background:var(--info);color:#fff;" onclick="event.stopPropagation();showAddPageMember('${p.id}','customer_service')">＋ 🛎️ خدمة عملاء</button>
                <button class="btn btn-sm" style="background:var(--danger);color:#fff;" onclick="event.stopPropagation();showAddPageMember('${p.id}','admin')">＋ 👑 مدير</button>
            </div>
        `;

        // بناء HTML لقائمة الأعضاء (مخفية افتراضياً)
        const membersHtml = `
            <div class="page-members" id="members_${p.id}" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
                ${membersList}
                ${addButtons}
            </div>
        `;

        return `
        <div class="page-card" style="flex-direction:column;align-items:stretch;gap:8px;border:${isMyPage ? '2px solid var(--primary)' : '1px solid var(--line)'};cursor:pointer;" onclick="togglePageMembers('${p.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div class="page-info">
                <h4>📄 ${p.name} ${isMyPage ? '⭐ (صفحتي)' : ''}</h4>
                <small>تم الإنشاء: ${p.createdAt?.toDate?.()?.toLocaleDateString('ar-EG') || '—'}</small>
                <div class="page-stats">
                    <span>👑 مديرين: <strong>${adminUsers.length}</strong></span>
                    <span>👤 مسوقين: <strong>${marketers.length}</strong></span>
                    <span>🛎️ خدمة عملاء: <strong>${csUsers.length}</strong></span>
                    <span>📋 طلبات: <strong>${orders.length}</strong></span>
                    <span>💰 أرباح: <strong>${totalProfit.toLocaleString()} ج</strong></span>
                </div>
            </div>
            <div class="user-actions" onclick="event.stopPropagation();">
                ${!isMyPage ? `<button class="btn btn-sm btn-primary" onclick="setMyPage('${p.id}')">⭐ تعيين كصفحتي</button>` : `<button class="btn btn-sm" style="background:var(--success);color:#fff" disabled>⭐ صفحتي الحالية</button>`}
                <button class="btn btn-sm btn-primary" onclick="editPage('${p.id}')">✎ تعديل</button>
                <button class="btn btn-sm btn-danger" onclick="deletePage('${p.id}')">✕ حذف</button>
                <button class="btn btn-sm" style="background:var(--info);color:#fff" onclick="togglePageMembers('${p.id}')">👥 الأعضاء</button>
            </div>
          </div>
          ${membersHtml}
        </div>
        `;
    }).join('');

    return `
    <div class="card panel">
      <div class="panel-head"><div><h3>📄 إدارة الصفحات وفريق العمل</h3><span class="muted">اضغط على أي صفحة لعرض أعضائها وإدارتهم</span></div>
        <button class="btn btn-primary btn-sm" onclick="showAddPage()">＋ صفحة جديدة</button>
      </div>
      ${html || '<div class="text-muted" style="padding:20px;text-align:center">لا توجد صفحات. قم بإضافة صفحة جديدة.</div>'}
    </div>
  `;
}

// دالة لإزالة مستخدم من صفحة (تحديث pageId = null)
window.removeUserFromPage = async function(userId, pageId) {
    if (!confirm('هل أنت متأكد من إزالة هذا المستخدم من الصفحة؟')) return;
    try {
        await db.collection('users').doc(userId).update({ pageId: null });
        // إذا كان المستخدم مسوقاً، نحدث أيضاً في مجموعة marketers
        const marketer = allMarketers.find(m => m.id === userId);
        if (marketer) {
            await db.collection('marketers').doc(userId).update({ pageId: null });
        }
        toast('✅ تم إزالة المستخدم من الصفحة');
        renderCurrentPage();
    } catch (err) { toast('❌ ' + err.message, 'danger'); }
};

// دالة لعرض نموذج إضافة عضو جديد للصفحة مع تحديد الدور
window.showAddPageMember = function(pageId, role) {
    // نستخدم showAddUser مع preset يحوي pageId و role
    showAddUser({ pageId: pageId, role: role });
};

// دالة مساعدة لإظهار/إخفاء أعضاء الصفحة
window.togglePageMembers = function(pageId) {
    const el = document.getElementById('members_' + pageId);
    if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
};

window.showMyPageOrders = function(pageId) {
    const orders = allOrders.filter(o => o.pageId === pageId);
    if (!orders.length) { toast('لا توجد طلبات لهذه الصفحة', 'info'); return; }
    // فتح نافذة عرض الطلبات
    openModal('📋 طلبات صفحتي', `

window.saveUser = async function(e) {
    e.preventDefault();
    const name = $('uName').value.trim();
    const email = $('uEmail').value.trim();
    const password = $('uPassword').value;
    const role = $('uRole').value;
    const pageId = $('uPageId')?.value || '';

    if (!name || !email || !password) { toast('❌ الاسم والبريد وكلمة المرور مطلوبة', 'danger'); return false; }
    if (password.length < 6) { toast('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger'); return false; }

    if ((role === 'marketer' || role === 'customer_service') && !pageId) {
        toast('❌ يرجى اختيار الصفحة التابع لها هذا المستخدم', 'danger');
        return false;
    }

    // حفظ بيانات المستخدم الحالي (إن وجد) قبل إنشاء الحساب الجديد
    const currentUserEmail = currentUser?.email;
    const tempEmail = sessionStorage.getItem('tempEmail');
    const tempPassword = sessionStorage.getItem('tempPassword');
    const shouldReauth = currentUserEmail && tempEmail && tempPassword && currentUserEmail === tempEmail;

    try {
        // إنشاء الحساب الجديد (سيؤدي إلى تسجيل الدخول به)
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        // حفظ بيانات المستخدم الجديد في Firestore
        const userData = {
            name,
            email,
            role,
            pageId: (role === 'marketer' || role === 'customer_service') ? pageId : null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('users').doc(uid).set(userData);

        if (role === 'marketer') {
            await db.collection('marketers').doc(uid).set({
                userId: uid,
                name,
                email,
                pageId: pageId,
                totalProfit: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // إذا كان هناك مستخدم سابق وليس نفس الحساب، نعيد تسجيل الدخول بالحساب القديم
        if (shouldReauth && tempEmail && tempPassword) {
            await auth.signOut(); // تسجيل الخروج من الحساب الجديد
            await auth.signInWithEmailAndPassword(tempEmail, tempPassword); // العودة للحساب القديم
            toast(`✅ تم إنشاء حساب ${roleNames[role]||'مسوق'} بنجاح، وأنت الآن مسجل بحسابك الأساسي`);
        } else {
            // إذا لم يكن هناك مستخدم سابق (أول مرة) أو نفس الحساب، نبقى مسجلين بالحساب الجديد
            const roleNames = { admin: 'مدير', moderator: 'مشرف', marketer: 'مسوق', customer_service: 'خدمة عملاء' };
            toast(`✅ تم إنشاء حساب ${roleNames[role]||'مسوق'} بنجاح`);
        }

        closeModal();
        renderCurrentPage();
    } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
            toast('❌ هذا البريد الإلكتروني مستخدم بالفعل. يرجى استخدام بريد آخر.', 'danger');
        } else {
            toast('❌ ' + err.message, 'danger');
        }
        console.error('Save user error:', err);
    }
    return false;
};

window.saveCSUser = async function(e) {
    e.preventDefault();
    const name = $('csName').value.trim();
    const email = $('csEmail').value.trim();
    const password = $('csPassword').value;
    const phone = $('csPhone').value.trim() || '';
    const pageId = currentUserPageId;

    if (!name || !email || !password) { toast('❌ الاسم والبريد وكلمة المرور مطلوبة', 'danger'); return false; }
    if (password.length < 6) { toast('❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'danger'); return false; }
    if (!pageId) { toast('❌ أنت غير مخصص لأي صفحة', 'danger'); return false; }

    try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;
        await db.collection('users').doc(uid).set({
            name, email, phone, role: 'customer_service', pageId: pageId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('✅ تم إضافة حساب خدمة العملاء');
        closeModal();
        renderCurrentPage();
    } catch (err) {
        if (err.code === 'auth/email-already-in-use') {
            toast('❌ هذا البريد مستخدم بالفعل', 'danger');
        } else {
            toast('❌ ' + err.message, 'danger');
        }
    }
    return false;
};

        window.calcProductProfit = function() {
            const sell = parseFloat($('pSell')?.value) || 0;
            const cost = parseFloat($('pCost')?.value) || 0;
            const profit = sell - cost;
            const rate = sell ? (profit / sell) * 100 : 0;
            if ($('pProfit')) $('pProfit').value = profit.toFixed(2);
            if ($('pProfitRate')) $('pProfitRate').value = rate.toFixed(1);
        };

// ===== دالة تصدير الشحن (موجودة بالفعل ومعدلة) =====
window.exportShippingOrders = async function() {
    // 1. تحديد الطلبات المستهدفة: المحددة أولاً، ثم الظاهرة (المفلترة)
    const selected = getSelectedOrders();
    const visibleIds = [...document.querySelectorAll('#ordersTableBody tr:not([style*="display: none"]) .order-check')].map(cb => cb.dataset.id);
    const visibleOrders = allOrders.filter(o => visibleIds.includes(o.id));
    
    const ordersToExport = selected.length > 0 ? selected : visibleOrders;
    
    if (!ordersToExport.length) {
        toast('❌ لا توجد طلبات للتصدير', 'danger');
        return;
    }

    // 2. تحديد اسم الملف بناءً على المراحل الفريدة للطلبات المصدرة
    const stages = ordersToExport.map(o => getOrderStage(o));
    const uniqueStages = [...new Set(stages)];
    
    // خريطة لتسمية الملفات حسب التصنيف
   const stageNameMap = {
    'بحري': 'شحن بحري',
    'قبلي': 'شحن قبلي',
    'داخلي شحن': 'شحن داخلي'
};
    
    let fileName = 'شحن كل المحافظات';
    if (uniqueStages.length === 1 && uniqueStages[0] !== 'غير مصنف') {
        const stage = uniqueStages[0];
        fileName = stageNameMap[stage] || stage; // إذا لم يكن في الخريطة، استخدم الاسم الأصلي
    }

    // 3. التحقق من الطلبات غير الجديدة (لتحويل الحالة)
    const invalidOrders = ordersToExport.filter(o => o.status !== 'جديد');
    if (invalidOrders.length > 0) {
        const invalidCodes = invalidOrders.map(o => o.orderCode || '#'+o.id.slice(0,6)).join('، ');
        if (!confirm(`الطلبات التالية ليست بحالة "جديد": ${invalidCodes}\n\nهل تريد تحويلها إلى "جاري الشحن" مع باقي الطلبات؟`)) {
            return;
        }
    }
    
    if (!confirm(`تحويل ${ordersToExport.length} طلب إلى "جاري الشحن" وتصديرها كـ "${fileName}"؟`)) return;
    
    try {
        const batch = db.batch();
        ordersToExport.forEach(o => {
            batch.update(db.collection('orders').doc(o.id), {
                status: 'جاري الشحن',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });
        await batch.commit();
        
        ordersToExport.forEach(o => o.status = 'جاري الشحن');
        toast(`✅ تم تحويل ${ordersToExport.length} طلب إلى جاري الشحن`);
        
        exportOrdersToExcel(ordersToExport, fileName);
        renderCurrentPage();
    } catch (err) { 
        toast('❌ ' + err.message, 'danger'); 
    }
};

        // ================================================================
        // EXCEL (CSV) EXPORT
        // ================================================================
function exportOrdersToExcel(orders, filename) {
    if (!orders.length) { toast('❌ لا توجد طلبات لتصديرها', 'danger'); return; }
    const headers = ['رقم الطلب', 'اسم العميل', 'رقم الهاتف', 'المحافظة', 'المدينة', 'المرحلة', 'نوع الشحن', 'المنتجات', 'الإجمالي', 'سعر الشحن الأساسي', 'سعر الشحن الفعلي', 'فرق الشحن', 'الحالة', 'الربح', 'المسوق', 'الصفحة', 'ملاحظات'];
  

    const csvEscape = (val) => {
        let s = (val === null || val === undefined) ? '' : String(val);
        s = s.replace(/"/g, '""');
        return `"${s}"`;
    };
    const rows = orders.map(o => {
        const m = allMarketers.find(x => x.id === o.marketerId);
        const page = allPages.find(p => p.id === o.pageId);
        const products = (o.products || []).map(it => {
            const p = allProducts.find(pr => pr.id === it.productId);
            return `${p?.name || 'منتج'} × ${it.qty || 1}`;
        }).join(' / ');
        return [
    '#' + o.id.slice(0, 8),
    o.customerName || '',
    o.customerPhone || '',
    o.governorate || '',
    o.city || '',
    getOrderStage(o),
    o.shippingType || '',
    products,
    o.total || 0,
    o.baseShippingCost || 0,
    o.shippingCost || 0,
    o.shippingDiff || 0,
    o.status || 'جديد',
    o.profit || 0,
    m?.name || '',
    page?.name || '',
    o.notes || ''
].map(csvEscape).join(',');
    });
    const csvContent = '\uFEFF' + headers.map(csvEscape).join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename.endsWith('.csv') ? filename : filename + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    toast(`✅ تم تصدير ${orders.length} طلب إلى ملف Excel`);
}

window.updateShippingCostByGovernorate = function() {
    const govSelect = $('orderGovernorate');
    const citySelect = $('orderCity');
    const selectedGov = govSelect?.value;
    const selectedCity = citySelect?.value;
    const costInput = $('orderShippingCost');
    const stageDisplay = $('orderStageDisplay');
    if (!selectedGov || !costInput) return;

    let stage = 'داخلي شحن';
    for (const [s, govs] of Object.entries(GOVERNORATE_CLASSIFICATION)) {
        if (govs.includes(selectedGov)) {
            stage = s;
            break;
        }
    }

    // السعر من المدن أولاً، ثم المحافظات، ثم الإعداد العام
    let cost = customShippingCosts[selectedCity] || customShippingCosts[selectedGov] || allSettings.shippingCost || 30;
    costInput.value = cost;
    if (stageDisplay) stageDisplay.value = stage + (selectedCity ? ` - ${selectedCity}` : '');
};

window.submitOrder = async function(e) {
    e.preventDefault();
    const customer = $('orderCustomer')?.value.trim();
    const phone = $('orderPhone')?.value.trim() || '';
    const governorate = $('orderGovernorate')?.value;
    const city = $('orderCity')?.value || '';
    const address = $('orderAddress')?.value.trim() || '';
    const productId = $('orderProduct')?.value;
    const qty = parseInt($('orderQty')?.value) || 1;
    const statusType = $('orderStatusType')?.value || 'جديد';
    const marketerId = $('orderMarketer')?.value || currentUser.uid;
    const notes = $('orderNotes')?.value || '';

    const marketer = allMarketers.find(m => m.id === marketerId);
    const pageId = marketer?.pageId || currentUserPageId || null;

    if (!pageId) {
        toast('❌ المسوق غير مخصص لصفحة. يرجى تخصيص صفحة له أولاً.', 'danger');
        return false;
    }

    if (!customer || !governorate || !productId) {
        toast('❌ يرجى ملء جميع الحقول المطلوبة', 'danger');
        return false;
    }

    const product = allProducts.find(p => p.id === productId);
    if (!product) { toast('❌ المنتج غير موجود', 'danger'); return false; }

    // استخراج السعر الأساسي من المنتج
    const basePrice = product.basePrice || 0;

    // السعر الذي أدخله المسوق (قابل للكتابة)
    let sellPrice = parseFloat($('orderProductPrice')?.value) || 0;
    // إذا لم يدخل سعراً، نستخدم السعر الأساسي
    if (sellPrice === 0) sellPrice = basePrice;
    
    // حساب الإجمالي: نأخذ من حقل total إن وجد وإلا نحسبه
    let total = parseFloat($('orderTotal')?.value);
    if (isNaN(total) || total <= 0) {
        total = sellPrice * qty;
    }

    // حساب سعر الشحن الأساسي
    let baseShippingCost = customShippingCosts[city] || customShippingCosts[governorate] || allSettings.shippingCost || 30;
    let shippingCost = parseFloat($('orderShippingCost')?.value) || baseShippingCost;
    let shippingDiff = shippingCost - baseShippingCost;

    // ربح المنتج = (سعر البيع - سعر الأساسي) * الكمية
    let productProfit = (sellPrice - basePrice) * qty;
    // إجمالي الربح = ربح المنتج + فرق الشحن
    let totalProfit = productProfit + shippingDiff;

    // إنشاء كود الطلب
    const orderCode = await generateOrderCode(pageId, marketerId);

    const orderData = {
        orderCode: orderCode,
        customerName: customer,
        customerPhone: phone,
        governorate: governorate,
        city: city,
        address: address,
        shippingType: 'تلقائي',
        shippingCost: shippingCost,
        baseShippingCost: baseShippingCost,
        shippingDiff: shippingDiff,
        productId: productId,
        productName: product.name,
        qty: qty,
        basePrice: basePrice,
        sellPrice: sellPrice,
        total: total,
        statusType: statusType,
        status: 'جديد',
        marketerId: marketerId,
        pageId: pageId,
        notes: notes,
        profit: totalProfit,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
        await db.collection('orders').add(orderData);
        await db.collection('marketers').doc(marketerId).update({
            totalProfit: firebase.firestore.FieldValue.increment(totalProfit)
        });
        if (importState.active) {
            toast(`✅ تم إضافة الطلب (${importState.index + 1}/${importState.queue.length})`);
            importState.index++;
            renderImportStep();
        } else {
            toast('✅ تم إضافة الطلب بنجاح');
            closeModal();
            renderCurrentPage();
        }
    } catch (err) { toast('❌ خطأ: ' + err.message, 'danger'); }
    return false;
};

// IMPORT ORDERS FROM EXCEL/CSV — استيراد الطلبات من ملف إكسل مع مراجعة كل طلب
// ================================================================
let importState = { active: false, queue: [], index: 0, skipped: 0 };

const IMPORT_FIELD_ALIASES = {
    customerName: ['اسم العميل', 'العميل', 'اسم الزبون', 'الاسم', 'Customer', 'Name'],
    phone: ['رقم الهاتف', 'الهاتف', 'رقم العميل', 'التليفون', 'الموبايل', 'رقم الموبايل', 'Phone', 'Mobile'],
    governorate: ['المحافظة', 'محافظة', 'Governorate'],
    city: ['المدينة', 'مدينة', 'الحي', 'City'],
    address: ['العنوان', 'عنوان', 'Address'],
    product: ['المنتج', 'منتج', 'اسم المنتج', 'Product'],
    qty: ['الكمية', 'كمية', 'العدد', 'Qty', 'Quantity'],
    notes: ['ملاحظات', 'ملحوظات', 'Notes']
};

function findByAliases(rowObj, aliases) {
    const keys = Object.keys(rowObj);
    const normAliases = aliases.map(normalizeArabic);
    for (const k of keys) {
        if (normAliases.includes(normalizeArabic(k))) return rowObj[k];
    }
    for (const k of keys) {
        const nk = normalizeArabic(k);
        if (normAliases.some(a => nk.includes(a) || a.includes(nk))) return rowObj[k];
    }
    return '';
}

function matchProduct(rawName, pageId) {
    if (!rawName) return { match: null, confidence: 0 };
    const list = allProducts.filter(p => p.pageId === pageId);
    if (!list.length) return { match: null, confidence: 0 };
    const norm = normalizeArabic(rawName);
    for (const p of list) {
        if (normalizeArabic(p.name) === norm) return { match: p, confidence: 1 };
    }
    let best = null, bestDist = Infinity;
    for (const p of list) {
        const dist = levenshtein(normalizeArabic(p.name), norm);
        if (dist < bestDist) { bestDist = dist; best = p; }
    }
    const maxLen = Math.max(normalizeArabic(best?.name || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    return confidence >= 0.5 ? { match: best, confidence } : { match: null, confidence: 0 };
}

window.startOrderImport = function() {
    const fileInput = $('importFileInput');
    const file = fileInput?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }

    // تحديد المسوق الافتراضي
    let defaultMarketerId = (currentUserRole === 'marketer' || currentUserRole === 'customer_service')
        ? currentUser.uid
        : (allMarketers[0]?.id || '');

    // إذا كان المسوق ليس لديه صفحة، نطلب اختيار مسوق
    const marketer = allMarketers.find(m => m.id === defaultMarketerId);
    if (!marketer) {
        toast('❌ لا يوجد مسوق مخصص لهذه الصفحة', 'danger');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            if (!rows.length) { toast('❌ الملف فارغ أو لا يمكن قراءته', 'danger'); return; }

            const pageId = marketer.pageId || currentUserPageId || null;
            if (!pageId) {
                toast('❌ المسوق أو المستخدم الحالي غير مخصص لصفحة', 'danger');
                return;
            }

            const queue = rows.map(r => {
                const customerName = String(findByAliases(r, IMPORT_FIELD_ALIASES.customerName) || '').trim();
                const phoneRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.phone) || '').trim();
                const govRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.governorate) || '').trim();
                const cityRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.city) || '').trim();
                const address = String(findByAliases(r, IMPORT_FIELD_ALIASES.address) || '').trim();
                const productRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.product) || '').trim();
                const qtyRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.qty) || '1').trim();
                const notes = String(findByAliases(r, IMPORT_FIELD_ALIASES.notes) || '').trim();

                const govResult = matchGovernorate(govRaw);
                const cityResult = govResult.match ? matchCity(cityRaw, govResult.match) : { match: null, confidence: 0 };
                const productResult = pageId ? matchProduct(productRaw, pageId) : { match: null, confidence: 0 };
                const phone = normalizeEgyptianPhone(phoneRaw);

                return {
                    customerName, phoneRaw, phone,
                    phoneValid: isValidEgyptianPhone(phoneRaw),
                    govRaw, governorate: govResult.match, govConfidence: govResult.confidence,
                    cityRaw, city: cityResult.match, cityConfidence: cityResult.confidence,
                    address,
                    productRaw, productId: productResult.match?.id || '', productConfidence: productResult.confidence,
                    qty: parseInt(qtyRaw) || 1,
                    notes
                };
                }).filter(r => r.customerName || r.phoneRaw);

            if (!queue.length) { toast('❌ لم يتم العثور على أي طلبات صالحة في الملف', 'danger'); return; }

            importState = { active: true, queue, index: 0, skipped: 0, defaultMarketerId };
            renderImportStep();
        } catch (err) {
            toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger');
        }
    };
    reader.readAsArrayBuffer(file);
};

function renderImportStep() {
    const { queue, index } = importState;
    if (index >= queue.length) {
        const doneCount = index - importState.skipped;
        toast(`✅ انتهى الاستيراد — تم إضافة ${doneCount} طلب وتخطي ${importState.skipped}`);
        importState = { active: false, queue: [], index: 0, skipped: 0 };
        closeModal();
        renderCurrentPage();
        return;
    }
    const row = queue[index];
    const total = queue.length;

    let alerts = '';
    if (!row.phoneValid) {
        alerts += `<div style="background:#fff4e5;border:1px solid var(--warning);color:#8a5a00;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;">⚠️ رقم الهاتف "<strong>${row.phoneRaw || '—'}</strong>" لا يبدو رقماً مصرياً صحيحاً. راجعه أو عدّله ثم أكّد.</div>`;
    }
    if (row.govRaw && (!row.governorate || row.govConfidence < 0.85)) {
        alerts += `<div style="background:#fff4e5;border:1px solid var(--warning);color:#8a5a00;padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;">⚠️ المحافظة "<strong>${row.govRaw}</strong>" ${row.governorate ? `تم مطابقتها تلقائياً بـ "<strong>${row.governorate}</strong>" — راجعها` : 'لم يتم التعرف عليها، برجاء اختيارها يدوياً'}.</div>`;
    }
    if (row.productRaw && !row.productId) {

        // ================================================================
        // SALES MANAGEMENT (إدارة المبيعات)
        // ================================================================
        // Delivered orders => realized profit (gain)
        // Cancelled / returned orders => shipping cost is a loss (dispatched but not delivered)
        const LOST_STATUSES = ['ملغي', 'مرتجع'];

function computeSalesForOrders(orders) {
    // نأخذ في الاعتبار آخر حالة معروفة للطلب (قد تتغير)
    // نعتبر أن الطلب "تم التسليم" إذا كانت الحالة الحالية "تم التسليم"
    // وأيضاً نأخذ في الاعتبار الطلبات التي كانت مسلمة ثم تغيرت حالتها إلى ملغي/مرتجع
    // نستخدم سجل التغييرات إن وجد، أو نعتمد على الحالة الحالية مع خصم الإيرادات السابقة

    // هنا نبسط: نعتمد على الحالة الحالية فقط، ولكن مع خاصية أن الطلبات الملغية/المرتجعة لا تحسب كأرباح
    const delivered = orders.filter(o => o.status === 'تم التسليم');
    const lost = orders.filter(o => ['ملغي', 'مرتجع'].includes(o.status));
    const pending = orders.filter(o => !['تم التسليم', 'ملغي', 'مرتجع'].includes(o.status));

    // الأرباح من الطلبات المسلمة حالياً
    const gain = delivered.reduce((s, o) => s + (o.profit || 0), 0);
    // الخسائر من الطلبات الملغية/المرتجعة (تحتسب تكلفة الشحن الأساسية)
    const loss = lost.reduce((s, o) => s + (o.baseShippingCost || o.shippingCost || 0), 0);

    return {
        deliveredCount: delivered.length,
        lostCount: lost.length,
        pendingCount: pending.length,
        totalCount: orders.length,
        gain, loss,
        net: gain - loss
    };
}

// دالة للحصول على الطلبات المحددة داخل مرحلة معينة
function getSelectedShippingOrders(stageId) {
    const ids = [...document.querySelectorAll(`.ship-check[data-stage="${stageId}"]:checked`)].map(cb => cb.dataset.id);
    return allOrders.filter(o => ids.includes(o.id));
}

// ================================================================
// تحديد/إلغاء تحديد جميع الطلبات في مرحلة معينة عبر checkbox الرأس
// ================================================================
window.toggleAllShippingInStage = function(stageId, checked) {
    const checks = document.querySelectorAll(`.ship-check[data-stage="${stageId}"]`);
    checks.forEach(cb => cb.checked = checked);
    
    // تطبيق التمييز على جميع الصفوف في هذه المرحلة
    document.querySelectorAll(`.shipping-table-body tr[data-order-id]`).forEach(row => {
        const orderId = row.dataset.orderId;
        const cb = document.querySelector(`.ship-check[data-id="${orderId}"]`);
        if (cb) {
            if (cb.checked) {
                row.classList.add('selected-row');
            } else {
                row.classList.remove('selected-row');
            }
        }
    });
    
    updateShippingSelectedCount(stageId);
};

// ================================================================
// تحديث عدد المحددين وإظهار شريط الإجراءات (نسخة محسنة)
// ================================================================
function updateShippingSelectedCount(stageId) {
    setTimeout(() => {
        const checks = document.querySelectorAll(`.ship-check[data-stage="${stageId}"]:checked`);
        const count = checks.length;
        const countEl = document.getElementById(`shippingSelectedCount_${stageId}`);
        const wrapEl = document.getElementById(`shippingBulkActionsWrap_${stageId}`);
        if (countEl) countEl.textContent = `${count} طلب محدد`;
        if (wrapEl) wrapEl.style.display = count > 0 ? 'block' : 'none';
    }, 50);
}

window.toggleStageChecks = function(stageId, checked) {
    const id = String(stageId);

function getOrderStage(order) {
    const governorate = order.governorate || '';
    for (const [stage, govs] of Object.entries(GOVERNORATE_CLASSIFICATION)) {
        if (govs.includes(governorate)) return stage;
    }
    return 'داخلي شحن'; // القيمة الافتراضية
}
