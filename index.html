// ================================================================
function getStageBadge(stage) {
    const map = {
        'بحري': 'badge-info',
        'قبلي': 'badge-warning',
        'داخلي شحن': 'badge-success'
    };
    return map[stage] || 'badge-secondary';
}

        // ================================================================
        // IMPORT: الطلبات المستلمة / المرتجعة أو المرفوضة (من شركة الشحن)
        // ================================================================
        function findOrderForShippingRow(r) {
            const codeRaw = String(findByAliases(r, ['رقم الطلب', 'كود الطلب', 'Order Code', 'Order ID', 'Code']) || '').trim().replace(/^#/, '');
            const phoneRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.phone) || '').trim();
            if (codeRaw) {
                const byCode = allOrders.find(o => (o.orderCode && o.orderCode.replace(/^#/, '') === codeRaw) || o.id.startsWith(codeRaw) || o.id === codeRaw);
                if (byCode) return byCode;
            }
            if (phoneRaw) {
                const normPhone = normalizeEgyptianPhone(phoneRaw);
                const byPhone = allOrders.find(o => normalizeEgyptianPhone(o.customerPhone || '') === normPhone && normPhone);
                if (byPhone) return byPhone;
            }
            return null;
        }

        window.showImportDelivered = function() {
            openModal('📥 استيراد الطلبات المستلمة', `

                ارفع ملف الطلبات المستلمة من شركة الشحن (يحتوي على رقم الطلب أو رقم الهاتف). سيتم تحويل حالة كل طلب مطابق تلقائياً إلى "تم التسليم".
              </div>
              <div class="form-group"><label>ملف الطلبات المستلمة *</label><input type="file" id="deliveredFileInput" accept=".xlsx,.xls,.csv" /></div>
              <div class="form-actions">
                <button type="button" class="btn btn-primary" onclick="processDeliveredImport()">▶ استيراد وتحديث الحالة</button>
                <button type="button" class="btn" onclick="closeModal()">إلغاء</button>
              </div>
            `);

window.processDeliveredImport = function() {
    const file = $('deliveredFileInput')?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }
    const reader = new FileReader();
    reader.onload = async function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            let matched = 0, unmatched = 0;
            const batch = db.batch();
            rows.forEach(r => {
                const order = findOrderForShippingRow(r);
                if (order) {
                    matched++;
                    batch.update(db.collection('orders').doc(order.id), {
                        status: 'تسليم',  // تغيير من "تم التسليم" إلى "تسليم"
                        deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else { unmatched++; }
            });
            await batch.commit();
            toast(`✅ تم تحديث ${matched} طلب إلى "تسليم"${unmatched ? ` — تعذّر إيجاد ${unmatched} طلب` : ''}`);
            closeModal();
            renderCurrentPage();
        } catch (err) { toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger'); }
    };
    reader.readAsArrayBuffer(file);
};

// نعدل دالة processReturnedImport لاستخدام "مرتجع" (بدلاً من "مرفوض")
window.processReturnedImport = function() {
    const file = $('returnedFileInput')?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }
    const reader = new FileReader();
    reader.onload = async function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            let matched = 0, unmatched = 0;
            const batch = db.batch();
            rows.forEach(r => {
                const order = findOrderForShippingRow(r);
                if (!order) { unmatched++; return; }
                matched++;
                const statusRaw = String(findByAliases(r, ['الحالة', 'النتيجة', 'Status']) || '').trim();
                const newStatus = statusRaw.includes('رفض') ? 'مرتجع' : 'مرتجع'; // دائماً مرتجع
                const valueRaw = findByAliases(r, ['القيمة الجديدة', 'القيمة', 'السعر الجديد', 'قيمة المرتجع', 'Value', 'Amount']);
                const updateData = { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                if (valueRaw !== '' && valueRaw !== undefined && !isNaN(parseFloat(valueRaw))) {
                    updateData.total = parseFloat(valueRaw);
                }
                batch.update(db.collection('orders').doc(order.id), updateData);
            });
            await batch.commit();
            toast(`✅ تم تحديث ${matched} طلب إلى "مرتجع"${unmatched ? ` — تعذّر إيجاد ${unmatched} طلب` : ''}`);
            closeModal();
            renderCurrentPage();
        } catch (err) { toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger'); }
    };
    reader.readAsArrayBuffer(file);
};

window.updateGovernorate = async function(oldName, e) {
    e.preventDefault();
    const newName = $('govName').value.trim();
    const classification = $('govClassification').value;
    const cities = $('govCities').value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
    if (!newName) { toast('❌ اسم المحافظة مطلوب', 'danger'); return false; }
    if (oldName !== newName) {
        if (GOVERNORATE_CITIES[newName]) { toast('❌ المحافظة موجودة بالفعل', 'danger'); return false; }
        GOVERNORATE_CITIES[newName] = cities;
        delete GOVERNORATE_CITIES[oldName];
        for (const s of Object.keys(GOVERNORATE_CLASSIFICATION)) {
            const idx = GOVERNORATE_CLASSIFICATION[s].indexOf(oldName);
            if (idx !== -1) {
                GOVERNORATE_CLASSIFICATION[s].splice(idx, 1);
                if (!GOVERNORATE_CLASSIFICATION[classification].includes(newName)) {
                    GOVERNORATE_CLASSIFICATION[classification].push(newName);
                }
                break;
            }
        }
    } else {
        GOVERNORATE_CITIES[oldName] = cities;
    }
    try {
        await db.collection('settings').doc('general').set({
            governorateCities: GOVERNORATE_CITIES,
            governorateClassification: GOVERNORATE_CLASSIFICATION
        }, { merge: true });
        toast('✅ تم التحديث');
        closeModal();
        renderCurrentPage();
    } catch (err) { toast('❌ ' + err.message, 'danger'); }
    return false;
};

window.deleteGovernorate = async function(gov) {
    if (!confirm(`هل أنت متأكد من حذف محافظة "${gov}" وجميع مدنها؟`)) return;
    delete GOVERNORATE_CITIES[gov];
    for (const s of Object.keys(GOVERNORATE_CLASSIFICATION)) {
        const idx = GOVERNORATE_CLASSIFICATION[s].indexOf(gov);
        if (idx !== -1) GOVERNORATE_CLASSIFICATION[s].splice(idx, 1);
    }
    try {
        await db.collection('settings').doc('general').set({
            governorateCities: GOVERNORATE_CITIES,
            governorateClassification: GOVERNORATE_CLASSIFICATION
        }, { merge: true });

};

window.saveShippingPrices = async function(e) {
    e.preventDefault();
    const baseCost = parseFloat(document.getElementById('baseCost')?.value);
    const newPrices = {};

    document.querySelectorAll('.gov-price').forEach(input => {
        const key = input.dataset.key;
        const val = parseFloat(input.value);
        if (val && !isNaN(val)) newPrices[key] = val;
    });

    document.querySelectorAll('#cityPricesContainer .city-name').forEach(input => {
        const city = input.value.trim();
        const parent = input.closest('.flex');
        const priceInput = parent?.querySelector('.city-price');
        const val = parseFloat(priceInput?.value);
        if (city && val && !isNaN(val)) {
            newPrices[city] = val;
        }
    });

    customShippingCosts = newPrices;
    if (baseCost && !isNaN(baseCost)) {
        allSettings.shippingCost = baseCost;
        await db.collection('settings').doc('general').set({ shippingCost: baseCost }, { merge: true });
    }
    await db.collection('settings').doc('general').set({ customShippingCosts: customShippingCosts }, { merge: true });
    toast('✅ تم حفظ أسعار الشحن');
    closeModal();
    renderCurrentPage();
};

window.filterOrders = function() {

    const stage = document.getElementById('filterStage')?.value || '';
    const governorate = document.getElementById('filterRegion')?.value || '';

    const rows = document.querySelectorAll('#ordersTableBody tr');

        if (governorate && govCell !== governorate) show = false;

// ================================================================
// حساب عدد المحددات في جدول معين
// ================================================================
function getTotalSelectedCount(tableType) {
    if (tableType === 'shipping') {
        return document.querySelectorAll('.ship-check:checked').length;
    } else if (tableType === 'orders') {
        return document.querySelectorAll('#ordersTableBody .order-check:checked').length;
    }
    return 0;
}

// ================================================================
// تبديل تحديد طلب عند النقر على الصف (مع دعم الضغط المطول)
// ================================================================
window.toggleOrderSelection = function(orderId, stageId, tableType, isLongPress) {
    // الحصول على الـ checkbox المناسب
    let checkbox;
    if (tableType === 'shipping') {
        checkbox = document.querySelector(`.ship-check[data-id="${orderId}"]`);
    } else {
        checkbox = document.querySelector(`.order-check[data-id="${orderId}"]`);
    }
    if (!checkbox) return;

    // حساب عدد المحددات الحالي
    const totalSelected = getTotalSelectedCount(tableType);

    // إذا كان عدد المحددات = 0 ولم تكن ضغطة مطولة، نمنع التحديد
    if (totalSelected === 0 && !isLongPress) {
        toast('⚠️ استخدم الضغط المطول أو مربع الاختيار لتحديد الطلب الأول', 'info');
        return;
    }

    // تبديل حالة الـ checkbox
    checkbox.checked = !checkbox.checked;

    // تحديث التمييز والعداد
    if (tableType === 'shipping') {
        applyRowHighlight(orderId, checkbox.checked, 'ship');
        updateShippingSelectedCount(stageId);
    } else {
        applyRowHighlight(orderId, checkbox.checked, 'order');
        updateSelectedCount();
    }
};

// ================================================================
// تطبيق تمييز الصف بناءً على حالة الـ checkbox
// ================================================================
function applyRowHighlight(orderId, isChecked, type = 'ship') {
    let row;
    if (type === 'ship') {
        row = document.querySelector(`.shipping-table-body tr[data-order-id="${orderId}"]`);
    } else {
        row = document.querySelector(`#ordersTableBody tr[data-order-id="${orderId}"]`);
    }
    if (row) {
        if (isChecked) {
            row.classList.add('selected-row');
        } else {
            row.classList.remove('selected-row');
        }
    }
}

// ================================================================
// تحديث تمييز جميع الصفوف المحددة (لإدارة الشحن)
// ================================================================
function updateShippingSelectedCount(stageId) {
    setTimeout(() => {
        const checks = document.querySelectorAll(`.ship-check[data-stage="${stageId}"]:checked`);
        const count = checks.length;
        
        // تحديث التمييز لجميع الصفوف في هذه المرحلة
        const allRows = document.querySelectorAll(`.shipping-table-body tr[data-order-id]`);
        allRows.forEach(row => {
            const orderId = row.dataset.orderId;
            const cb = document.querySelector(`.ship-check[data-id="${orderId}"]`);
            if (cb) {
                if (cb.checked) {
                    row.classList.add('selected-row');
                } else {
                    row.classList.remove('selected-row');
                }
            }
        });
        
        const countEl = document.getElementById(`shippingSelectedCount_${stageId}`);
        const wrapEl = document.getElementById(`shippingBulkActionsWrap_${stageId}`);
        if (countEl) countEl.textContent = `${count} طلب محدد`;
        if (wrapEl) wrapEl.style.display = count > 0 ? 'block' : 'none';
    }, 50);
}

// ================================================================
// تحديث تمييز جميع الصفوف المحددة (لإدارة الطلبات)
// ================================================================
function updateSelectedCount() {
    const visibleChecks = document.querySelectorAll('#ordersTableBody tr:not([style*="display: none"]) .order-check:checked');
    const visibleCount = visibleChecks.length;
    
    // تحديث التمييز لجميع الصفوف
    document.querySelectorAll('#ordersTableBody tr[data-order-id]').forEach(row => {
        const orderId = row.dataset.orderId;
        const cb = document.querySelector(`.order-check[data-id="${orderId}"]`);
        if (cb) {
            if (cb.checked) {
                row.classList.add('selected-row');
            } else {
                row.classList.remove('selected-row');
            }
        }
    });
    
    const el = document.getElementById('selectedCountOrders');
    const wrap = document.getElementById('bulkActionsWrap');
    if (el) el.textContent = `${visibleCount} طلب محدد`;
    if (wrap) wrap.style.display = visibleCount > 0 ? 'block' : 'none';
}

// ================================================================
// ربط أحداث الضغط المطول على صفوف الجدول (نسخة محسنة)
// ================================================================
function attachRowClickEvents(tableType) {
    let rows;
    if (tableType === 'shipping') {
        rows = document.querySelectorAll('.shipping-table-body tr[data-order-id]');
    } else if (tableType === 'orders') {
        rows = document.querySelectorAll('#ordersTableBody tr[data-order-id]');
    } else return;

    rows.forEach(row => {
        // تجنب إضافة مستمعات مكررة
        if (row.dataset.listener === 'attached') return;
        row.dataset.listener = 'attached';

        let longPressTimer = null;
        let isLongPressTriggered = false;
        const orderId = row.dataset.orderId;
        const stageId = row.dataset.stage || '';

        // بدء الضغط (يبدأ المؤقت)
        const startPress = (e) => {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'BUTTON' || target.closest('button') || target.closest('a')) {
                return;
            }
            isLongPressTriggered = false;
            // ضبط مؤقت للضغط المطول (500 مللي)
            longPressTimer = setTimeout(() => {
                isLongPressTriggered = true;
                // يتم التحديد فوراً دون انتظار رفع الضغط
                toggleOrderSelection(orderId, stageId, tableType, true);
            }, 500);
        };

        // إنهاء الضغط (بالرفع أو المغادرة)
        const endPress = (e) => {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'BUTTON' || target.closest('button') || target.closest('a')) {
                return;
            }
            clearTimeout(longPressTimer);
            // إذا تم التحديد المطول بالفعل، لا نفعل شيئاً
            if (isLongPressTriggered) return;
            // ضغطة عادية (قصيرة) - نمرر isLongPress = false
            toggleOrderSelection(orderId, stageId, tableType, false);
        };

        // إلغاء الضغط (عند خروج الماوس أو إلغاء اللمس)
        const cancelPress = () => {
            clearTimeout(longPressTimer);
            isLongPressTriggered = false;
        };

        // أحداث الماوس
        row.addEventListener('mousedown', startPress);
        row.addEventListener('mouseup', endPress);
        row.addEventListener('mouseleave', cancelPress);

        // أحداث اللمس (للأجهزة المحمولة)
        row.addEventListener('touchstart', startPress, { passive: true });
        row.addEventListener('touchend', endPress, { passive: true });
        row.addEventListener('touchcancel', cancelPress, { passive: true });
    });
}
