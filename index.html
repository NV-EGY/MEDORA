function filterOrders() {
    const searchVal = document.getElementById('ordersSearchInput')?.value?.trim()?.toLowerCase() || '';
    const pageId = document.getElementById('filterPage')?.value?.trim() || '';
    const stage = document.getElementById('filterStage')?.value?.trim() || '';
    const governorate = document.getElementById('filterRegion')?.value?.trim() || '';

    sessionStorage.setItem('orders_search_value', searchVal);

    // الجدول الرئيسي
    const wrap = document.getElementById('ordersTableWrap');
    if (wrap) {
        wrap.querySelectorAll('.day-section').forEach(section => {
            const rows = section.querySelectorAll('tbody tr');
            let visibleCount = 0;
            const day = section.dataset.day;

            rows.forEach(row => {
                const text = row.textContent?.toLowerCase() || '';
                const rowPageId = String(row.dataset.pageId || '').trim();
                const rowStage = row.dataset.stage || '';
                const cells = row.querySelectorAll('td');
                const govCell = cells[7]?.textContent?.trim() || '';

                let show = true;
                if (searchVal && !text.includes(searchVal)) show = false;
                if (pageId && rowPageId !== pageId) show = false;
                if (stage && rowStage !== stage) show = false;
                if (governorate && govCell !== governorate) show = false;

                row.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });

            if (day) {
                const countBadge = document.getElementById('dayCount_' + day);
                if (countBadge) {
                    countBadge.textContent = visibleCount === 0 ? 'لا توجد طلبات' : visibleCount + ' طلب';
                }
                // تحديث فتح/غلق اليوم حسب storage (نحتفظ بالحالة)
                const body = document.getElementById('dayBody_' + day);
                const arrow = document.getElementById('arrow_' + day);
                const STORAGE_KEY = 'medora_order_days_state';
                let stored = {};
                try {
                    const raw = sessionStorage.getItem(STORAGE_KEY);
                    if (raw) stored = JSON.parse(raw);
                } catch (e) {}
                const isOpen = stored[day] || false;
                if (body) body.style.display = isOpen ? 'block' : 'none';
                if (arrow) arrow.textContent = isOpen ? '▾' : '▸';
            }
        });
    }

    // قسم طلباتي
    const myWrap = document.getElementById('myOrdersWrap');
    if (myWrap) {
        myWrap.querySelectorAll('.day-section').forEach(section => {
            const rows = section.querySelectorAll('tbody tr');
            let visibleCount = 0;
            const day = section.dataset.day;
            rows.forEach(row => {
                const text = row.textContent?.toLowerCase() || '';
                const cells = row.querySelectorAll('td');
                const govCell = cells[4]?.textContent?.trim() || '';
                const rowStage = row.dataset.stage || '';
                const rowPageId = String(row.dataset.pageId || '').trim();

                let show = true;
                if (searchVal && !text.includes(searchVal)) show = false;
                if (pageId && rowPageId !== pageId) show = false;
                if (stage && rowStage !== stage) show = false;
                if (governorate && govCell !== governorate) show = false;

                row.style.display = show ? '' : 'none';
                if (show) visibleCount++;
            });
            if (day) {
                const countBadge = document.getElementById('myDayCount_' + day);
                if (countBadge) countBadge.textContent = visibleCount === 0 ? 'لا توجد طلبات' : visibleCount + ' طلب';
                const body = document.getElementById('myOrdersDayBody_' + day);
                const arrow = document.getElementById('myOrdersArrow_' + day);
                const MY_STORAGE_KEY = 'medora_myorders_days_state';
                let stored = {};
                try {
                    const raw = sessionStorage.getItem(MY_STORAGE_KEY);
                    if (raw) stored = JSON.parse(raw);
                } catch (e) {}
                const isOpen = stored[day] || false;
                if (body) body.style.display = isOpen ? 'block' : 'none';
                if (arrow) arrow.textContent = isOpen ? '▾' : '▸';
            }
        });
        // تحديث العدد الإجمالي
        const visibleRows = myWrap.querySelectorAll('tbody tr:not([style*="display: none"])');
        const totalEl = document.getElementById('myOrdersTotalCount');
        if (totalEl) totalEl.textContent = visibleRows.length + ' طلب';
    }

    // إلغاء تحديد الكل
    const master = document.getElementById('selectAllOrders');
    if (master) master.checked = false;
    document.querySelectorAll('.day-body tr .order-check').forEach(cb => cb.checked = false);
    updateSelectedCount();
    
    // ✅ إضافة هذا السطر لتحديث حالة التحديد بعد التصفية
    updateHasAnySelection();
}

function updateDayCounts() {
    // تحديث الجدول الرئيسي
    document.querySelectorAll('#ordersTableWrap .day-section').forEach(section => {
        const day = section.dataset.day;
        if (!day) return;
        const visibleRows = section.querySelectorAll('tbody tr:not([style*="display: none"])');
        const countBadge = document.getElementById('dayCount_' + day);
        if (countBadge) {
            const count = visibleRows.length;
            countBadge.textContent = count === 0 ? 'لا توجد طلبات' : count + ' طلب';
            countBadge.style.background = count === 0 ? 'var(--muted)' : '';
            countBadge.style.color = count === 0 ? 'var(--text)' : '';
        }
    });

    // تحديث قسم "طلباتي"
    const myOrdersWrap = document.getElementById('myOrdersWrap');
    if (myOrdersWrap) {
        myOrdersWrap.querySelectorAll('.day-section').forEach(section => {
            const day = section.dataset.day;
            if (!day) return;
            const visibleRows = section.querySelectorAll('tbody tr:not([style*="display: none"])');
            const countBadge = document.getElementById('myDayCount_' + day);
            if (countBadge) {
                const count = visibleRows.length;
                countBadge.textContent = count === 0 ? 'لا توجد طلبات' : count + ' طلب';
                countBadge.style.background = count === 0 ? 'var(--muted)' : '';
                countBadge.style.color = count === 0 ? 'var(--text)' : '';
            }
        });

        const totalEl = document.getElementById('myOrdersTotalCount');
        if (totalEl) {
            const visibleRows = myOrdersWrap.querySelectorAll('tbody tr:not([style*="display: none"])');
            totalEl.textContent = visibleRows.length + ' طلب';
        }
    }
}

function updateSelectedCount() {
    const wrap = document.getElementById('ordersTableWrap');
    if (!wrap) return;
    const visibleChecks = wrap.querySelectorAll('tbody tr:not([style*="display: none"]) .order-check:checked');
    const visibleCount = visibleChecks.length;

    const el = document.getElementById('selectedCountOrders');
    const wrapActions = document.getElementById('bulkActionsWrap');
    if (el) el.textContent = `${visibleCount} طلب محدد`;
    if (wrapActions) {
        wrapActions.style.display = visibleCount > 0 ? 'block' : 'none';
    }
    updateHasAnySelection();  // ← هذا السطر الجديد
}

// LOAD DATA - مع استدعاء الحذف النهائي في المكان الصحيح
// ================================================================
async function loadAllData() {
    try {
        console.log('🔄 جاري تحميل البيانات... (من الكاش أولاً)');

        // محاولة تحميل البيانات من الخادم مع إعادة محاولة تلقائية
        const fetchWithRetry = async (ref, retries = 3) => {
            for (let i = 0; i < retries; i++) {
                try {
                    return await ref.get();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    console.warn(`⚠️ محاولة ${i+1} فشلت، إعادة المحاولة...`);
                    await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                }
            }
        };

        // تحميل جميع المجموعات بالتوازي (مع إعادة محاولة في حال الفشل)
        const [settingsSnap, marketersSnap, productsSnap, ordersSnap, usersSnap, pagesSnap, settleSnap] = await Promise.all([
            fetchWithRetry(db.collection('settings').doc('general')).catch(() => null),
            fetchWithRetry(db.collection('marketers')).catch(() => null),
            fetchWithRetry(db.collection('products')).catch(() => null),
            fetchWithRetry(db.collection('orders')).catch(() => null),
            fetchWithRetry(db.collection('users')).catch(() => null),
            fetchWithRetry(db.collection('pages')).catch(() => null),
            fetchWithRetry(db.collection('settlements')).catch(() => null)
        ]);

        // تحديث المتغيرات العامة (مع الحفاظ على البيانات السابقة إذا فشل تحميل بعضها)
        if (settingsSnap && settingsSnap.exists) {
            allSettings = settingsSnap.data();
            if (settingsSnap.data().governorateCities) {
                Object.assign(GOVERNORATE_CITIES, settingsSnap.data().governorateCities);
            }
            if (settingsSnap.data().governorateClassification) {
                Object.assign(GOVERNORATE_CLASSIFICATION, settingsSnap.data().governorateClassification);
            }
            if (settingsSnap.data().customShippingCosts) {
                customShippingCosts = settingsSnap.data().customShippingCosts;
            }
        }

        if (marketersSnap) allMarketers = marketersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (productsSnap) allProducts = productsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (ordersSnap) allOrders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (usersSnap) allUsers = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (pagesSnap) allPages = pagesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (settleSnap) allSettlements = settleSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        // التأكد من وجود بيانات على الأقل (حتى لو كانت من الكاش)
        if (allOrders.length === 0 && allPages.length === 0) {
            // لا توجد بيانات، نعرض رسالة
            document.getElementById('pageContent').innerHTML = `
                <div class="card panel" style="text-align:center;padding:40px;">
                    <h3>⏳ جاري تحميل البيانات...</h3>
                    <p class="text-muted">قد يستغرق بعض الوقت في أول تشغيل</p>
                    <button class="btn btn-primary" onclick="refreshData()">🔄 إعادة المحاولة</button>
                </div>
            `;
        }

        isDataLoaded = true;
        renderCurrentPage();
        console.log(`✅ تم تحميل البيانات: ${allOrders.length} طلب، ${allPages.length} صفحة`);
        toast('✅ تم تحديث البيانات', 'success');
    } catch (err) {
        console.warn('⚠️ خطأ في تحميل البيانات (قد تكون البيانات من الكاش):', err);
        // إذا كانت البيانات موجودة مسبقاً (من جلسة سابقة) نعرضها
        if (allOrders.length || allPages.length) {
            isDataLoaded = true;
            renderCurrentPage();
            toast('⚠️ تم عرض البيانات المخزنة محلياً، جاري محاولة التحديث...', 'warning');
        } else {
            // لا توجد بيانات، نعرض رسالة خطأ
            document.getElementById('pageContent').innerHTML = `
                <div class="card panel" style="text-align:center;padding:40px;">
                    <h3>⚠️ تعذر تحميل البيانات</h3>
                    <p class="text-muted">يرجى التحقق من اتصالك بالإنترنت وإعادة تحميل الصفحة.</p>
                    <button class="btn btn-primary" onclick="refreshData()">🔄 إعادة المحاولة</button>
                </div>
            `;
        }
    }
}

        const ctx = chartCanvas.getContext('2d');
        window._dashChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],

                    borderColor: '#5b5ce2',
                    backgroundColor: 'rgba(91,92,226,0.1)',

                    fill: true
                }, {
                    label: 'الطلبات',
                    data: [120, 145, 132, 178, 165, 205, 192],
                    borderColor: '#16a56b',
                    backgroundColor: 'rgba(22,165,107,0.05)',
                    borderWidth: 2,

            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, font: { family: 'Tahoma' } } }
                },
                scales: {
                    y: { grid: { color: '#edf0f5' }, ticks: { font: { family: 'Tahoma' } } },
                    x: { grid: { display: false }, ticks: { font: { family: 'Tahoma' } } }
                }
            }
        });
    }

    ['filterRegion', 'filterShipping', 'filterStatus', 'filterPage'].forEach(id => {
        const el = $(id);
        if (el) el.onchange = window.filterOrders;
    });

    // ربط أحداث الضغط المطول على الصفوف
    setTimeout(() => {
        attachRowClickEvents('orders');
        attachRowClickEvents('shipping');

    // ربط أحداث المنتجات في أي نموذج

                if (row) updateProductRow(parseInt(row.dataset.index));

    // ===== ربط أحداث الـ checkboxes بعد تحميل المحتوى =====

function bindCheckboxEvents() {
    document.querySelectorAll('.order-check').forEach(cb => {
        if (cb.dataset.bound === 'true') return;
        cb.dataset.bound = 'true';
        cb.addEventListener('change', function() {
            const orderId = this.dataset.id;
            const row = this.closest('tr');
            if (this.checked) {
                row.classList.add('selected-row');
            } else {
                row.classList.remove('selected-row');
            }
            updateSelectedCount();
            updateHasAnySelection();
        });
    });

    document.querySelectorAll('.ship-check').forEach(cb => {
        if (cb.dataset.bound === 'true') return;
        cb.dataset.bound = 'true';
        cb.addEventListener('change', function() {
            const stage = this.dataset.stage || '';

}

function toggleOrderSelection(orderId, stageId, tableType, isLongPress) {
    let checkbox;
    if (tableType === 'shipping') {
        checkbox = document.querySelector(`.ship-check[data-id="${orderId}"]`);
    } else {
        checkbox = document.querySelector(`.order-check[data-id="${orderId}"]`);

    if (!checkbox) return;

        checkbox.checked = !checkbox.checked;
    } else {

    applyRowHighlightFromCheckbox(checkbox, tableType);

function attachRowClickEvents(tableType) {
    let selector;
    if (tableType === 'shipping') {
        selector = '.shipping-table-body tr[data-order-id]';
    } else if (tableType === 'orders') {
        selector = '#ordersTableBody tr[data-order-id]';
    } else {
        return;
    }

    const rows = document.querySelectorAll(selector);
    rows.forEach(row => {
        if (row.dataset.listener === 'attached') return;
        row.dataset.listener = 'attached';

        const orderId = row.dataset.orderId;
        const stage = row.dataset.stage || '';

        const handleClick = (e) => {
            const target = e.target;
            // تجاهل النقر على الأزرار أو الروابط أو الـ checkboxes نفسها
            if (target.tagName === 'INPUT' || target.tagName === 'BUTTON' || 
                target.closest('button') || target.closest('a')) {
                return;
            }

            // تبديل التحديد بنقرة واحدة
            if (tableType === 'shipping') {
                const stageId = stage.replace(/\s+/g, '_');
                toggleOrderSelection(orderId, stageId, tableType, false);
            } else {
                toggleOrderSelection(orderId, '', tableType, false);
            }
        };

        // إزالة المستمعات القديمة
        row.removeEventListener('click', handleClick);
        // إضافة المستمع الجديد
        row.addEventListener('click', handleClick);
    });
}

window.processShippingImport = function() {
    const fileInput = document.getElementById('shippingImportFileInput');
    const file = fileInput?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

            if (!rows.length) { toast('❌ الملف فارغ أو لا يمكن قراءته', 'danger'); return; }

            // تعيين قائمة الانتظار وإعادة تعيين المؤشرات
            shippingImportQueue = rows;
            shippingImportIndex = 0;
            shippingImportResults = {};
            unresolvedShippingItems = [];
            isShippingReviewRunning = true;

            closeModal();
            toast(`✅ تم تحميل ${rows.length} طلب، جاري المراجعة...`);

            // بدء المراجعة
            reviewNextShippingRow(0);
        } catch (err) {
            toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger');
        }
    };
    reader.readAsArrayBuffer(file);
};

// دالة المراجعة الأساسية
function reviewNextShippingRow(index) {
    if (!isShippingReviewRunning) return;

    if (index >= shippingImportQueue.length) {
        isShippingReviewRunning = false;
        const total = shippingImportQueue.length;
        const done = Object.values(shippingImportResults).filter(v => v === 'completed').length;
        const skipped = Object.values(shippingImportResults).filter(v => v === 'skipped').length;
        const unresolved = Object.values(shippingImportResults).filter(v => v === 'unresolved').length;
        toast(`✅ انتهت المراجعة: ${done} مؤكد, ${skipped} تخطي, ${unresolved} غير مفهوم`);
        renderCurrentPage();
        return;
    }

    const row = shippingImportQueue[index];
    const trackingCode = String(row['رقم الشحنة'] || row['رقم الشحنه'] || '').trim();
    const orderStatus = String(row['حالة الأوردر'] || '').trim();
    const paid = parseFloat(row['المدفوع']) || 0;
    const shipping = parseFloat(row['الشحن']) || 0;

    const order = allOrders.find(o => o.orderCode === trackingCode);
    if (!order) {
        showShippingErrorModal(index, 'not_found', row);
        return;
    }

    // ----- حالة خاصة: إذا كان الطلب من "غير مفهوم" وقد أصبح مسلّماً أو مرتجعاً بالفعل -----
    if (row.fromUnresolved && (order.status === 'تسليم' || order.status === 'مرتجع')) {
        // حذف العنصر من قائمة غير المفهوم
        removeFromUnresolvedByTrackingCode(trackingCode);
        shippingImportResults[index] = 'completed';
        toast(`✅ الطلب ${order.orderCode} موجود مسبقاً وتمت إزالته من غير المفهوم`, 'success');
        setTimeout(() => reviewNextShippingRow(index + 1), 200);
        return;
    }

    // ----- التحقق من الطلبات الجديدة -----
    if (order.status === 'جديد') {
        showNewOrderAlert(index, row, order);
        return;
    }

    // ----- التحقق من المكررات (تسليم أو مرتجع أو غير مفهوم) -----
    let unresolvedCodes = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) {
            const items = JSON.parse(raw);
            unresolvedCodes = items.map(item => String(item.row['رقم الشحنة'] || '').trim());
        }
    } catch(e) {}

    if (order.status === 'تسليم' || order.status === 'مرتجع' || unresolvedCodes.includes(trackingCode)) {
        // إذا كان الطلب من غير المفهوم وأصبح مسلّماً/مرتجعاً، نحذفه من غير المفهوم
        if (row.fromUnresolved) {
            removeFromUnresolvedByTrackingCode(trackingCode);
            shippingImportResults[index] = 'completed';
            toast(`✅ الطلب ${order.orderCode} تمت معالجته سابقاً وتمت إزالته من غير المفهوم`, 'success');
            setTimeout(() => reviewNextShippingRow(index + 1), 200);
            return;
        }
        showExistingOrderAlert(index, row, order);
        return;
    }

    // ----- معالجة التسليم أو المرتجع -----
    if (orderStatus === 'تم التسليم ودفع كلى') {
        const excelDue = paid - shipping;
        const systemDue = (order.total || 0) - (order.baseShippingCost || order.shippingCost || 0);
        if (Math.abs(excelDue - systemDue) < 0.01) {
            applyShippingDelivery(order, row, excelDue);
            shippingImportResults[index] = 'completed';
            // إذا كان من غير المفهوم، نحذفه من القائمة
            if (row.fromUnresolved) {
                removeFromUnresolvedByTrackingCode(trackingCode);
            }
            toast(`✅ تم تسليم الطلب ${order.orderCode}`, 'success');
            setTimeout(() => reviewNextShippingRow(index + 1), 200);
        } else {
            showShippingErrorModal(index, 'amount_mismatch', row, order, excelDue, systemDue);
        }
    } else {
        applyShippingReturn(order, row);
        shippingImportResults[index] = 'completed';
        if (row.fromUnresolved) {
            removeFromUnresolvedByTrackingCode(trackingCode);
        }
        toast(`↩️ تم تحويل الطلب ${order.orderCode} إلى مرتجع`, 'warning');
        setTimeout(() => reviewNextShippingRow(index + 1), 200);
    }
}

function removeFromUnresolvedByTrackingCode(trackingCode) {
    if (!trackingCode) return;
    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}
    const newItems = items.filter(item => (item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || '').trim() !== trackingCode);
    if (newItems.length !== items.length) {
        try { sessionStorage.setItem('shipping_unresolved_items', JSON.stringify(newItems)); } catch(e) {}
        unresolvedShippingItems = newItems;
    }
}

// ================================================================
// دوال تطبيق التسليم والمرتجع
// ================================================================

async function applyShippingDelivery(order, row, finalDue) {
    try {
        const baseShipping = order.baseShippingCost || order.shippingCost || 0;
        const updateData = {
            status: 'تسليم',
            deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            shippingImportPaid: parseFloat(row['المدفوع']) || 0,
            shippingImportShipping: parseFloat(row['الشحن']) || 0,
            shippingImportDue: finalDue,
            shippingImportNote: row['السبب'] || row['ملحوظة'] || '',
            isReturned: false,
            returnReceived: false,
            baseShippingCost: baseShipping, // حفظ سعر الشحن الأساسي
        };
        // إذا كان هناك سبب، نضيفه للملاحظات
        if (row['السبب']) {
            updateData.notes = (order.notes || '') + ' | سبب التسليم: ' + row['السبب'];
        }
        await db.collection('orders').doc(order.id).update(updateData);
        
        // تحديث الكائن المحلي
        Object.assign(order, updateData);
    } catch (err) {
        toast('❌ فشل تطبيق التسليم: ' + err.message, 'danger');
        console.error(err);
    }
}

async function applyShippingReturn(order, row) {
    try {
        // حساب صافى المبلغ (قد يكون سالباً)
        const paid = parseFloat(row['المدفوع']) || 0;
        const shipping = parseFloat(row['الشحن']) || 0;
        const settlement = paid - shipping;

        const updateData = {
            status: 'مرتجع',
            returnDate: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            returnSettlement: settlement,
            returnReceived: false,
            isReturned: true,
            returnContent: row['المحتوى'] || '',
            returnNote: row['ملحوظة'] || '',
            returnPieces: parseInt(row['عدد القطع']) || 0,
            returnReason: row['السبب'] || row['حالة الأوردر'] || '',
            returnOriginalStatus: row['حالة الأوردر'] || '',
            shippingImportPaid: paid,
            shippingImportShipping: shipping,
        };

        await db.collection('orders').doc(order.id).update(updateData);
        
        // تحديث الكائن المحلي
        Object.assign(order, updateData);
    } catch (err) {
        toast('❌ فشل تطبيق المرتجع: ' + err.message, 'danger');
        console.error(err);
    }
}

window.forceShippingRow = function(index) {
    const context = window._shippingErrorContext;
    if (!context) { toast('❌ حدث خطأ', 'danger'); return; }
    const { row, order } = context;
    const orderStatus = String(row['حالة الأوردر'] || '').trim();
    const paid = parseFloat(row['المدفوع']) || 0;
    const shipping = parseFloat(row['الشحن']) || 0;
    if (orderStatus === 'تم التسليم ودفع كلى') {
        const excelDue = paid - shipping;
        const systemDue = (order.total || 0) - (order.baseShippingCost || order.shippingCost || 0);
        if (Math.abs(excelDue - systemDue) < 0.01) {
            applyShippingDelivery(order, row, excelDue);
            shippingImportResults[index] = 'completed';
            toast(`✅ تم تسليم الطلب ${order.orderCode} (تجاوز)`, 'success');
        } else {
            showShippingErrorModal(index, 'amount_mismatch', row, order, excelDue, systemDue);
        }
    } else {
        applyShippingReturn(order, row);
        shippingImportResults[index] = 'completed';
        toast(`↩️ تم تحويل الطلب ${order.orderCode} إلى مرتجع (تجاوز)`, 'warning');
    }
    closeModal();
    setTimeout(() => reviewNextShippingRow(index + 1), 200);
};

// ================================================================
// مودال التعامل مع الأخطاء (رقم شحنة غير مطابق / مستحق غير مطابق)

function showShippingErrorModal(index, errorType, row, order, excelDue, systemDue) {
    let html = '';
    const trackingCode = String(row['رقم الشحنة'] || row['رقم الشحنه'] || '').trim();

    if (errorType === 'not_found') {
        html = `
            <div style="background:#fff4e5;border:1px solid var(--warning);padding:14px;border-radius:10px;margin-bottom:16px;">
                <strong>⚠️ لم يتم العثور على طلب برقم الشحنة:</strong><br>
                <span style="font-size:18px;font-weight:bold;color:var(--danger);">${trackingCode}</span>
            </div>
            <div style="background:var(--bg);padding:12px;border-radius:8px;margin-bottom:16px;">
                <div><strong>العميل:</strong> ${row['المرسل اليه'] || '—'}</div>
                <div><strong>المحافظة:</strong> ${row['المحافظة'] || '—'}</div>
                <div><strong>المدفوع:</strong> ${row['المدفوع'] || 0} ج</div>
                <div><strong>الشحن:</strong> ${row['الشحن'] || 0} ج</div>
                <div><strong>الحالة في الإكسل:</strong> ${row['حالة الأوردر'] || '—'}</div>
            </div>
            <div class="form-group">
                <label>🔍 تعديل رقم الشحنة (اكتب الكود الصحيح)</label>
                <input type="text" id="shippingErrorNewCode" class="btn" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;direction:ltr;text-align:left;" placeholder="أدخل كود الطلب الصحيح..." />
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="retryShippingWithNewCode(${index})">🔄 إعادة المحاولة بالكود الجديد</button>
                <button class="btn btn-danger" onclick="moveToUnresolved(${index})">🤔 غير مفهوم</button>
            </div>
        `;
    } else if (errorType === 'amount_mismatch') {
        const systemDueCorrect = (order.total || 0) - (order.baseShippingCost || order.shippingCost || 0);
        html = `
            <div style="background:#fff4e5;border:1px solid var(--warning);padding:14px;border-radius:10px;margin-bottom:16px;">
                <strong>⚠️ عدم تطابق في المستحق للطلب:</strong><br>
                <span style="font-size:16px;font-weight:bold;">${order.orderCode}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--bg);padding:14px;border-radius:8px;margin-bottom:16px;">
                <div><strong>📊 المستحق في الإكسل:</strong><br><span style="font-size:20px;color:var(--danger);">${excelDue.toFixed(2)} ج</span></div>
                <div><strong>📊 المستحق في النظام:</strong><br><span style="font-size:20px;color:var(--primary);">${systemDueCorrect.toFixed(2)} ج</span></div>
                <div><strong>إجمالي الطلب:</strong> ${order.total || 0} ج</div>
                <div><strong>سعر الشحن الأساسي:</strong> ${(order.baseShippingCost || order.shippingCost || 0)} ج</div>
            </div>
            <div class="form-group">
                <label>✏️ تعديل المستحق (اختياري، اتركه كما هو للتأكيد بالقيمة الحالية)</label>
                <input type="number" id="shippingErrorOverrideDue" class="btn" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;" step="0.01" value="${excelDue.toFixed(2)}" />
            </div>
            <div class="form-actions">
                <button class="btn btn-success" onclick="confirmShippingWithOverride(${index}, '${order.id}')">✔ تأكيد التسليم (بالمستحق المعدل)</button>
                <button class="btn btn-danger" onclick="moveToUnresolved(${index})">🤔 غير مفهوم</button>
            </div>
        `;
    }

    window._shippingErrorContext = { index, row, order, errorType, excelDue, systemDue };
    openModal('⚠️ توقف المراجعة - مطلوب تدخل', html);
}

window.retryShippingWithNewCode = function(index) {
    const newCode = document.getElementById('shippingErrorNewCode')?.value?.trim();
    if (!newCode) { toast('❌ يرجى إدخال كود صحيح', 'danger'); return; }

    // تحديث رقم الشحنة في الصف وإعادة محاولة المراجعة
    const row = shippingImportQueue[index];
    row['رقم الشحنة'] = newCode;
    row['رقم الشحنه'] = newCode; // للمرونة

    closeModal();
    toast('🔄 جاري إعادة المحاولة بالكود الجديد...');
    // إعادة استدعاء نفس العنصر
    reviewNextShippingRow(index);
};

window.skipShippingRow = function(index) {
    shippingImportResults[index] = 'skipped';
    closeModal();
    toast(`⏭ تم تخطي الطلب رقم ${index+1}`);
    reviewNextShippingRow(index + 1);
};

window.moveToUnresolved = function(index) {
    const row = shippingImportQueue[index];
    const trackingCode = String(row['رقم الشحنة'] || row['رقم الشحنه'] || '').trim();
    if (!trackingCode) {
        toast('⚠️ رقم الشحنة غير موجود، لا يمكن نقله', 'danger');
        return;
    }

    // جلب القائمة الحالية من sessionStorage
    let items = [];
    try {
        const raw = sessionStorage.getItem('shipping_unresolved_items');
        if (raw) items = JSON.parse(raw);
    } catch(e) {}

    // التحقق من عدم وجود نفس العنصر مسبقاً (حسب رقم الشحنة)
    const exists = items.some(item => (item.row['رقم الشحنة'] || item.row['رقم الشحنه'] || '').trim() === trackingCode);
    if (exists) {
        toast('⚠️ هذا الطلب موجود بالفعل في قائمة غير المفهوم', 'warning');
        // مع ذلك، نعتبره غير مفهوم وننهي المراجعة لهذا العنصر
        shippingImportResults[index] = 'unresolved';
        closeModal();
        reviewNextShippingRow(index + 1);
        return;
    }

    const item = {
        row: row,
        index: index,
        movedAt: new Date().toISOString()
    };
    items.push(item);
    try { sessionStorage.setItem('shipping_unresolved_items', JSON.stringify(items)); } catch(e) {}
    unresolvedShippingItems = items;

    shippingImportResults[index] = 'unresolved';
    closeModal();
    toast(`🤔 تم نقل الطلب إلى "غير مفهوم"`);
    reviewNextShippingRow(index + 1);
};

window.confirmShippingWithOverride = async function(index, orderId) {
    const overrideDue = parseFloat(document.getElementById('shippingErrorOverrideDue')?.value);
    if (isNaN(overrideDue)) { toast('❌ قيمة غير صحيحة', 'danger'); return; }

    const context = window._shippingErrorContext;
    if (!context) { toast('❌ حدث خطأ في السياق', 'danger'); return; }

    const order = allOrders.find(o => o.id === orderId);
    if (!order) { toast('❌ الطلب غير موجود', 'danger'); return; }

    // استخدام baseShippingCost لحساب الإجمالي الجديد
    const baseShipping = order.baseShippingCost || order.shippingCost || 0;
    const newTotal = overrideDue + baseShipping;
    
    try {
        await db.collection('orders').doc(orderId).update({
            status: 'تسليم',
            total: newTotal,
            deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            shippingImportPaid: context.row['المدفوع'] || 0,
            shippingImportShipping: context.row['الشحن'] || 0,
            shippingImportDue: overrideDue,
            shippingImportNote: context.row['السبب'] || '',
            notes: (order.notes || '') + ' | تم التعديل يدوياً أثناء الاستيراد. المستحق الجديد: ' + overrideDue,
            isReturned: false,
            returnReceived: false,
        });
        // تحديث الكائن المحلي
        Object.assign(order, { status: 'تسليم', total: newTotal });
        shippingImportResults[index] = 'completed';
        toast(`✅ تم تسليم الطلب ${order.orderCode} بالقيمة المعدلة`, 'success');
        closeModal();
        reviewNextShippingRow(index + 1);
    } catch (err) {
        toast('❌ فشل التحديث: ' + err.message, 'danger');
    }
};

// ================================================================
// دالة تأكيد استلام المرتجع
// ================================================================

window.confirmReturnReceived = async function(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (!order) { toast('❌ الطلب غير موجود', 'danger'); return; }

    if (!confirm(`تأكيد استلام المرتجع للطلب ${order.orderCode}؟\nصافى المبلغ: ${(order.returnSettlement || 0).toFixed(2)} ج`)) return;

    try {
        const settlement = order.returnSettlement || 0;

        // 1. تحديث حالة الطلب إلى "تسليم" وإزالة علامة المرتجع
        await db.collection('orders').doc(orderId).update({
            status: 'تسليم',
            returnReceived: true,
            returnConfirmedAt: firebase.firestore.FieldValue.serverTimestamp(),
            returnConfirmedBy: currentUser.uid,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            isReturned: false,
            // إضافة صافى المبلغ إلى profit (إذا كان موجباً يزيد الربح، إذا كان سالباً يقلل الربح)
            profit: firebase.firestore.FieldValue.increment(settlement)
        });

        // 2. تحديث أرباح المسوق
        if (order.marketerId) {
            await db.collection('marketers').doc(order.marketerId).set({
                totalProfit: firebase.firestore.FieldValue.increment(settlement)
            }, { merge: true });
        }

        // تحديث الكائن المحلي
        order.status = 'تسليم';
        order.returnReceived = true;
        order.profit = (order.profit || 0) + settlement;

        toast(`✅ تم تأكيد استلام المرتجع، صافى المبلغ ${settlement.toFixed(2)} ج`, 'success');
        renderCurrentPage();
    } catch (err) {
        toast('❌ فشل تأكيد الاستلام: ' + err.message, 'danger');
    }
};
