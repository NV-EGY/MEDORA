window.autoReviewAllImport = async function() {
    _suppressRender = true;

    try {
        // جمع الطلبات المعلقة
        const pending = [];
        importQueue.forEach((item, i) => {
            if (!importResults[i]) pending.push(i);
        });

        if (!pending.length) {
            toast('✅ لا توجد طلبات معلقة للمراجعة', 'success');
            _suppressRender = false;
            renderCurrentPage();
            return;
        }

        if (!confirm(`⚠️ سيتم مراجعة ${pending.length} طلب تلقائياً.\nسيتم التوقف عند أول خطأ أو تحذير لإتاحة الفرصة للإصلاح.\nهل تريد المتابعة؟`)) {
            _suppressRender = false;
            renderCurrentPage();
            return;
        }

        let stopped = false;
        let lastIndex = -1;
        let confirmedCount = 0;
        const totalPending = pending.length;

        // دالة معالجة عنصر واحد
        const processNext = (idx) => {
            // إذا تم الإيقاف أو انتهاء القائمة
            if (stopped || idx >= pending.length) {
                // انتهت المعالجة
                _suppressRender = false;
                if (!stopped) {
                    toast(`✅ تمت مراجعة وإضافة جميع الطلبات (${confirmedCount}) بنجاح`, 'success');
                    importQueue = [];
                    importResults = {};
                    renderCurrentPage();
                } else {
                    renderCurrentPage();
                    const remaining = importQueue.filter((_, i) => !importResults[i]);
                    if (remaining.length > 0) {
                        toast(`⏸️ توقف عند الطلب ${lastIndex+1}. تبقى ${remaining.length} طلب للمراجعة.`, 'warning');
                    }
                }
                return;
            }

            const queueIndex = pending[idx];

            // ✅ تأخير صغير (10ms) قبل كل معالجة لضمان إفساح المجال للمتصفح
            setTimeout(async () => {
                try {
                    // بناء بيانات الطلب
                    const data = buildOrderDataFromQueueItem(queueIndex);

                    // التحقق من الصحة
                    const validation = validateAndWarnOrder(data);

                    if (!validation.valid) {
                        const errorMsg = validation.errors.join('\n');
                        toast(`❌ خطأ في الطلب ${queueIndex+1}: ${errorMsg}`, 'danger');
                        alert(`⚠️ تم التوقف عند الطلب رقم ${queueIndex+1}\n\nالأخطاء:\n${errorMsg}\n\nقم بإصلاح الخطأ ثم اضغط على الزر مرة أخرى للمتابعة.`);
                        stopped = true;
                        lastIndex = queueIndex;
                        _suppressRender = false;
                        renderCurrentPage();
                        return;
                    }

                    if (validation.warnings.length > 0) {
                        const warningMsg = validation.warnings.join('\n\n');
                        const shouldContinue = confirm(
                            `⚠️ تحذير في الطلب ${queueIndex+1}:\n\n${warningMsg}\n\nهل تريد المتابعة وإضافة الطلب رغم التحذيرات؟\n\n(اضغط "إلغاء" للتوقف والمراجعة)`
                        );
                        if (!shouldContinue) {
                            stopped = true;
                            lastIndex = queueIndex;
                            _suppressRender = false;
                            renderCurrentPage();
                            return;
                        }
                    }

                    // محاولة إضافة الطلب
                    try {
                        await submitOrderData(data);
                        importResults[queueIndex] = 'confirmed';
                        confirmedCount++;
                        updateProgressDisplay(confirmedCount, totalPending);
                    } catch (err) {
                        toast(`❌ فشل إضافة الطلب ${queueIndex+1}: ${err.message}`, 'danger');
                        alert(`⚠️ فشل إضافة الطلب رقم ${queueIndex+1}\n\nالخطأ: ${err.message}\n\nقم بإصلاح المشكلة ثم اضغط على الزر مرة أخرى.`);
                        stopped = true;
                        lastIndex = queueIndex;
                        _suppressRender = false;
                        renderCurrentPage();
                        return;
                    }

                    // معالجة التالي بعد تأخير 200ms
                    setTimeout(() => {
                        processNext(idx + 1);
                    }, 200);

                } catch (err) {
                    // خطأ غير متوقع في هذه الدورة
                    toast('❌ حدث خطأ غير متوقع: ' + err.message, 'danger');
                    console.error('Auto-review error (per item):', err);
                    stopped = true;
                    lastIndex = queueIndex;
                    _suppressRender = false;
                    renderCurrentPage();
                }
            }, 10); // تأخير 10ms قبل بدء معالجة العنصر
        };

        // بدء المعالجة من العنصر الأول
        processNext(0);

    } catch (err) {
        _suppressRender = false;
        toast('❌ حدث خطأ غير متوقع: ' + err.message, 'danger');
        console.error('Auto-review error:', err);
        renderCurrentPage();
    }
};

// دالة مساعدة لتحديث مؤشر التقدم دون إعادة تحميل الصفحة
function updateProgressDisplay(confirmed, total) {
    const remaining = total - confirmed;
    const statusEl = document.querySelector('#importStatusDisplay');
    if (statusEl) {
        statusEl.textContent = `تم تأكيد ${confirmed} من ${total}، متبقي ${remaining}`;
    }
}

window.confirmImportOrder = async function(index) {
    if (importResults[index]) return;
    const orderData = importQueue[index];
    if (!orderData) {
        toast('❌ بيانات الطلب غير موجودة', 'danger');
        return;
    }

    const data = {
        customer: orderData.customerName,
        phone: orderData.phoneRaw,
        phone2: orderData.phone2Raw || '', // <-- تمت الإضافة
        governorate: orderData.governorate,
        city: orderData.city,
        address: orderData.address,
        statusType: document.getElementById('importStatusType')?.value || 'شراء',
        notes: orderData.notes,
        shippingCost: parseFloat(document.getElementById('importShippingCost')?.value) || orderData.shippingCost || allSettings.shippingCost || 50,
        products: orderData.products.map(p => ({
            productId: p.productId,
            qty: p.qty || 1,
            sellPrice: p.sellPrice || 0,
            weightSize: p.weightSize || '',
            total: (p.sellPrice || 0) * (p.qty || 1)
        })),
        pageId: currentUserPageId,
        creatorId: currentUser.uid
    };

    data.total = data.products.reduce((s, p) => s + p.total, 0) + data.shippingCost;
    data.totalProfit = data.products.reduce((s, p) => {
        const product = allProducts.find(pr => pr.id === p.productId);
        const base = product?.basePrice || 0;
        return s + (p.sellPrice - base) * p.qty;
    }, 0);
    const baseShipping = customShippingCosts[data.city] || customShippingCosts[data.governorate] || allSettings.shippingCost || 50;
    data.shippingDiff = data.shippingCost - baseShipping;
    data.totalProfit += data.shippingDiff;

    if (!data.pageId) {
        toast('❌ حسابك غير مرتبط بصفحة.', 'danger');
        return;
    }

    const validation = validateAndWarnOrder(data);
    if (!validation.valid) {
        validation.errors.forEach(err => toast(err, 'danger'));
        return;
    }
    if (validation.warnings.length > 0) {
        const warningMessage = validation.warnings.join('\n\n') + '\n\nهل تريد المتابعة وإضافة الطلب؟';
        if (!confirm(warningMessage)) {
            return;
        }
    }

    try {
        await submitOrderData(data);
        importResults[index] = 'confirmed';
        toast(`✅ تم تأكيد الطلب (${index+1})`, 'success');
        renderCurrentPage();
    } catch (err) {
        toast('❌ ' + err.message, 'danger');
        console.error('Error confirming import order:', err);
    }
};

// دالة مساعدة لإضافة طلب من بيانات جاهزة (دون واجهة)
async function submitOrderData(data) {
    if (!data.pageId || !data.creatorId) {
        throw new Error('بيانات الصفحة أو المنشئ غير مكتملة');
    }

    let creatorName = data.creatorName || 'غير معروف';
    let creatorRole = data.creatorRole || currentUserRole || 'marketer';

    if (!data.creatorName) {
        if (currentUserData && currentUserData.name) {
            creatorName = currentUserData.name;
        } else if (currentUser && currentUser.displayName) {
            creatorName = currentUser.displayName;
        } else if (currentUser && currentUser.email) {
            creatorName = currentUser.email;
        }
    }

    const orderCode = await generateOrderCode(data.pageId, data.creatorId);
    const due = (data.total || 0) - (data.baseShippingCost || 0);

    const orderData = {
        orderCode,
        customerName: data.customer || '',
        customerPhone: data.phone || '',
        customerPhone2: data.phone2 || '',
        governorate: data.governorate || '',
        city: data.city || '',
        address: data.address || '',
        shippingType: 'تلقائي',
        shippingCost: data.shippingCost || 0,
        baseShippingCost: data.baseShippingCost || data.shippingCost || 0,
        shippingDiff: data.shippingDiff || 0,
        due: due, // <-- إضافة المستحق
        products: data.products || [],
        total: data.total || 0,
        statusType: data.statusType || 'جديد',
        status: 'جديد',
        marketerId: data.creatorId,
        pageId: data.pageId,
        notes: data.notes || '',
        profit: data.totalProfit || 0,
        createdBy: data.creatorId,
        createdByName: creatorName,
        createdByRole: creatorRole,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection('orders').add(orderData);

    const marketerRef = db.collection('marketers').doc(data.creatorId);
    const marketerDoc = await marketerRef.get();
    if (!marketerDoc.exists) {
        const userData = allUsers.find(u => u.id === data.creatorId);
        await marketerRef.set({
            userId: data.creatorId,
            name: userData?.name || 'غير معروف',
            email: userData?.email || '',
            pageId: data.pageId,
            totalProfit: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
    await marketerRef.set({
        totalProfit: firebase.firestore.FieldValue.increment(data.totalProfit || 0)
    }, { merge: true });
}

// تأكيد الكل المتبقي (بدون مراجعة فردية)
window.confirmAllImport = function() {
    if (isConfirmingAll) {
        toast('⏳ جاري تنفيذ التأكيد بالفعل، انتظر قليلاً', 'warning');
        return;
    }

    const pending = importQueue.filter((_, i) => !importResults[i]);
    if (!pending.length) {
        toast('لا توجد طلبات معلقة', 'warning');
        return;
    }
    if (!confirm(`تأكيد جميع الطلبات المتبقية (${pending.length}) بدون مراجعة؟`)) return;

    isConfirmingAll = true;
    _suppressRender = true;

    const toConfirm = [];
    importQueue.forEach((item, i) => {
        if (!importResults[i]) toConfirm.push(i);
    });

    let successCount = 0;
    let errorCount = 0;
    const errors = [];
    let currentIndex = 0;

    function processNext() {
        if (currentIndex >= toConfirm.length) {
            // انتهت المعالجة
            if (successCount > 0 && errorCount === 0) {
                toast(`✅ تم تأكيد ${successCount} طلب بنجاح`, 'success');
            } else if (successCount > 0 && errorCount > 0) {
                toast(`⚠️ تم تأكيد ${successCount} طلب، وفشل ${errorCount} طلب.`, 'warning');
            } else {
                toast(`❌ فشل تأكيد جميع الطلبات (${errorCount}).`, 'danger');
            }
            if (errors.length > 0) {
                console.error('أخطاء تأكيد الطلبات:', errors);
                if (errors.length <= 10) {
                    alert('❌ أخطاء أثناء التأكيد:\n\n' + errors.join('\n\n'));
                } else {
                    alert(`❌ حدث ${errors.length} خطأ أثناء التأكيد. راجع وحدة التحكم للتفاصيل.`);
                }
            }
            // تنظيف
            importQueue = [];
            importResults = {};
            isConfirmingAll = false;
            _suppressRender = false;
            renderCurrentPage();
            return;
        }

        const i = toConfirm[currentIndex];
        (async () => {
            try {
                const data = buildOrderDataFromQueueItem(i);
                await submitOrderData(data);
                importResults[i] = 'confirmed';
                successCount++;
            } catch (err) {
                errors.push(`الطلب ${i+1}: ${err.message}`);
                errorCount++;
            }
            currentIndex++;
            // جدولة العنصر التالي بعد 200 مللي (أعطِ وقتاً كافياً)
            setTimeout(processNext, 200);
        })();
    }

    // بدء المعالجة
    processNext();
};

function buildOrderDataFromQueueItem(index) {
    const item = importQueue[index];
    if (!item) {
        throw new Error(`الطلب رقم ${index+1} غير موجود في قائمة الاستيراد`);
    }

    // التحقق من الحقول الأساسية
    if (!item.customerName || !item.phoneRaw || !item.governorate) {
        throw new Error(`الطلب رقم ${index+1} يفتقد بيانات أساسية (الاسم، الهاتف، أو المحافظة)`);
    }

    let creatorName = 'غير معروف';
    if (currentUserData && currentUserData.name) {
        creatorName = currentUserData.name;
    } else if (currentUser && currentUser.displayName) {
        creatorName = currentUser.displayName;
    } else if (currentUser && currentUser.email) {
        creatorName = currentUser.email;
    }
    let creatorRole = currentUserRole || 'marketer';

    // التأكد من وجود المنتجات، وإذا لم توجد نضع منتجاً افتراضياً
    let products = item.products || [];
    if (products.length === 0) {
        products = [{ productId: '', productName: 'منتج', qty: 1, sellPrice: 0, weightSize: '', total: 0 }];
    }

    // معالجة المنتجات مع حفظ الاسم
    const productsWithNames = products.map(p => {
        const product = allProducts.find(pr => pr.id === p.productId);
        const productName = p.productName || product?.name || 'منتج';
        return {
            productId: p.productId || '',
            productName: productName,
            qty: p.qty || 1,
            sellPrice: p.sellPrice || 0,
            weightSize: p.weightSize || '',
            total: (p.sellPrice || 0) * (p.qty || 1)
        };
    });

    // استخدام statusType من العنصر إذا كان موجوداً، وإلا استخدم 'شراء'
    const statusType = item.statusType || 'شراء';

    // ===== حساب سعر الشحن مع الحفاظ على القيمة 0 =====
    let shippingCost;
if (item.shippingCost !== undefined && item.shippingCost !== null && !isNaN(item.shippingCost)) {
    shippingCost = item.shippingCost;
} else {
    shippingCost = allSettings.shippingCost || 50;
}

    const data = {
        customer: item.customerName,
        phone: item.phoneRaw,
        phone2: item.phone2Raw || '',
        governorate: item.governorate,
        city: item.city || '',
        address: item.address || '',
        statusType: statusType,
        notes: item.notes || '',
        shippingCost: shippingCost,
        products: productsWithNames,
        pageId: currentUserPageId,
        creatorId: currentUser.uid,
        creatorName: creatorName,
        creatorRole: creatorRole
    };
    
    // حساب total و totalProfit و shippingDiff
    data.total = data.products.reduce((s, p) => s + p.total, 0) + data.shippingCost;
    data.totalProfit = data.products.reduce((s, p) => {
        const product = allProducts.find(pr => pr.id === p.productId);
        const base = product?.basePrice || 0;
        return s + (p.sellPrice - base) * p.qty;
    }, 0);
    const baseShipping = customShippingCosts[data.city] || customShippingCosts[data.governorate] || allSettings.shippingCost || 50;
    data.shippingDiff = data.shippingCost - baseShipping;
    data.totalProfit += data.shippingDiff;
    data.baseShippingCost = baseShipping;
    
    return data;
}

// تأكيد الطلب الحالي (في واجهة اللصق)
window.confirmCurrentImport = async function() {
    let index = -1;
    for (let i = 0; i < importQueue.length; i++) {
        if (!importResults[i]) {
            index = i;
            break;
        }
    }
    if (index === -1) {
        toast('لا توجد طلبات معلقة', 'warning');
        return;
    }

    const data = collectImportFormData();
    if (!data) return;

    // ====== إضافة معلومات المنشئ ======
    var creatorName = 'غير معروف';
    var creatorRole = currentUserRole || 'marketer';
    if (currentUserData && currentUserData.name) {
        creatorName = currentUserData.name;
    } else if (currentUser && currentUser.displayName) {
        creatorName = currentUser.displayName;
    } else if (currentUser && currentUser.email) {
        creatorName = currentUser.email;
    }
    data.creatorName = creatorName;
    data.creatorRole = creatorRole;

    const validation = validateAndWarnOrder(data);
    if (!validation.valid) {
        validation.errors.forEach(err => toast(err, 'danger'));
        return;
    }
    if (validation.warnings.length > 0) {
        const warningMessage = validation.warnings.join('\n\n') + '\n\nهل تريد المتابعة وإضافة الطلب؟';
        if (!confirm(warningMessage)) {
            return;
        }
    }

    try {
        await submitOrderData(data);
        importResults[index] = 'confirmed';
        toast(`✅ تم تأكيد الطلب (${index+1})`, 'success');

        const pending = importQueue.filter((_, i) => !importResults[i]);
        if (pending.length === 0) {
            importQueue = [];
            importResults = {};
            renderCurrentPage();
        } else {
            renderCurrentPage();
        }
    } catch (err) {
        toast('❌ ' + err.message, 'danger');
        console.error('Error confirming import order:', err);
    }
};

    var shippingCostInput = document.getElementById('importShippingCost');
var shippingCostRaw = shippingCostInput ? shippingCostInput.value : '';
var shippingCost = parseFloat(arabicToEnglishDigits(shippingCostRaw));
if (isNaN(shippingCost) || shippingCost === undefined) {
    shippingCost = allSettings.shippingCost || 50;
}

    if (!customer || !phone || !governorate || !products.length) {

    return {

        creatorName, creatorRole
    };
}

// EXCEL (CSV) EXPORT - مع كود الطلب الصحيح
// ================================================================
function exportOrdersToExcel(orders, filename) {
    if (!orders.length) { toast('❌ لا توجد طلبات لتصديرها', 'danger'); return; }
    
    // رؤوس الأعمدة – إضافة عمود "المستحق المحصل"
    const headers = [
        'كود الطلب',
        'اسم العميل',
        'رقم الهاتف',
        'المحافظة',
        'المدينة',
        'المرحلة',
        'نوع الشحن',
        'المنتجات',
        'الإجمالي',
        'المستحق المحصل',    // ← العمود الجديد
        'سعر الشحن الأساسي',
        'سعر الشحن الفعلي',
        'فرق الشحن',
        'الحالة',
        'المسوق',
        'الصفحة',
        'المنشئ',
        'تاريخ الإنشاء',
        'ملاحظات'
    ];

    const csvEscape = (val) => {
        let s = (val === null || val === undefined) ? '' : String(val);
        s = s.replace(/"/g, '""');
        return `"${s}"`;
    };

    const rows = orders.map(o => {
        const m = allMarketers.find(x => x.id === o.marketerId);
        const page = allPages.find(p => p.id === o.pageId);

        // بناء سلسلة المنتجات
        let productsStr = '';
        if (o.products && o.products.length) {
            productsStr = o.products.map(p => {
                const prod = allProducts.find(pr => pr.id === p.productId);
                const price = p.sellPrice || p.price || 0;
                const qty = p.qty || 1;
                return `${prod?.name || 'منتج'} × ${qty} (${price} ج)${p.weightSize ? ' وزن: '+p.weightSize : ''}`;
            }).join(' / ');
        } else if (o.productId || o.productName) {
            const prod = allProducts.find(pr => pr.id === o.productId);
            const price = o.sellPrice || o.productPrice || 0;
            const qty = o.qty || 1;
            productsStr = `${prod?.name || o.productName || 'منتج'} × ${qty} (${price} ج)${o.weightSize ? ' وزن: '+o.weightSize : ''}`;
        } else {
            productsStr = '';
        }

        const total = o.total || 0;
        const baseShipping = o.baseShippingCost || 0;
        const actualShipping = o.shippingCost || 0;

        // ===== حساب المستحق المحصل =====
        const collectedDue = getOrderCollectedDue(o);
        const dueDisplay = collectedDue !== null ? collectedDue : ''; // نص أو رقم

        // ترتيب الحقول حسب رؤوس الأعمدة
        return [
            o.orderCode || '#' + o.id.slice(0, 8),   // كود الطلب
            o.customerName || '',                     // اسم العميل
            o.customerPhone || '',                    // رقم الهاتف
            o.governorate || '',                      // المحافظة
            o.city || '',                             // المدينة
            getOrderStage(o),                         // المرحلة
            o.shippingType || '',                     // نوع الشحن
            productsStr,                              // المنتجات
            total,                                    // الإجمالي
            dueDisplay,                               // المستحق المحصل (الجديد)
            baseShipping,                             // سعر الشحن الأساسي
            actualShipping,                           // سعر الشحن الفعلي
            o.shippingDiff || 0,                      // فرق الشحن
            o.status || 'جديد',                       // الحالة
            m?.name || '',                            // المسوق
            page?.name || '',                         // الصفحة
            o.createdByName || '',                    // المنشئ
            o.createdAt?.toDate?.()?.toLocaleDateString('en-EG') || '', // تاريخ الإنشاء
            o.notes || ''                             // ملاحظات
        ].map(csvEscape).join(',');
    });

    const csvContent = '\uFEFF' + headers.map(csvEscape).join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename.endsWith('.csv') ? filename : filename + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    toast(`✅ تم تصدير ${orders.length} طلب إلى ملف Excel`);
}

// ===== استبدال دالة buildProductRowHtml =====
function buildProductRowHtml(productData, index, containerId) {
    if (!containerId) containerId = 'productsContainer';
    var productId = productData ? productData.productId : '';
    var sellPrice = productData ? productData.sellPrice : 0;
    var weightSize = productData ? productData.weightSize : '';

    var pageId = currentUserPageId;
    var productList = allProducts.filter(function(p) { return p.pageId === pageId; });
    var productOpts = '<option value="">اختر منتج</option>';
    productOpts += productList.map(function(p) {
        return '<option value="' + p.id + '" data-base-price="' + (p.basePrice||0) + '" ' + (p.id === productId ? 'selected' : '') + '>' + p.name + (p.extra ? ' - ' + p.extra : '') + '</option>';
    }).join('');

    return `
    <div class="product-row" data-index="${index}" style="display:flex;flex-wrap:wrap;gap:10px;background:var(--bg);padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid var(--line);">
      <div class="form-group" style="flex:2;min-width:150px;">
        <label>المنتج</label>
        <select class="product-select" onchange="updateProductRow(${index}, '${containerId}')">
          ${productOpts}
        </select>
      </div>
      <div class="form-group" style="flex:1;min-width:100px;">
        <label>سعر المنتج</label>
        <input type="number" class="product-price" value="${sellPrice}" step="0.01" onchange="updateProductRow(${index}, '${containerId}')" oninput="updateOrderTotal('${containerId}', document.getElementById('modalBody'))" />
      </div>
      <div class="form-group" style="flex:1;min-width:100px;">
        <label>الوزن/المقاس</label>
        <input type="text" class="product-weight" value="${weightSize}" placeholder="مثال: 130ك/160سم" onchange="updateProductRow(${index}, '${containerId}')" />
      </div>
      <button type="button" class="btn btn-sm btn-danger" style="align-self:center;" onclick="removeProductRow(${index}, '${containerId}')">✕</button>
    </div>
    `;
}

// إضافة صف منتج جديد
window.updateProductRow = function(index, containerId = 'productsContainer') {
    const container = document.getElementById(containerId);
    if (!container) return;
    const rows = container.querySelectorAll('.product-row');
    const row = rows[index];
    if (!row) return;
    // إعادة حساب الإجمالي
    updateOrderTotal(containerId);
};

// حذف صف منتج
window.removeProductRow = function(index, containerId = 'productsContainer') {
    const container = document.getElementById(containerId);
    if (!container) return;
    const rows = container.querySelectorAll('.product-row');
    if (rows.length <= 1) { toast('❌ يجب أن يكون هناك منتج واحد على الأقل', 'danger'); return; }
    rows.forEach(row => {
        if (parseInt(row.dataset.index) === index) row.remove();
    });
    // إعادة ترقيم الصفوف
    container.querySelectorAll('.product-row').forEach((row, i) => row.dataset.index = i);
    updateOrderTotal(containerId);
};

// تحديث صف منتج (إعادة حساب الإجمالي الكلي فقط)
window.updateProductRow = function(index, containerId = 'productsContainer') {
    const container = document.getElementById(containerId);
    if (!container) return;
    // إعادة حساب الإجمالي
    updateOrderTotal(containerId);
};

// حساب الإجمالي الكلي للطلب
function updateOrderTotal(containerId, context) {
    // إذا لم يتم تمرير containerId، استخدم الافتراضي
    if (!containerId) containerId = 'productsContainer';
    
    // البحث عن الحاوية: إذا كان context موجوداً نبحث داخله، وإلا نبحث في المستند كله
    var container;
    if (context) {
        container = context.querySelector ? context.querySelector('#' + containerId) : document.getElementById(containerId);
    } else {
        // حاول البحث داخل المودال أولاً، ثم في المستند
        var modalBody = document.getElementById('modalBody');
        if (modalBody) {
            container = modalBody.querySelector('#' + containerId);
        }
        if (!container) {
            container = document.getElementById(containerId);
        }
    }
    if (!container) return;

    var priceInputs = container.querySelectorAll('.product-price');
    var grandTotal = 0;
    priceInputs.forEach(function(inp) {
        grandTotal += parseFloat(inp.value) || 0;
    });

    // تحديد البادئة (order أو import) بناءً على containerId
    var prefix = containerId === 'importProductsContainer' ? 'import' : 'order';
    
    // البحث عن حقل سعر الشحن
    var shippingCostInput;
    if (context) {
        shippingCostInput = context.querySelector ? context.querySelector('#' + prefix + 'ShippingCost') : document.getElementById(prefix + 'ShippingCost');
    } else {
        var modalBody = document.getElementById('modalBody');
        if (modalBody) {
            shippingCostInput = modalBody.querySelector('#' + prefix + 'ShippingCost');
        }
        if (!shippingCostInput) {
            shippingCostInput = document.getElementById(prefix + 'ShippingCost');
        }
    }
    var shippingCost = parseFloat(shippingCostInput ? shippingCostInput.value : 0) || 0;
    grandTotal += shippingCost;

    var totalInput;
    if (context) {
        totalInput = context.querySelector ? context.querySelector('#' + prefix + 'Total') : document.getElementById(prefix + 'Total');
    } else {
        var modalBody = document.getElementById('modalBody');
        if (modalBody) {
            totalInput = modalBody.querySelector('#' + prefix + 'Total');
        }
        if (!totalInput) {
            totalInput = document.getElementById(prefix + 'Total');
        }
    }
    if (totalInput) {
        totalInput.value = grandTotal.toFixed(2);
    }
}

function updateOrderTotalInContext(containerId, context) {
    if (!context) context = document;
    var container = context.querySelector ? context.querySelector('#' + containerId) : document.getElementById(containerId);
    if (!container) return;

    var priceInputs = container.querySelectorAll('.product-price');
    var grandTotal = 0;

window.addProductRow = function(containerId) {
    if (!containerId) containerId = 'productsContainer';
    var container = document.getElementById(containerId);
    if (!container) {
        // حاول البحث داخل المودال
        var modalBody = document.getElementById('modalBody');
        if (modalBody) {
            container = modalBody.querySelector('#' + containerId);
        }
    }
    if (!container) return;
    var index = container.children.length;
    var newRow = buildProductRowHtml(null, index, containerId);
    container.insertAdjacentHTML('beforeend', newRow);
    updateOrderTotal(containerId, document.getElementById('modalBody'));
};

// الدالة الجديدة لتحديث سعر الشحن بناءً على المحافظة المختارة
window.updateShippingCostByGovernorate = function() {
    const govSelect = $('orderGovernorate');
    const citySelect = $('orderCity');
    const selectedGov = govSelect?.value;
    const selectedCity = citySelect?.value;
    const costInput = $('orderShippingCost');
    const stageDisplay = $('orderStageDisplay');
    if (!selectedGov || !costInput) return;

    let stage = 'داخلي شحن';
    for (const [s, govs] of Object.entries(GOVERNORATE_CLASSIFICATION)) {
        if (govs.includes(selectedGov)) {
            stage = s;
            break;
        }
    }

    // السعر من المدن أولاً، ثم المحافظات، ثم الإعداد العام
    let cost = customShippingCosts[selectedCity] || customShippingCosts[selectedGov] || allSettings.shippingCost || 50;
    // إذا كان الحقل قد تم ملؤه يدوياً بقيمة (من الاستيراد)، لا نغيره
    // لكننا نتحقق إذا كانت القيمة الحالية هي نفس القيمة الافتراضية أو تم تعيينها يدوياً؟
    // الأفضل: إذا كان الحقل فارغاً أو يحتوي على القيمة الافتراضية، نضعه.
    if (!costInput.value || costInput.value == allSettings.shippingCost || costInput.value == '') {
        costInput.value = cost;
    }
    if (stageDisplay) stageDisplay.value = stage + (selectedCity ? ` - ${selectedCity}` : '');
};

// UPDATE SHIPPING COST BY GOVERNORATE (معدل مع الأولويات)
// ================================================================
window.updateShippingCostByGovernorate = function(prefix = 'order') {
    const govSelect = document.getElementById(prefix + 'Governorate');
    const citySelect = document.getElementById(prefix + 'City');
    const costInput = document.getElementById(prefix + 'ShippingCost');
    const stageDisplay = document.getElementById(prefix + 'StageDisplay');
    const baseCostInput = document.getElementById(prefix + 'BaseShippingCost');

    if (!govSelect || !costInput) return;
    const selectedGov = govSelect.value;
    const selectedCity = citySelect ? citySelect.value : '';

    let stage = 'داخلي شحن';
    for (const [s, govs] of Object.entries(GOVERNORATE_CLASSIFICATION)) {
        if (govs.includes(selectedGov)) {
            stage = s;
            break;
        }
    }

    // حساب السعر الأساسي
    let baseCost = customShippingCosts[selectedCity] || customShippingCosts[selectedGov] || allSettings.shippingCost || 50;

    // تحديث الحقول
    if (costInput) {
    var currentVal = parseFloat(arabicToEnglishDigits(costInput.value));
    if (isNaN(currentVal) || currentVal === allSettings.shippingCost || (currentVal === 0 && costInput.dataset.userEdited !== 'true')) {
        costInput.value = baseCost;
    } else {
        costInput.dataset.userEdited = 'true';
    }
}
    if (baseCostInput) {
        baseCostInput.value = baseCost;
    }
    if (stageDisplay) {
        stageDisplay.value = stage + (selectedCity ? ' - ' + selectedCity : '');
    }

    // تحديث الإجمالي
    const containerId = prefix === 'import' ? 'importProductsContainer' : 'productsContainer';
    updateOrderTotal(containerId);
};

window.submitOrder = async function(e) {
    e.preventDefault();
    var form = e.target;
    var data = collectOrderFormData(form);

    if (!data.pageId) {
        toast('❌ حسابك غير مرتبط بأي صفحة. يرجى تخصيص صفحة لك أولاً.', 'danger');
        return false;
    }
    var pageExists = allPages.some(function(p) { return p.id === data.pageId; });
    if (!pageExists) {
        toast('❌ الصفحة التي تحاول إضافة الطلب لها غير موجودة.', 'danger');
        return false;
    }

    if (!data.customer || !data.governorate || !data.products.length) {
        toast('❌ يرجى ملء اسم العميل، المحافظة، ومنتج واحد على الأقل', 'danger');
        return false;
    }

    if (!isValidEgyptianPhone(data.phone)) {
        if (!confirm('⚠️ رقم الهاتف غير صحيح أو غير مكتمل. هل تريد المتابعة مع هذا الرقم؟')) {
            return false;
        }
    }
    if (data.phone2 && !isValidEgyptianPhone(data.phone2)) {
        toast('⚠️ رقم الهاتف الإضافي غير صحيح', 'danger');
        return false;
    }

    var dupCheck = checkDuplicateOrder(data);
    if (dupCheck.found) {
        if (!confirm(dupCheck.message + '\n\nهل تريد إضافة الطلب رغم التكرار؟')) return false;
    }

    var hasPriceWarning = false;
    data.products.forEach(function(p) {
        var product = allProducts.find(function(pr) { return pr.id === p.productId; });
        if (product && p.sellPrice < product.basePrice) {
            hasPriceWarning = true;
        }
    });
    if (hasPriceWarning) {
        if (!confirm('⚠️ سعر المنتج منخفض. هل أنت متأكد أن الطلب جديد وليس استبدال؟')) return false;
    }

    var orderCode = await generateOrderCode(data.pageId, data.creatorId);
    var productsToSave = data.products.map(function(p) {
        var product = allProducts.find(function(pr) { return pr.id === p.productId; });
        return {
            productId: p.productId,
            productName: product ? product.name : 'منتج',
            qty: p.qty,
            sellPrice: p.sellPrice,
            weightSize: p.weightSize,
            total: p.total
        };
    });

    var orderData = {
        orderCode: orderCode,
        customerName: data.customer,
        customerPhone: data.phone,
        customerPhone2: data.phone2,
        governorate: data.governorate,
        city: data.city,
        address: data.address,
        shippingType: 'تلقائي',
        shippingCost: data.shippingCost,
        baseShippingCost: data.baseShippingCost,
        shippingDiff: data.shippingDiff,
        products: productsToSave,
        total: data.total,
        statusType: data.statusType,  // <-- تمت الإضافة
        status: 'جديد',
        marketerId: data.creatorId,
        pageId: data.pageId,
        notes: data.notes,
        profit: data.totalProfit,
        createdBy: data.creatorId,
        createdByName: data.creatorName,
        createdByRole: data.creatorRole,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        edited: false,
        lastEditedBy: null,
        lastEditedByName: null,
        lastEditedByRole: null,
    };

    try {
        await db.collection('orders').add(orderData);
        var marketerRef = db.collection('marketers').doc(data.creatorId);
        var userData = allUsers.find(function(u) { return u.id === data.creatorId; });
        await marketerRef.set({
            userId: data.creatorId,
            name: userData ? userData.name : currentUserData.name || 'غير معروف',
            email: userData ? userData.email : currentUserData.email || '',
            pageId: data.pageId,
            totalProfit: firebase.firestore.FieldValue.increment(data.totalProfit),
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        toast('✅ تم إضافة الطلب بنجاح', 'success');
        closeModal();
        renderCurrentPage();
    } catch (err) {
        toast('❌ خطأ: ' + err.message, 'danger');
    }
    return false;
};

function collectOrderFormData(form) {
    var getVal = function(id) {
        var el = form.querySelector('#' + id);
        return el ? el.value.trim() : '';
    };
    var getSelectVal = function(id) {
        var el = form.querySelector('#' + id);
        return el ? el.value : '';
    };
    var getNumVal = function(id) {
        var el = form.querySelector('#' + id);
        var raw = el ? el.value : '0';
        return parseFloat(arabicToEnglishDigits(raw)) || 0;
    };

    var container = form.querySelector('#productsContainer');
    var productRows = container ? container.querySelectorAll('.product-row') : [];
    var products = [];
    productRows.forEach(function(row) {
        var productId = row.querySelector('.product-select') ? row.querySelector('.product-select').value : '';
        var sellPrice = parseFloat(row.querySelector('.product-price') ? row.querySelector('.product-price').value : 0) || 0;
        var weightSize = row.querySelector('.product-weight') ? row.querySelector('.product-weight').value : '';
        if (productId && sellPrice >= 0) {
            products.push({ productId: productId, qty: 1, sellPrice: sellPrice, weightSize: weightSize, total: sellPrice });
        }
    });

    var customer = getVal('orderCustomer');
    var phone = getVal('orderPhone');
    var phone2 = getVal('orderPhone2');
    var governorate = getSelectVal('orderGovernorate');
    var city = getSelectVal('orderCity');
    var address = getVal('orderAddress');
    var statusType = getSelectVal('orderStatusType') || 'شراء';
    var notes = getVal('orderNotes');

    var shippingCostInput = form.querySelector('#orderShippingCost');
    var shippingCostRaw = shippingCostInput ? shippingCostInput.value : '';
    var shippingCost = parseFloat(arabicToEnglishDigits(shippingCostRaw));
    if (isNaN(shippingCost) || shippingCost === undefined) {
        shippingCost = allSettings.shippingCost || 50;
    }

    var total = getNumVal('orderTotal');
    if (isNaN(total) || total <= 0) {
        total = products.reduce(function(sum, p) { return sum + p.total; }, 0) + shippingCost;
    }

    var totalProfit = 0;
    products.forEach(function(p) {
        var product = allProducts.find(function(pr) { return pr.id === p.productId; });
        if (product) {
            var basePrice = product.basePrice || 0;
            totalProfit += (p.sellPrice - basePrice) * p.qty;
        }
    });
    var baseShippingCostCalculated = customShippingCosts[city] || customShippingCosts[governorate] || allSettings.shippingCost || 50;
    var shippingDiff = shippingCost - baseShippingCostCalculated;
    totalProfit += shippingDiff;

    // حساب المستحق
    var due = total - baseShippingCostCalculated;

    var creatorId = form.querySelector('#orderCreatorId') ? form.querySelector('#orderCreatorId').value : currentUser.uid;
    var pageId = form.querySelector('#orderPageId') ? form.querySelector('#orderPageId').value : currentUserPageId || null;

    var creatorName = 'غير معروف';
    if (currentUserData && currentUserData.name) {
        creatorName = currentUserData.name;
    } else if (currentUser && currentUser.displayName) {
        creatorName = currentUser.displayName;
    } else if (currentUser && currentUser.email) {
        creatorName = currentUser.email;
    }

    var creatorRole = currentUserRole || 'marketer';
    var roleNamesMap = { admin: 'مدير', moderator: 'مشرف', marketer: 'مسوق', customer_service: 'خدمة عملاء' };
    var creatorRoleDisplay = roleNamesMap[creatorRole] || creatorRole;

    return {
        customer: customer,
        phone: phone,
        phone2: phone2,
        governorate: governorate,
        city: city,
        address: address,
        statusType: statusType,
        notes: notes,
        shippingCost: shippingCost,
        baseShippingCost: baseShippingCostCalculated,
        shippingDiff: shippingDiff,
        due: due, // <-- إضافة المستحق
        products: products,
        total: total,
        totalProfit: totalProfit,
        pageId: pageId,
        creatorId: creatorId,
        creatorName: creatorName,
        creatorRole: creatorRole,
        creatorRoleDisplay: creatorRoleDisplay
    };
}

// ================================================================
// التحقق من تكرار الطلب (نفس الهاتف أو نفس الاسم + العنوان)
// ================================================================
function checkDuplicateOrder(data) {
    const phone = normalizeEgyptianPhone(data.phone);
    const phone2 = data.phone2 ? normalizeEgyptianPhone(data.phone2) : '';
    const name = data.customer?.trim() || '';
    const governorate = data.governorate || '';
    const city = data.city || '';

    // مجموعة لتخزين معرفات الطلبات المكررة (لتجنب التكرار)
    const duplicateIds = new Set();
    const duplicateOrders = [];

    // 1. البحث عن طريق رقم الهاتف (أساسي أو إضافي)
    allOrders.forEach(o => {
        if (duplicateIds.has(o.id)) return;
        const oPhone = normalizeEgyptianPhone(o.customerPhone || '');
        const oPhone2 = normalizeEgyptianPhone(o.customerPhone2 || '');
        const match = (oPhone && (oPhone === phone || oPhone === phone2)) ||
                      (oPhone2 && (oPhone2 === phone || oPhone2 === phone2));
        if (match) {
            duplicateIds.add(o.id);
            duplicateOrders.push(o);
        }
    });

    // 2. البحث عن طريق الاسم + المحافظة + المدينة (إذا لم يتم العثور على مكررات بالهاتف)
    // أو حتى إذا تم العثور، نضيف المزيد
    if (name && governorate && city) {
        allOrders.forEach(o => {
            if (duplicateIds.has(o.id)) return;
            const oName = (o.customerName || '').trim();
            const oGov = (o.governorate || '').trim();
            const oCity = (o.city || '').trim();
            if (oName && oGov && oCity && oName === name && oGov === governorate && oCity === city) {
                duplicateIds.add(o.id);
                duplicateOrders.push(o);
            }
        });
    }

    if (duplicateOrders.length === 0) {
        return { found: false, count: 0, orders: [], message: '' };
    }

    // بناء رسالة مفصلة لجميع المكررات
    const details = duplicateOrders.map(o => {
        const page = allPages.find(p => p.id === o.pageId);
        const code = o.orderCode || '#' + o.id.slice(0, 8);
        const status = o.status || 'غير معروفة';
        const pageName = page?.name || 'غير معروفة';
        const createdDate = o.createdAt?.toDate ? 
            o.createdAt.toDate().toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : 
            (o.createdAt ? new Date(o.createdAt).toLocaleDateString('ar-EG') : 'غير معروف');
        return `📌 كود: ${code} | الحالة: ${status} | الصفحة: ${pageName} | التاريخ: ${createdDate}`;
    }).join('\n');

    const count = duplicateOrders.length;
    const msg = `⚠️ يوجد ${count} طلب مكرر:\n\n${details}\n\nهل تريد إضافة الطلب رغم التكرار؟`;

    return {
        found: true,
        count: count,
        orders: duplicateOrders,
        message: msg
    };
}

// دالة التحقق المركزية: ترجع { valid, errors, warnings, duplicateInfo }
function validateAndWarnOrder(data) {
    const errors = [];
    const warnings = [];

    // 1. رقم الهاتف
    if (!data.phone) {
        warnings.push('⚠️ رقم الهاتف فارغ، يرجى التأكد من صحته.');
    } else if (!isValidEgyptianPhone(data.phone)) {
        warnings.push('⚠️ رقم الهاتف غير صحيح أو غير مكتمل (يجب أن يكون 11 رقماً يبدأ بـ 01[0125]). يمكنك المتابعة مع هذا الرقم إذا كنت متأكداً.');
    }

    // 2. المحافظة والمدينة
    if (!data.governorate) {
        errors.push('⚠️ المحافظة مطلوبة.');
    }
    if (!data.city) {
        errors.push('⚠️ المدينة مطلوبة.');
    }

    // 3. المنتجات
    if (!data.products || data.products.length === 0) {
        errors.push('⚠️ يجب إضافة منتج واحد على الأقل.');
    } else {
        let hasMissingWeight = false;
        let hasPriceIssue = false;

        data.products.forEach((p) => {
            if (!p.weightSize || p.weightSize.trim() === '') {
                hasMissingWeight = true;
            }

            const product = allProducts.find(pr => pr.id === p.productId);
            const basePrice = product?.basePrice || 0;

            if (data.statusType === 'شراء') {
                if (p.sellPrice <= 0 || p.sellPrice < basePrice) {
                    hasPriceIssue = true;
                }
            }
        });

        if (hasMissingWeight) {
            warnings.push('⚠️ يوجد منتج بدون تحديد الوزن/المقاس، هل تريد المتابعة؟');
        }
        if (hasPriceIssue) {
            warnings.push('⚠️ سعر المنتج منخفض. هل أنت متأكد أن نوع الطلب "شراء" وليس "استبدال" أو "شراء واستبدال"؟');
        }
    }

    // 4. سعر الشحن
    if (data.shippingCost === undefined || data.shippingCost === null || isNaN(data.shippingCost)) {
        errors.push('⚠️ سعر الشحن مطلوب.');
    }

    // 5. المكررات – استخدام checkDuplicateOrder
    const dupCheck = checkDuplicateOrder(data);
    if (dupCheck.found) {
        warnings.push(dupCheck.message);
    }

    return {
        valid: errors.length === 0,
        errors: errors,
        warnings: warnings,
        duplicateInfo: dupCheck
    };
}

// ================================================================
let importState = { active: false, queue: [], index: 0, skipped: 0 };

const IMPORT_FIELD_ALIASES = {
    customerName: ['اسم العميل', 'العميل', 'اسم الزبون', 'الاسم', 'Customer', 'Name'],
    phone: ['رقم الهاتف', 'الهاتف', 'رقم العميل', 'التليفون', 'الموبايل', 'رقم الموبايل', 'Phone', 'Mobile'],
    phone2: ['رقم هاتف إضافي', 'هاتف إضافي', 'رقم ثاني', 'Phone2', 'Mobile2'],
    governorate: ['المحافظة', 'محافظة', 'Governorate'],
    city: ['المدينة', 'مدينة', 'الحي', 'City'],
    address: ['العنوان', 'عنوان', 'Address'],
    product: ['المنتج', 'منتج', 'اسم المنتج', 'Product'],
    qty: ['الكمية', 'كمية', 'العدد', 'Qty', 'Quantity'],
    weightSize: ['الوزن', 'المقاس', 'الوزن/المقاس', 'Weight', 'Size'],
    sellPrice: ['السعر', 'سعر البيع', 'المبلغ', 'Price', 'Amount'],
    notes: ['ملاحظات', 'ملحوظات', 'Notes']
};

function findByAliases(rowObj, aliases) {
    const keys = Object.keys(rowObj);
    const normAliases = aliases.map(normalizeArabic);
    for (const k of keys) {
        if (normAliases.includes(normalizeArabic(k))) return rowObj[k];
    }
    for (const k of keys) {
        const nk = normalizeArabic(k);
        if (normAliases.some(a => nk.includes(a) || a.includes(nk))) return rowObj[k];
    }
    return '';
}

function matchProduct(rawName, pageId) {
    if (!rawName) return { match: null, confidence: 0 };
    const list = allProducts.filter(p => p.pageId === pageId);
    if (!list.length) return { match: null, confidence: 0 };
    const norm = normalizeArabic(rawName);
    for (const p of list) {
        if (normalizeArabic(p.name) === norm) return { match: p, confidence: 1 };
    }
    let best = null, bestDist = Infinity;
    for (const p of list) {
        const dist = levenshtein(normalizeArabic(p.name), norm);
        if (dist < bestDist) { bestDist = dist; best = p; }
    }
    const maxLen = Math.max(normalizeArabic(best?.name || '').length, norm.length) || 1;
    const confidence = 1 - (bestDist / maxLen);
    return confidence >= 0.5 ? { match: best, confidence } : { match: null, confidence: 0 };
}

window.startOrderImport = function() {
    const fileInput = $('importFileInput');
    const file = fileInput?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }

    const pageId = currentUserPageId;
    if (!pageId) {
        toast('❌ حسابك غير مرتبط بصفحة. يرجى تخصيص صفحة لك أولاً.', 'danger');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
            if (!rows.length) { toast('❌ الملف فارغ أو لا يمكن قراءته', 'danger'); return; }

            const queue = rows.map(r => {
                // قراءة الحقول باستخدام الأسماء المتوقعة أو الأسماء البديلة
                const customerName = String(findByAliases(r, IMPORT_FIELD_ALIASES.customerName) || '').trim();
                const phoneRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.phone) || '').trim();
                const phone2Raw = String(findByAliases(r, IMPORT_FIELD_ALIASES.phone2) || '').trim();
                const govRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.governorate) || '').trim();
                const cityRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.city) || '').trim();
                const address = String(findByAliases(r, IMPORT_FIELD_ALIASES.address) || '').trim();
                const productRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.product) || '').trim();
                const qty = parseInt(findByAliases(r, IMPORT_FIELD_ALIASES.qty) || '1') || 1;
                const weightSize = String(findByAliases(r, IMPORT_FIELD_ALIASES.weightSize) || '').trim();
                const sellPrice = parseFloat(findByAliases(r, IMPORT_FIELD_ALIASES.sellPrice) || '0') || 0;
                const notes = String(findByAliases(r, IMPORT_FIELD_ALIASES.notes) || '').trim();

                // مطابقة المحافظة والمدينة
                const govResult = matchGovernorate(govRaw);
                const govMatch = govResult.match || '';
                const cityResult = govMatch ? matchCity(cityRaw, govMatch) : { match: null, confidence: 0 };
                const cityMatch = cityResult.match || '';

                // معالجة المنتجات (يمكن أن يكون عمود المنتج يحتوي على عدة منتجات)
                let products = [];
                if (productRaw) {
                    const items = productRaw.split(/[-;،]/).map(s => s.trim()).filter(Boolean);
                    items.forEach(item => {
                        const match = item.match(/^(.*?)\s*[\(（]\s*(?:سعر\s*)?([\d.]+)\s*[\)）]/);
                        if (match) {
                            products.push({ productName: match[1].trim(), sellPrice: parseFloat(match[2]) || 0 });
                        } else {
                            products.push({ productName: item, sellPrice: sellPrice || 0 });
                        }
                    });
                }
                if (!products.length && productRaw) {
                    products.push({ productName: productRaw, sellPrice: sellPrice || 0 });
                }

                const phone = normalizeEgyptianPhone(phoneRaw);
                const phoneValid = isValidEgyptianPhone(phone);

                return {
    customerName,
    phoneRaw: phoneRaw,
    phone,
    phoneValid,
    phone2Raw,
    phone2: normalizeEgyptianPhone(phone2Raw),
    phone2Valid: isValidEgyptianPhone(phone2Raw),
    governorate: govMatch,
    govConfidence: govResult.confidence,
    city: cityMatch,
    cityConfidence: cityResult.confidence,
    address,
    products: products.map(p => ({
        productId: '',  // سيتم مطابقته لاحقاً
        productName: p.productName,
        sellPrice: p.sellPrice || 0,
        qty: qty || 1,
        weightSize: weightSize || ''
    })),
    statusType: 'شراء',  // <-- أضف هذا السطر
    weightSize,
    notes,
    shippingCost: allSettings.shippingCost || 50
};
            }).filter(r => r.customerName || r.phoneRaw);

            if (!queue.length) { toast('❌ لم يتم العثور على أي طلبات صالحة في الملف', 'danger'); return; }

            // تعيين قائمة الاستيراد في النطاق العام وعرض واجهة المراجعة
            importQueue = queue;
            importResults = {};
            closeModal(); // إغلاق مودال اختيار الملف
            renderCurrentPage(); // ستقوم الدالة بعرض واجهة المراجعة عبر renderImportInterface
            toast(`✅ تم استيراد ${queue.length} طلب، راجعهم وأكّد أو تخطّ`);
        } catch (err) {
            toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger');
        }
    };
    reader.readAsArrayBuffer(file);
};

window.downloadBlankExcel = function() {
    const headers = [
        'اسم العميل', 'رقم الهاتف', 'رقم هاتف إضافي',
        'المحافظة', 'المدينة', 'العنوان',
        'المنتج', 'الوزن/المقاس', 'سعر الشحن', 'ملاحظات'
    ];
    const exampleRow = [
        'أحمد محمد', '01012345678', '01198765432',
        'القاهرة', 'مدينة نصر', 'شارع 9، عمارة 3',
        'تيشيرت (150); بنطلون (200)', '130ك; 160سم',
        '30', 'طلب عاجل'
    ];
    const wb = XLSX.utils.book_new();
    const data = [headers, exampleRow];
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = headers.map(() => ({ wch: 18 }));
    XLSX.utils.book_append_sheet(wb, ws, 'الطلبات');
    XLSX.writeFile(wb, 'قالب_استيراد_الطلبات.xlsx');
};

function renderImportStep() {
    const { queue, index } = importState;
    if (index >= queue.length) {
        const doneCount = index - importState.skipped;
        toast(`✅ انتهى الاستيراد — تم إضافة ${doneCount} طلب وتخطي ${importState.skipped}`);
        importState = { active: false, queue: [], index: 0, skipped: 0 };
        closeModal();
        renderCurrentPage();
        return;
    }
    const row = queue[index];
    const total = queue.length;

        // ================================================================
        // SALES MANAGEMENT (إدارة المبيعات)
        // ================================================================
        // Delivered orders => realized profit (gain)
        // Cancelled / returned orders => shipping cost is a loss (dispatched but not delivered)
        const LOST_STATUSES = ['ملغي', 'مرتجع'];

function computeSalesForOrders(orders) {
    // نأخذ في الاعتبار آخر حالة معروفة للطلب (قد تتغير)
    // نعتبر أن الطلب "تم التسليم" إذا كانت الحالة الحالية "تم التسليم"
    // وأيضاً نأخذ في الاعتبار الطلبات التي كانت مسلمة ثم تغيرت حالتها إلى ملغي/مرتجع
    // نستخدم سجل التغييرات إن وجد، أو نعتمد على الحالة الحالية مع خصم الإيرادات السابقة

    // هنا نبسط: نعتمد على الحالة الحالية فقط، ولكن مع خاصية أن الطلبات الملغية/المرتجعة لا تحسب كأرباح
    const delivered = orders.filter(o => o.status === 'تم التسليم');
    const lost = orders.filter(o => ['ملغي', 'مرتجع'].includes(o.status));
    const pending = orders.filter(o => !['تم التسليم', 'ملغي', 'مرتجع'].includes(o.status));

    // الأرباح من الطلبات المسلمة حالياً
    const gain = delivered.reduce((s, o) => s + (o.profit || 0), 0);
    // الخسائر من الطلبات الملغية/المرتجعة (تحتسب تكلفة الشحن الأساسية)
    const loss = lost.reduce((s, o) => s + (o.baseShippingCost || o.shippingCost || 0), 0);

    return {
        deliveredCount: delivered.length,
        lostCount: lost.length,
        pendingCount: pending.length,
        totalCount: orders.length,
        gain, loss,
        net: gain - loss
    };
}

// ================================================================
// دالة مساعدة لحساب المستحق المحصل فعلياً من شركة الشحن
// ================================================================
function getOrderCollectedDue(order) {
    // الطلبات المسلّمة
    if (order.status === 'تسليم') {
        // إذا كان هناك قيمة مستوردة من ملف الشحن
        if (order.shippingImportDue !== undefined && order.shippingImportDue !== null) {
            return order.shippingImportDue;
        }
        // وإلا نستخدم الإجمالي - سعر الشحن الأساسي
        return (order.total || 0) - (order.baseShippingCost || 0);
    }
    // الطلبات المرتجعة
    if (order.status === 'مرتجع') {
        if (order.returnSettlement !== undefined && order.returnSettlement !== null) {
            return order.returnSettlement;
        }
        // إذا لم توجد تسوية، نرجع null (سيظهر —)
        return null;
    }
    // الطلبات الأخرى لا يوجد مستحق محصل
    return null;
}

// ================================================================
// دالة فتح/غلق جميع الأيام في مرحلة الشحن (تعريف مضمون)
// ================================================================
window.toggleAllShippingDaysInStage = function(stage) {
    const stageId = stage.replace(/\s+/g, '_');
    const STORAGE_KEY = 'shipping_days_state_' + stage;
    
    // جلب جميع أيام هذه المرحلة من DOM
    const scrollBody = document.getElementById('stageBodyScroll_' + stageId);
    if (!scrollBody) {
        toast('⚠️ لم يتم العثور على حاوية المرحلة', 'warning');
        return;
    }
    const dayElements = scrollBody.querySelectorAll('.day-section');
    if (!dayElements.length) {
        toast('⚠️ لا توجد أيام في هذه المرحلة', 'info');
        return;
    }
    
    // بناء الحالة الحالية للأيام من DOM
    let storedState = {};
    try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (raw) storedState = JSON.parse(raw);
    } catch (e) {}
    
    // إذا كانت storedState فارغة، نبنيها من DOM
    const dayKeys = Array.from(dayElements).map(el => el.dataset.day).filter(Boolean);
    dayKeys.forEach(day => {
        if (!storedState.hasOwnProperty(day)) {
            const body = document.getElementById(`shippingDayBody_${stage}_${day}`);
            storedState[day] = body ? body.style.display !== 'none' : true;
        }
    });
    
    // تحديد الحالة الجديدة (عكس الحالة الحالية لليوم الأول)
    const firstDay = dayKeys[0];
    const currentState = storedState[firstDay] !== undefined ? storedState[firstDay] : true;
    const newState = !currentState;
    
    // تطبيق الحالة الجديدة على جميع الأيام
    dayKeys.forEach(day => {
        storedState[day] = newState;
        const body = document.getElementById(`shippingDayBody_${stage}_${day}`);
        const arrow = document.getElementById(`shippingArrow_${stage}_${day}`);
        if (body) body.style.display = newState ? 'block' : 'none';
        if (arrow) arrow.textContent = newState ? '▾' : '▸';
    });
    
    // حفظ الحالة الجديدة
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(storedState));
    
    // تحديث العدادات
    if (typeof window.updateShippingCounts === 'function') {
        window.updateShippingCounts(stageId);
    } else {
        // تعريف دالة updateShippingCounts إذا لم تكن موجودة
        function updateShippingCountsFallback(stageId) {
            const scrollBody = document.getElementById('stageBodyScroll_' + stageId);
            if (!scrollBody) return;
            const visibleRows = scrollBody.querySelectorAll('.shipping-table-body tr:not([style*="display: none"])');
            const count = visibleRows.length;
            const countEl = document.getElementById('stageCount_' + stageId);
            if (countEl) {
                countEl.textContent = count;
                countEl.style.background = count === 0 ? 'var(--muted)' : '';
            }
            const daySections = scrollBody.querySelectorAll('.day-section');
            daySections.forEach(daySection => {
                const day = daySection.dataset.day;
                if (!day) return;
                const dayVisibleRows = daySection.querySelectorAll('.shipping-table-body tr:not([style*="display: none"])');
                const dayCount = dayVisibleRows.length;
                const stageName = stageId.replace(/_/g, ' ');
                const dayCountId = `dayCount_${stageName}_${day}`;
                const dayCountElement = document.getElementById(dayCountId);
                if (dayCountElement) {
                    dayCountElement.textContent = dayCount + ' طلب';
                    dayCountElement.style.background = dayCount === 0 ? 'var(--muted)' : '';
                }
            });
        }
        updateShippingCountsFallback(stageId);
    }
};

// ================================================================
// الحذف النهائي التلقائي بعد 14 يوم (نسخة بدون فهرس مركب)
// ================================================================
async function permanentDeleteExpiredOrders() {
    try {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 14);
        // جلب جميع الطلبات المحذوفة (بدون فلترة deletedAt)
        const snapshot = await db.collection('orders')
            .where('isDeleted', '==', true)
            .get();
        const expired = snapshot.docs.filter(doc => {
            const deletedAt = doc.data().deletedAt?.toDate?.() || new Date(doc.data().deletedAt);
            return deletedAt <= cutoff;
        });
        if (expired.length === 0) return;
        const batch = db.batch();
        expired.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        console.log(`✅ تم حذف ${expired.length} طلب نهائياً (انتهت مدة 14 يوم)`);
    } catch (err) {
        console.warn('خطأ في الحذف النهائي:', err);
    }
}

        (o.status === 'تسليم' || o.status === 'تم التسليم' || o.status === 'ملغي') && !o.isDeleted && o.returnReceived !== true
    );

}).join('');
        const arrow = isOpen ? '▾' : '▸';

                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="font-weight:700;">📅 ${dayLabel}</span>

                </div>
                <span class="day-arrow" id="completedArrow_${day}" style="font-size:18px;">${arrow}</span>
            </div>
            <div class="day-body" id="completedDayBody_${day}" style="display:${isOpen?'block':'none'}; padding:12px 16px;">
                <div class="table-wrap">
                    <table>
                      <thead><tr><th>كود الطلب</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>الإجمالي</th><th>المستحق المحصل</th><th>المحافظة</th><th>المرحلة</th><th>الحالة</th><th>الصفحة</th><th>إجراء</th></tr></thead>
                        <tbody>${rows}</tbody>

    // أزرار تصدير وطباعة
    const exportBtn = `<button class="btn btn-sm btn-success" onclick="exportOrdersToExcel(orders, '${title}')">📥 تصدير Excel</button>`;

    return `

window.applyShippingBulkStatus = function(stageId) {
    const status = document.getElementById(`shippingBulkStatusSelect_${stageId}`)?.value;
    if (!status) { toast('❌ اختر حالة أولاً', 'danger'); return; }

            renderCurrentPage();
        })
        .catch(err => toast('❌ ' + err.message, 'danger'));
};

window.filterShippingStage = function(stage, searchVal) {
    searchVal = searchVal.trim().toLowerCase();
    const stageId = stage.replace(/\s+/g, '_');
    const scrollBody = document.getElementById('stageBodyScroll_' + stageId);
    if (!scrollBody) return;

    const rows = scrollBody.querySelectorAll('.shipping-table-body tr');
    let visibleCount = 0;
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        const show = searchVal === '' || text.includes(searchVal);
        row.style.display = show ? '' : 'none';
        if (show) visibleCount++;
    });

    // تحديث عداد المرحلة
    const countEl = document.getElementById('stageCount_' + stageId);
    if (countEl) {
        countEl.textContent = visibleCount;
        countEl.style.background = visibleCount === 0 ? 'var(--muted)' : '';
    }

    // تحديث عدادات الأيام
    const daySections = scrollBody.querySelectorAll('.day-section');
    daySections.forEach(daySection => {
        const day = daySection.dataset.day;
        if (!day) return;
        const dayVisibleRows = daySection.querySelectorAll('.shipping-table-body tr:not([style*="display: none"])');
        const dayCount = dayVisibleRows.length;
        const dayCountId = `dayCount_${stage}_${day}`;
        const dayCountElement = document.getElementById(dayCountId);
        if (dayCountElement) {
            dayCountElement.textContent = dayCount + ' طلب';
            dayCountElement.style.background = dayCount === 0 ? 'var(--muted)' : '';
        }
        // إخفاء اليوم إذا كان فارغاً
        const dayBody = daySection.querySelector('.day-body');
        if (dayBody) {
            dayBody.style.display = dayCount > 0 ? 'block' : 'none';
        }
    });
};

window.toggleAllMyOrdersDays = function() {
    const MY_STORAGE_KEY = 'medora_myorders_days_state';
    let storedState = {};
    try {
        const raw = sessionStorage.getItem(MY_STORAGE_KEY);
        if (raw) storedState = JSON.parse(raw);
    } catch (e) {}

    const dayKeys = Object.keys(storedState);
    if (dayKeys.length === 0) {
        // لا توجد أيام مخزنة، نأخذ من DOM
        const dayElements = document.querySelectorAll('#myOrdersWrap .day-section');
        dayElements.forEach(el => {
            const day = el.dataset.day;
            if (day) {
                const body = document.getElementById(`myOrdersDayBody_${day}`);
                if (body) {
                    const isOpen = body.style.display !== 'none';
                    storedState[day] = !isOpen;
                }
            }
        });
    } else {
        const allOpen = Object.values(storedState).every(v => v === true);
        const newState = !allOpen;
        dayKeys.forEach(day => storedState[day] = newState);
    }

    Object.entries(storedState).forEach(([day, isOpen]) => {
        const body = document.getElementById(`myOrdersDayBody_${day}`);
        const arrow = document.getElementById(`myOrdersArrow_${day}`);
        if (body) {
            body.style.display = isOpen ? 'block' : 'none';
        }
        if (arrow) {
            arrow.textContent = isOpen ? '▾' : '▸';
        }
    });

    sessionStorage.setItem(MY_STORAGE_KEY, JSON.stringify(storedState));
};

                isDeleted: true,
                deletedAt: firebase.firestore.FieldValue.serverTimestamp(),
                deletedBy: currentUser.uid,
                originalStatus: o.status || 'جديد',
                status: 'محذوف',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

        function findOrderForShippingRow(r) {
            const codeRaw = String(findByAliases(r, ['كود الطلب', 'كود الطلب', 'Order Code', 'Order ID', 'Code']) || '').trim().replace(/^#/, '');
            const phoneRaw = String(findByAliases(r, IMPORT_FIELD_ALIASES.phone) || '').trim();
            if (codeRaw) {
                const byCode = allOrders.find(o => (o.orderCode && o.orderCode.replace(/^#/, '') === codeRaw) || o.id.startsWith(codeRaw) || o.id === codeRaw);
                if (byCode) return byCode;
            }
            if (phoneRaw) {
                const normPhone = normalizeEgyptianPhone(phoneRaw);
                const byPhone = allOrders.find(o => normalizeEgyptianPhone(o.customerPhone || '') === normPhone && normPhone);
                if (byPhone) return byPhone;

window.processDeliveredImport = function() {
    const file = $('deliveredFileInput')?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }
    const reader = new FileReader();
    reader.onload = async function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            let matched = 0, unmatched = 0;
            const batch = db.batch();
            rows.forEach(r => {
                const order = findOrderForShippingRow(r);
                if (order) {
                    matched++;
                    batch.update(db.collection('orders').doc(order.id), {
                        status: 'تسليم',  // تغيير من "تم التسليم" إلى "تسليم"
                        deliveredAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else { unmatched++; }
            });
            await batch.commit();
            toast(`✅ تم تحديث ${matched} طلب إلى "تسليم"${unmatched ? ` — تعذّر إيجاد ${unmatched} طلب` : ''}`);
            closeModal();
            renderCurrentPage();
        } catch (err) { toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger'); }
    };
    reader.readAsArrayBuffer(file);
};

// نعدل دالة processReturnedImport لاستخدام "مرتجع" (بدلاً من "مرفوض")
window.processReturnedImport = function() {
    const file = $('returnedFileInput')?.files?.[0];
    if (!file) { toast('❌ يرجى اختيار ملف أولاً', 'danger'); return; }
    const reader = new FileReader();
    reader.onload = async function(evt) {
        try {
            const wb = XLSX.read(evt.target.result, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            let matched = 0, unmatched = 0;
            const batch = db.batch();
            rows.forEach(r => {
                const order = findOrderForShippingRow(r);
                if (!order) { unmatched++; return; }
                matched++;
                const statusRaw = String(findByAliases(r, ['الحالة', 'النتيجة', 'Status']) || '').trim();
                const newStatus = statusRaw.includes('رفض') ? 'مرتجع' : 'مرتجع'; // دائماً مرتجع
                const valueRaw = findByAliases(r, ['القيمة الجديدة', 'القيمة', 'السعر الجديد', 'قيمة المرتجع', 'Value', 'Amount']);
                const updateData = { status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                if (valueRaw !== '' && valueRaw !== undefined && !isNaN(parseFloat(valueRaw))) {
                    updateData.total = parseFloat(valueRaw);
                }
                batch.update(db.collection('orders').doc(order.id), updateData);
            });
            await batch.commit();
            toast(`✅ تم تحديث ${matched} طلب إلى "مرتجع"${unmatched ? ` — تعذّر إيجاد ${unmatched} طلب` : ''}`);
            closeModal();
            renderCurrentPage();
        } catch (err) { toast('❌ تعذّرت قراءة الملف: ' + err.message, 'danger'); }
    };
    reader.readAsArrayBuffer(file);
};

async function saveGovernorate(e) {

    const price = parseFloat(document.getElementById('govPrice').value);

    GOVERNORATE_CITIES[name] = cities;

    try {

async function updateGovernorate(oldName, e) {
    e.preventDefault();
    const newName = document.getElementById('govName').value.trim();
    const classification = document.getElementById('govClassification').value;
    const citiesRaw = document.getElementById('govCities').value;
    const cities = citiesRaw ? citiesRaw.split(/[,،]/).map(s => s.trim()).filter(Boolean) : [];

    if (!newName) { toast('❌ اسم المحافظة مطلوب', 'danger'); return false; }

    // تحديث الكائنات
    if (oldName !== newName) {
        if (GOVERNORATE_CITIES[newName]) { toast('❌ المحافظة موجودة بالفعل', 'danger'); return false; }
        // نقل المدن والأسعار
        GOVERNORATE_CITIES[newName] = cities;
        delete GOVERNORATE_CITIES[oldName];
        if (customShippingCosts[oldName] !== undefined) {
            customShippingCosts[newName] = customShippingCosts[oldName];
            delete customShippingCosts[oldName];
        }
        // تحديث التصنيف
        for (const s of Object.keys(GOVERNORATE_CLASSIFICATION)) {
            const idx = GOVERNORATE_CLASSIFICATION[s].indexOf(oldName);
            if (idx !== -1) {
                GOVERNORATE_CLASSIFICATION[s].splice(idx, 1);
                if (!GOVERNORATE_CLASSIFICATION[classification].includes(newName)) {
                    GOVERNORATE_CLASSIFICATION[classification].push(newName);
                }
                break;
            }
        }
    } else {
        GOVERNORATE_CITIES[oldName] = cities;
        // تحديث التصنيف إذا تغير
        let found = false;
        for (const s of Object.keys(GOVERNORATE_CLASSIFICATION)) {
            const idx = GOVERNORATE_CLASSIFICATION[s].indexOf(oldName);
            if (idx !== -1) {
                if (s !== classification) {
                    GOVERNORATE_CLASSIFICATION[s].splice(idx, 1);
                    if (!GOVERNORATE_CLASSIFICATION[classification].includes(oldName)) {
                        GOVERNORATE_CLASSIFICATION[classification].push(oldName);
                    }
                }
                found = true;
                break;
            }
        }
        if (!found && !GOVERNORATE_CLASSIFICATION[classification].includes(oldName)) {
            GOVERNORATE_CLASSIFICATION[classification].push(oldName);
        }
    }

    try {
        await db.collection('settings').doc('general').set({
            governorateCities: GOVERNORATE_CITIES,
            governorateClassification: GOVERNORATE_CLASSIFICATION,
            customShippingCosts: customShippingCosts
        }, { merge: true });
        toast('✅ تم تحديث المحافظة');
        closeModal();
        renderCurrentPage();
    } catch (err) { toast('❌ ' + err.message, 'danger'); }
    return false;
}

        for (const s of Object.keys(GOVERNORATE_CLASSIFICATION)) {
            const idx = GOVERNORATE_CLASSIFICATION[s].indexOf(gov);
            if (idx !== -1) GOVERNORATE_CLASSIFICATION[s].splice(idx, 1);

            governorateClassification: GOVERNORATE_CLASSIFICATION,

        }, { merge: true });

async function saveCityPrice(city, e) {
    e.preventDefault();
    const price = parseFloat(document.getElementById('cityPriceInput').value);
    if (price && !isNaN(price) && price > 0) {
        customShippingCosts[city] = price;
    } else {
        delete customShippingCosts[city];
    }
    try {
        await db.collection('settings').doc('general').set({
            customShippingCosts: customShippingCosts
        }, { merge: true });
        toast('✅ تم تحديث سعر المدينة');
        closeModal();
        renderCurrentPage();
    } catch (err) { toast('❌ ' + err.message, 'danger'); }
    return false;
}

async function saveGlobalPrices(e) {
    e.preventDefault();
    const baseCost = parseFloat(document.getElementById('baseCostGlobal').value);
    const newPrices = {};

    // أسعار المحافظات
    document.querySelectorAll('.gov-price-global').forEach(inp => {
        const key = inp.dataset.key;
        const val = parseFloat(inp.value);
        if (val && !isNaN(val) && val > 0) newPrices[key] = val;
    });

    // أسعار المدن
    document.querySelectorAll('.city-price-global').forEach(inp => {
        const row = inp.closest('div');
        const citySelect = row.querySelector('.city-name-global');
        const city = citySelect?.value;
        const val = parseFloat(inp.value);
        if (city && val && !isNaN(val) && val > 0) newPrices[city] = val;
    });

    customShippingCosts = newPrices;
    if (baseCost && !isNaN(baseCost) && baseCost > 0) {
        allSettings.shippingCost = baseCost;
    }

    try {
        await db.collection('settings').doc('general').set({
            shippingCost: allSettings.shippingCost,
            customShippingCosts: customShippingCosts
        }, { merge: true });
        toast('✅ تم حفظ جميع الأسعار');
        closeModal();
        renderCurrentPage();
    } catch (err) { toast('❌ ' + err.message, 'danger'); }
    return false;
}

function addCityPriceRowGlobal() {
    const container = document.getElementById('cityPricesGlobalContainer');
    if (!container) return;
    const firstGov = Object.keys(GOVERNORATE_CITIES)[0] || '';
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:4px;';
    div.innerHTML = `
        <select class="city-gov-global" style="flex:1;" onchange="updateCitySelectGlobal(this.closest('div').querySelector('.city-name-global'), this.value)">
            ${Object.keys(GOVERNORATE_CITIES).map(g => `<option value="${g}">${g}</option>`).join('')}
        </select>
        <select class="city-name-global" style="flex:2;">
            ${(GOVERNORATE_CITIES[firstGov] || []).map(c => `<option value="${c}">${c}</option>`).join('')}
        </select>
        <input type="number" class="city-price-global" step="0.01" placeholder="السعر" style="flex:1;" />
        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">✕</button>

function updateCitySelectGlobal(citySelect, governorate) {
    if (!citySelect) return;
    const cities = GOVERNORATE_CITIES[governorate] || [];
    const currentCity = citySelect.value;
    citySelect.innerHTML = cities.map(c => `<option value="${c}" ${c===currentCity?'selected':''}>${c}</option>`).join('');
}
